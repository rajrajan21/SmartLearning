<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="100%" role="img"><rect width="600" height="250" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="300" y="22" text-anchor="middle" font-weight="bold">Thermal expansion</text><rect x="30" y="60" width="150" height="22" fill="#aed6f1" stroke="#333"/><rect x="30" y="100" width="185" height="22" fill="#f5b7b1" stroke="#333"/><text x="35" y="55" font-size="13">Before heating: L0</text><text x="35" y="140" font-size="13">After heating: L0 + dL</text><text x="30" y="170" font-size="14">dL = alpha x L0 x dT   (linear)</text><text x="30" y="192" font-size="14">dA = alpha_A x A0 x dT (area)</text><text x="30" y="214" font-size="14">dV = alpha_V x V0 x dT (volume)</text><text x="320" y="55" font-size="14" font-weight="bold">Order of expansion</text><text x="320" y="80" font-size="14">Gas  (most)</text><text x="320" y="102" font-size="14">Liquid</text><text x="320" y="124" font-size="14">Solid (least)</text><rect x="470" y="60" width="40" height="120" fill="none" stroke="#333"/><rect x="470" y="110" width="40" height="70" fill="#d6eaf8"/><line x1="470" y1="110" x2="510" y2="110" stroke="#c0392b" stroke-width="2"/><text x="520" y="114" font-size="12">L2 (apparent)</text><text x="520" y="75" font-size="12">L3 after heating</text><text x="320" y="170" font-size="13">Real expansion = apparent expansion</text><text x="320" y="190" font-size="13">+ expansion of the container</text></g></svg>