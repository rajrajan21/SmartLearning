<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" width="100%" role="img"><rect width="560" height="270" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280.0" y="24" text-anchor="middle" font-weight="bold">Solutions with NaCl in 100 g of water at 25 C</text><path d="M20 70 L20 170 Q20 180 30 180 L110 180 Q120 180 120 170 L120 70" fill="none" stroke="#333" stroke-width="2"/><rect x="22" y="110" width="96" height="68" fill="#d6eaf8"/><text x="70" y="60" text-anchor="middle" font-weight="bold" font-size="13">Unsaturated</text><text x="70" y="205" text-anchor="middle" font-size="12">10 to 30 g dissolved</text><path d="M230 70 L230 170 Q230 180 240 180 L320 180 Q330 180 330 170 L330 70" fill="none" stroke="#333" stroke-width="2"/><rect x="232" y="110" width="96" height="68" fill="#d6eaf8"/><text x="280" y="60" text-anchor="middle" font-weight="bold" font-size="13">Saturated</text><text x="280" y="205" text-anchor="middle" font-size="12">36 g: limit reached</text><path d="M440 70 L440 170 Q440 180 450 180 L530 180 Q540 180 540 170 L540 70" fill="none" stroke="#333" stroke-width="2"/><rect x="442" y="110" width="96" height="68" fill="#d6eaf8"/><text x="490" y="60" text-anchor="middle" font-weight="bold" font-size="13">Supersaturated</text><text x="490" y="205" text-anchor="middle" font-size="12">40 g: unstable</text><circle cx="270" cy="170" r="3" fill="#555"/><circle cx="290" cy="172" r="3" fill="#555"/><circle cx="480" cy="172" r="3" fill="#555"/><text x="280" y="240" text-anchor="middle" font-size="13">Solubility = mass of solute / mass of solvent x 100 (g per 100 g)</text><text x="280" y="260" text-anchor="middle" font-size="12">Warm water usually dissolves more solid; a disturbed supersaturated solution forms crystals</text></g></svg>