<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 290" width="100%" role="img"><rect width="560" height="290" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="22" text-anchor="middle" font-weight="bold">Jurisdictions of the Supreme Court</text><rect x="10" y="40" width="170" height="100" rx="8" fill="#d6eaf8" stroke="#333"/><text x="95.0" y="62" text-anchor="middle" font-size="11" font-weight="bold">Original</text><text x="95.0" y="78" text-anchor="middle" font-size="11">Centre vs states,</text><text x="95.0" y="94" text-anchor="middle" font-size="11">state vs state, writs for</text><text x="95.0" y="110" text-anchor="middle" font-size="11">fundamental rights</text><rect x="195" y="40" width="170" height="100" rx="8" fill="#d5f5e3" stroke="#333"/><text x="280.0" y="62" text-anchor="middle" font-size="11" font-weight="bold">Appellate</text><text x="280.0" y="78" text-anchor="middle" font-size="11">final court of appeal</text><text x="280.0" y="94" text-anchor="middle" font-size="11">civil, criminal, constitutional</text><rect x="380" y="40" width="170" height="100" rx="8" fill="#fcf3cf" stroke="#333"/><text x="465.0" y="62" text-anchor="middle" font-size="11" font-weight="bold">Advisory</text><text x="465.0" y="78" text-anchor="middle" font-size="11">President refers questions</text><text x="465.0" y="94" text-anchor="middle" font-size="11">of law or fact</text><rect x="10" y="155" width="265" height="90" rx="8" fill="#fadbd8" stroke="#333"/><text x="142.5" y="177" text-anchor="middle" font-size="11" font-weight="bold">Judicial Review</text><text x="142.5" y="193" text-anchor="middle" font-size="11">examines whether a law</text><text x="142.5" y="209" text-anchor="middle" font-size="11">is unconstitutional</text><rect x="285" y="155" width="265" height="90" rx="8" fill="#ebdef0" stroke="#333"/><text x="417.5" y="177" text-anchor="middle" font-size="11" font-weight="bold">Miscellaneous</text><text x="417.5" y="193" text-anchor="middle" font-size="11">its law binds all courts,</text><text x="417.5" y="209" text-anchor="middle" font-size="11">makes its own rules</text><text x="280" y="270" text-anchor="middle" font-size="13">Inaugurated 28 January 1950, successor of the Federal Court of 1935</text></g></svg>