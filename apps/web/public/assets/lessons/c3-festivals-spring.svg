<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 235" width="100%" role="img"><rect width="580" height="235" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><rect x="10" y="10" width="560" height="215" rx="10" fill="#fffdf2" stroke="#333" stroke-width="2"/><text x="290" y="36" text-anchor="middle" font-weight="bold">Spring festivals we met in this chapter</text><rect x="30" y="50" width="520" height="34" rx="8" fill="#ffd6e0" stroke="#333"/><text x="45" y="72" font-weight="bold">Kashmir: Tulip festival</text><text x="210" y="72" font-size="14">tulips, haakh with hot rice</text><rect x="30" y="92" width="520" height="34" rx="8" fill="#ffe5d6" stroke="#333"/><text x="45" y="114" font-weight="bold">Jammu and Himalayas: Spring festival</text><text x="210" y="114" font-size="14">buransh and mustard flowers at the doorstep</text><rect x="30" y="134" width="520" height="34" rx="8" fill="#fff3b0" stroke="#333"/><text x="45" y="156" font-weight="bold">Kerala: Vishu</text><text x="210" y="156" font-size="14">yellow amaltas flowers, fruits, vegetables (Vishu Kani)</text><rect x="30" y="176" width="520" height="34" rx="8" fill="#e5f5e0" stroke="#333"/><text x="45" y="198" font-weight="bold">Jharkhand: Sarhul</text><text x="210" y="198" font-size="14">sakhua flowers, procession, drums, dance</text></g></svg>