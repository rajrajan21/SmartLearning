<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" width="100%" role="img"><rect width="560" height="260" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="22" text-anchor="middle" font-weight="bold">Left movement to Quit India</text><rect x="15" y="36" width="530" height="31" rx="6" fill="#fadbd8" stroke="#333"/><text x="23" y="57" font-size="12" font-weight="bold">1920</text><text x="130" y="57" font-size="12">Communist Party of India founded at Tashkent</text><rect x="15" y="72" width="530" height="31" rx="6" fill="#fcf3cf" stroke="#333"/><text x="23" y="93" font-size="12" font-weight="bold">1924-25</text><text x="130" y="93" font-size="12">HRA formed, Kakori train robbery</text><rect x="15" y="108" width="530" height="31" rx="6" fill="#d5f5e3" stroke="#333"/><text x="23" y="129" font-size="12" font-weight="bold">1928-30</text><text x="130" y="129" font-size="12">Bhagat Singh, Sanders, Assembly bomb, Chittagong raid</text><rect x="15" y="144" width="530" height="31" rx="6" fill="#d6eaf8" stroke="#333"/><text x="23" y="165" font-size="12" font-weight="bold">1935-37</text><text x="130" y="165" font-size="12">Government of India Act, Congress wins 7 of 11</text><rect x="15" y="180" width="530" height="31" rx="6" fill="#ebdef0" stroke="#333"/><text x="23" y="201" font-size="12" font-weight="bold">Mar 1942</text><text x="130" y="201" font-size="12">Cripps Mission fails</text><rect x="15" y="216" width="530" height="31" rx="6" fill="#fdebd0" stroke="#333"/><text x="23" y="237" font-size="12" font-weight="bold">8 Aug 1942</text><text x="130" y="237" font-size="12">Quit India Resolution, Do or Die</text></g></svg>