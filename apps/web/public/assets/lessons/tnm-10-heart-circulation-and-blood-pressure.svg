<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="100%" role="img"><rect width="560" height="300" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="24" text-anchor="middle" font-weight="bold">Double circulation in the human heart</text><rect x="200" y="100" width="160" height="110" rx="20" fill="#fadbd8" stroke="#c0392b" stroke-width="2"/><line x1="280" y1="100" x2="280" y2="210" stroke="#c0392b"/><line x1="200" y1="150" x2="360" y2="150" stroke="#c0392b"/><text x="240" y="130" text-anchor="middle" font-size="13">Right atrium</text><text x="320" y="130" text-anchor="middle" font-size="13">Left atrium</text><text x="240" y="185" text-anchor="middle" font-size="13">Right ventricle</text><text x="320" y="185" text-anchor="middle" font-size="13">Left ventricle</text><rect x="20" y="115" width="130" height="40" rx="10" fill="#aed6f1" stroke="#333"/><text x="85" y="140" text-anchor="middle" font-size="14">Body organs</text><rect x="410" y="115" width="130" height="40" rx="10" fill="#d5f5e3" stroke="#333"/><text x="475" y="140" text-anchor="middle" font-size="14">Lungs</text><text x="280" y="60" text-anchor="middle" font-size="13" fill="#2874a6">Deoxygenated: body -> right atrium -> right ventricle -> pulmonary artery -> lungs</text><text x="280" y="82" text-anchor="middle" font-size="13" fill="#c0392b">Oxygenated: lungs -> pulmonary vein -> left atrium -> left ventricle -> aorta -> body</text><text x="280" y="250" text-anchor="middle" font-size="14">Cardiac cycle 0.8 s: atrial systole 0.1 + ventricular systole 0.3 + diastole 0.4</text><text x="280" y="275" text-anchor="middle" font-size="13">Heart beat 72-75 per minute; BP 120/80 mm Hg</text></g></svg>