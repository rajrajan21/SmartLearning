<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 292" width="100%" role="img"><rect width="520" height="292" fill="#ffffff"/><g font-family="sans-serif" font-size="13" fill="#222" stroke-linecap="round" stroke-linejoin="round"><text x="260" y="22" font-size="15" fill="#2874a6" text-anchor="middle" font-weight="bold">The Indian parliamentary system</text><rect x="170" y="32" width="180" height="28" rx="6" fill="#fdf2d0" stroke="#b7950b" stroke-width="2"/><text x="260.0" y="50.0" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">Government: three organs</text><line x1="260" y1="60" x2="85" y2="78" stroke="#555" stroke-width="1.5"/><rect x="10" y="78" width="150" height="40" rx="6" fill="#eaf4fb" stroke="#2874a6" stroke-width="2"/><text x="85.0" y="93.5" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">Legislature</text><text x="85.0" y="110.5" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">makes laws</text><line x1="260" y1="60" x2="260" y2="78" stroke="#555" stroke-width="1.5"/><rect x="185" y="78" width="150" height="40" rx="6" fill="#d5f5e3" stroke="#2874a6" stroke-width="2"/><text x="260.0" y="93.5" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">Executive</text><text x="260.0" y="110.5" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">carries out laws</text><line x1="260" y1="60" x2="435" y2="78" stroke="#555" stroke-width="1.5"/><rect x="360" y="78" width="150" height="40" rx="6" fill="#fadbd8" stroke="#2874a6" stroke-width="2"/><text x="435.0" y="93.5" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">Judiciary</text><text x="435.0" y="110.5" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">interprets laws</text><line x1="85" y1="118" x2="85" y2="136" stroke="#555" stroke-width="1.5"/><rect x="10" y="136" width="240" height="96" rx="6" fill="#fff" stroke="#2874a6" stroke-width="2"/><text x="130.0" y="150.5" font-size="11" fill="#222" text-anchor="middle" font-weight="bold">Parliament</text><text x="130.0" y="165.5" font-size="11" fill="#222" text-anchor="middle" font-weight="normal">President</text><text x="130.0" y="180.5" font-size="11" fill="#222" text-anchor="middle" font-weight="normal">Lok Sabha: House of the People</text><text x="130.0" y="195.5" font-size="11" fill="#222" text-anchor="middle" font-weight="normal">(directly elected, five-year term)</text><text x="130.0" y="210.5" font-size="11" fill="#222" text-anchor="middle" font-weight="normal">Rajya Sabha: Council of States</text><text x="130.0" y="225.5" font-size="11" fill="#222" text-anchor="middle" font-weight="normal">(permanent; one-third retire every 2 years)</text><line x1="260" y1="118" x2="260" y2="127" stroke="#555" stroke-width="1.5"/><line x1="260" y1="127" x2="390" y2="127" stroke="#555" stroke-width="1.5"/><line x1="390" y1="127" x2="390" y2="136" stroke="#555" stroke-width="1.5"/><rect x="270" y="136" width="240" height="96" rx="6" fill="#fff" stroke="#1e8449" stroke-width="2"/><text x="390.0" y="165.5" font-size="11" fill="#222" text-anchor="middle" font-weight="bold">Real and nominal executive</text><text x="390.0" y="180.5" font-size="11" fill="#222" text-anchor="middle" font-weight="normal">President: head of state (nominal)</text><text x="390.0" y="195.5" font-size="11" fill="#222" text-anchor="middle" font-weight="normal">Prime Minister + Council of Ministers</text><text x="390.0" y="210.5" font-size="11" fill="#222" text-anchor="middle" font-weight="normal">= the real executive</text><line x1="270" y1="184" x2="256.0" y2="184.0" stroke="#c0392b" stroke-width="2.5"/><polygon points="252,184 260.3,180.5 260.3,187.5" fill="#c0392b"/><text x="260" y="254" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="normal">The Council of Ministers is collectively responsible to the Lok Sabha</text><text x="260" y="274" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">The party or alliance with a majority in the Lok Sabha forms the government</text></g></svg>