<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="100%" role="img"><rect width="560" height="200" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="24" text-anchor="middle" font-weight="bold">From fertilization to birth</text><rect x="10" y="60" width="95" height="60" rx="8" fill="#fadbd8" stroke="#333"/><text x="57" y="86" text-anchor="middle" font-size="13">Fertilization</text><text x="57" y="104" text-anchor="middle" font-size="11">in the oviduct</text><rect x="115" y="60" width="95" height="60" rx="8" fill="#fdebd0" stroke="#333"/><text x="162" y="86" text-anchor="middle" font-size="13">Cleavage</text><text x="162" y="104" text-anchor="middle" font-size="11">blastocyst</text><rect x="220" y="60" width="95" height="60" rx="8" fill="#fcf3cf" stroke="#333"/><text x="267" y="86" text-anchor="middle" font-size="13">Implantation</text><text x="267" y="104" text-anchor="middle" font-size="11">day 6-7</text><rect x="325" y="60" width="95" height="60" rx="8" fill="#d5f5e3" stroke="#333"/><text x="372" y="86" text-anchor="middle" font-size="13">Organs form</text><text x="372" y="104" text-anchor="middle" font-size="11">germ layers</text><rect x="430" y="60" width="95" height="60" rx="8" fill="#d6eaf8" stroke="#333"/><text x="477" y="86" text-anchor="middle" font-size="13">Birth</text><text x="477" y="104" text-anchor="middle" font-size="11">about 280 days</text><polygon points="112,90 122,85 122,95" fill="#333"/><polygon points="217,90 227,85 227,95" fill="#333"/><polygon points="322,90 332,85 332,95" fill="#333"/><polygon points="427,90 437,85 437,95" fill="#333"/><text x="280" y="165" text-anchor="middle" font-size="14">Placenta feeds the foetus; oxytocin causes birth; prolactin makes milk</text></g></svg>