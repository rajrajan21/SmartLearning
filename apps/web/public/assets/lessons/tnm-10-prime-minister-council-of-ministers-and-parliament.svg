<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 290" width="100%" role="img"><rect width="560" height="290" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="22" text-anchor="middle" font-weight="bold">Council of Ministers and Parliament</text><rect x="10" y="40" width="170" height="80" rx="8" fill="#fadbd8" stroke="#333"/><text x="95.0" y="62" text-anchor="middle" font-size="11" font-weight="bold">Cabinet Ministers</text><text x="95.0" y="78" text-anchor="middle" font-size="11">senior ministers,</text><text x="95.0" y="94" text-anchor="middle" font-size="11">core decision body</text><rect x="195" y="40" width="170" height="80" rx="8" fill="#fcf3cf" stroke="#333"/><text x="280.0" y="62" text-anchor="middle" font-size="11" font-weight="bold">Ministers of State</text><text x="280.0" y="78" text-anchor="middle" font-size="11">attend cabinet only</text><text x="280.0" y="94" text-anchor="middle" font-size="11">if invited</text><rect x="380" y="40" width="170" height="80" rx="8" fill="#d6eaf8" stroke="#333"/><text x="465.0" y="62" text-anchor="middle" font-size="11" font-weight="bold">Deputy Ministers</text><text x="465.0" y="78" text-anchor="middle" font-size="11">lowest rank,</text><text x="465.0" y="94" text-anchor="middle" font-size="11">assist others</text><rect x="10" y="140" width="265" height="110" rx="8" fill="#d5f5e3" stroke="#333"/><text x="142.5" y="162" text-anchor="middle" font-size="11" font-weight="bold">Rajya Sabha (Upper House)</text><text x="142.5" y="178" text-anchor="middle" font-size="11">250 members: 238 + 12 nominated</text><text x="142.5" y="194" text-anchor="middle" font-size="11">permanent, 6-year term</text><text x="142.5" y="210" text-anchor="middle" font-size="11">one third retire every 2 years</text><rect x="285" y="140" width="265" height="110" rx="8" fill="#ebdef0" stroke="#333"/><text x="417.5" y="162" text-anchor="middle" font-size="11" font-weight="bold">Lok Sabha (Lower House)</text><text x="417.5" y="178" text-anchor="middle" font-size="11">543 elected members</text><text x="417.5" y="194" text-anchor="middle" font-size="11">5-year term</text><text x="417.5" y="210" text-anchor="middle" font-size="11">minimum age 25</text><text x="280" y="272" text-anchor="middle" font-size="13">Council of Ministers limited to 15 percent of Lok Sabha strength</text></g></svg>