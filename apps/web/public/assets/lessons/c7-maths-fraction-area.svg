<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="100%" role="img"><rect width="560" height="300" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="20" y="26" font-weight="bold">3/4 × 2/5 on a unit square: 5 rows × 4 columns = 20 equal parts</text><rect x="70" y="44" width="44" height="44" fill="#27ae60" stroke="#555"/><rect x="114" y="44" width="44" height="44" fill="#27ae60" stroke="#555"/><rect x="158" y="44" width="44" height="44" fill="#27ae60" stroke="#555"/><rect x="202" y="44" width="44" height="44" fill="#aed6f1" stroke="#555"/><rect x="70" y="88" width="44" height="44" fill="#27ae60" stroke="#555"/><rect x="114" y="88" width="44" height="44" fill="#27ae60" stroke="#555"/><rect x="158" y="88" width="44" height="44" fill="#27ae60" stroke="#555"/><rect x="202" y="88" width="44" height="44" fill="#aed6f1" stroke="#555"/><rect x="70" y="132" width="44" height="44" fill="#f9d29b" stroke="#555"/><rect x="114" y="132" width="44" height="44" fill="#f9d29b" stroke="#555"/><rect x="158" y="132" width="44" height="44" fill="#f9d29b" stroke="#555"/><rect x="202" y="132" width="44" height="44" fill="#ffffff" stroke="#555"/><rect x="70" y="176" width="44" height="44" fill="#f9d29b" stroke="#555"/><rect x="114" y="176" width="44" height="44" fill="#f9d29b" stroke="#555"/><rect x="158" y="176" width="44" height="44" fill="#f9d29b" stroke="#555"/><rect x="202" y="176" width="44" height="44" fill="#ffffff" stroke="#555"/><rect x="70" y="220" width="44" height="44" fill="#f9d29b" stroke="#555"/><rect x="114" y="220" width="44" height="44" fill="#f9d29b" stroke="#555"/><rect x="158" y="220" width="44" height="44" fill="#f9d29b" stroke="#555"/><rect x="202" y="220" width="44" height="44" fill="#ffffff" stroke="#555"/><text x="10" y="94" font-size="14" fill="#1f618d">2/5 of the height</text><text x="70" y="286" font-size="14" fill="#b9770e">3/4 of the width (3 of 4 columns)</text><text x="270" y="80" font-size="15" fill="#1e8449" font-weight="bold">Green cells = 6</text><text x="270" y="102">Whole = 5 × 4 = 20 cells</text><text x="270" y="140" font-weight="bold">3/4 × 2/5 = (3 × 2)/(4 × 5)</text><text x="270" y="164">= 6/20 = 3/10</text><text x="270" y="204" font-size="14">Area of a rectangle with fractional</text><text x="270" y="224" font-size="14">sides = product of its sides.</text></g></svg>