<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 265" width="100%" role="img"><rect width="520" height="265" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><circle cx="150" cy="120" r="100" fill="#fff3d6" stroke="#333" stroke-width="3"/><line x1="50" y1="120" x2="250" y2="120" stroke="#d62828" stroke-width="4"/><line x1="150" y1="20" x2="150" y2="220" stroke="#1d6fb8" stroke-width="4"/><line x1="79" y1="49" x2="221" y2="191" stroke="#2a9d4a" stroke-width="4"/><circle cx="150" cy="120" r="7" fill="#222"/><text x="150" y="250" text-anchor="middle" font-weight="bold">Fold a paper plate: the folds meet at the centre</text><text x="290" y="110" font-size="16">red fold = straight line</text><text x="290" y="135" font-size="16">through the circle</text><text x="290" y="165" font-size="16">all folds meet at one point:</text><text x="290" y="187" font-size="16" font-weight="bold">the centre</text></g></svg>