<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" width="100%" role="img"><rect width="560" height="230" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="24" text-anchor="middle" font-weight="bold">Darwin: natural selection in five steps</text><rect x="10" y="60" width="100" height="70" rx="8" fill="#fadbd8" stroke="#333"/><text x="60" y="90" text-anchor="middle" font-size="12">Over-</text><text x="60" y="108" text-anchor="middle" font-size="12">production</text><rect x="115" y="60" width="100" height="70" rx="8" fill="#fdebd0" stroke="#333"/><text x="165" y="90" text-anchor="middle" font-size="12">Struggle for</text><text x="165" y="108" text-anchor="middle" font-size="12">existence</text><rect x="220" y="60" width="100" height="70" rx="8" fill="#fcf3cf" stroke="#333"/><text x="270" y="90" text-anchor="middle" font-size="12">Variations</text><text x="270" y="108" text-anchor="middle" font-size="12">appear</text><rect x="325" y="60" width="100" height="70" rx="8" fill="#d5f5e3" stroke="#333"/><text x="375" y="90" text-anchor="middle" font-size="12">Survival of</text><text x="375" y="108" text-anchor="middle" font-size="12">the fittest</text><rect x="430" y="60" width="100" height="70" rx="8" fill="#d6eaf8" stroke="#333"/><text x="480" y="90" text-anchor="middle" font-size="12">Origin of</text><text x="480" y="108" text-anchor="middle" font-size="12">new species</text><polygon points="112,95 122,90 122,100" fill="#333"/><polygon points="217,95 227,90 227,100" fill="#333"/><polygon points="322,95 332,90 332,100" fill="#333"/><polygon points="427,95 437,90 437,100" fill="#333"/><text x="280" y="175" text-anchor="middle" font-size="14">Favourable variations accumulate over many generations</text><text x="280" y="198" text-anchor="middle" font-size="13">Book: On the Origin of Species (1859); voyage of H.M.S. Beagle 1831-1835</text></g></svg>