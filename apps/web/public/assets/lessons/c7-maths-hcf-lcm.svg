<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="100%" role="img"><rect width="700" height="250" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="20" y="24" font-weight="bold">HCF and LCM from prime factors</text><text x="20" y="58" font-size="15">84 = 2 × 2 × 3 × 7</text><text x="20" y="84" font-size="15">108 = 2 × 2 × 3 × 3 × 3</text><rect x="18" y="42" width="150" height="50" fill="none" stroke="#1f618d" stroke-dasharray="4 3"/><text x="20" y="118" font-size="15" fill="#1f618d">HCF: common primes, fewest times  =  2 × 2 × 3 = 12</text><text x="20" y="146" font-size="15" fill="#c0392b">LCM: every prime, most times = 2 × 2 × 3 × 3 × 3 × 7 = 756</text><text x="20" y="190" font-weight="bold" font-size="15">HCF × LCM = product of the two numbers</text><text x="20" y="216" font-size="14">12 × 756 = 9072 = 84 × 108</text><rect x="400" y="40" width="64" height="64" fill="#d6eaf8" stroke="#1f618d"/><text x="420" y="78" font-size="15">4 ft</text><text x="400" y="128" font-size="14">Room 12 ft × 16 ft</text><text x="400" y="150" font-size="14">largest square tile = HCF(12,16) = 4 ft</text><text x="400" y="172" font-size="14">tiles needed = 3 × 4 = 12</text><text x="400" y="206" font-size="14">Toran: strips 6 cm and 8 cm</text><text x="400" y="228" font-size="14">shortest equal length = LCM(6,8) = 24 cm</text></g></svg>