<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 290" width="100%" role="img"><rect width="520" height="290" fill="#ffffff"/><g font-family="sans-serif" font-size="15" fill="#222" stroke-linecap="round" stroke-linejoin="round"><rect x="190" y="15" width="140" height="34" fill="#eaf4fb" stroke="#333" stroke-width="1.5"/><text x="260.0" y="37" font-size="13" fill="#222" text-anchor="middle">Quadrilateral</text><rect x="60" y="85" width="140" height="34" fill="#d5f5e3" stroke="#333" stroke-width="1.5"/><text x="130.0" y="107" font-size="13" fill="#222" text-anchor="middle">Parallelogram</text><rect x="330" y="85" width="110" height="34" fill="#fdebd0" stroke="#333" stroke-width="1.5"/><text x="385.0" y="107" font-size="13" fill="#222" text-anchor="middle">Kite</text><rect x="15" y="160" width="110" height="34" fill="#eaf4fb" stroke="#333" stroke-width="1.5"/><text x="70.0" y="182" font-size="13" fill="#222" text-anchor="middle">Rectangle</text><rect x="170" y="160" width="100" height="34" fill="#eaf4fb" stroke="#333" stroke-width="1.5"/><text x="220.0" y="182" font-size="13" fill="#222" text-anchor="middle">Rhombus</text><rect x="100" y="235" width="110" height="34" fill="#f9e79f" stroke="#333" stroke-width="1.5"/><text x="155.0" y="257" font-size="13" fill="#222" text-anchor="middle">Square</text><line x1="260" y1="49" x2="140" y2="85" stroke="#555" stroke-width="1.5"/><line x1="260" y1="49" x2="385" y2="85" stroke="#555" stroke-width="1.5"/><line x1="110" y1="119" x2="70" y2="160" stroke="#555" stroke-width="1.5"/><line x1="150" y1="119" x2="220" y2="160" stroke="#555" stroke-width="1.5"/><line x1="70" y1="194" x2="140" y2="235" stroke="#555" stroke-width="1.5"/><line x1="220" y1="194" x2="170" y2="235" stroke="#555" stroke-width="1.5"/><text x="300" y="215" font-size="12" fill="#555" text-anchor="start">A square is both a rectangle</text><text x="300" y="232" font-size="12" fill="#555" text-anchor="start">and a rhombus</text></g></svg>