<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="100%" role="img"><rect width="720" height="220" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><rect width="720" height="220" fill="#fffaf0"/><circle cx="70" cy="50" r="15" fill="#e4572e"/><circle cx="120" cy="50" r="15" fill="#e4572e"/><circle cx="170" cy="50" r="15" fill="#e4572e"/><circle cx="220" cy="50" r="15" fill="#e4572e"/><circle cx="270" cy="50" r="15" fill="#e4572e"/><circle cx="320" cy="50" r="15" fill="#e4572e"/><circle cx="70" cy="90" r="15" fill="#e4572e"/><circle cx="120" cy="90" r="15" fill="#e4572e"/><circle cx="170" cy="90" r="15" fill="#e4572e"/><circle cx="220" cy="90" r="15" fill="#e4572e"/><circle cx="270" cy="90" r="15" fill="#e4572e"/><circle cx="320" cy="90" r="15" fill="#e4572e"/><circle cx="70" cy="130" r="15" fill="#e4572e"/><circle cx="120" cy="130" r="15" fill="#e4572e"/><circle cx="170" cy="130" r="15" fill="#e4572e"/><circle cx="220" cy="130" r="15" fill="#e4572e"/><circle cx="270" cy="130" r="15" fill="#e4572e"/><circle cx="320" cy="130" r="15" fill="#e4572e"/><circle cx="70" cy="170" r="15" fill="#e4572e"/><circle cx="120" cy="170" r="15" fill="#e4572e"/><circle cx="170" cy="170" r="15" fill="#e4572e"/><circle cx="220" cy="170" r="15" fill="#e4572e"/><circle cx="270" cy="170" r="15" fill="#e4572e"/><circle cx="320" cy="170" r="15" fill="#e4572e"/><text x="400" y="100" font-size="20" font-weight="bold">4 rows of 6 = 4 × 6 = 24</text><text x="400" y="135" font-size="16">6 columns of 4 = 6 × 4 = 24</text><text x="400" y="170" font-size="14">An array shows equal groups in rows and columns</text></g></svg>