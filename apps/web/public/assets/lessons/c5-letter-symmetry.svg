<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" width="100%" role="img"><rect width="640" height="210" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="20" y="24" font-size="15" font-weight="bold">Lines of symmetry in letters</text><polygon points="70,150 100,60 130,150 115,150 100,100 85,150" fill="#aed6f1" stroke="#333"/><line x1="100" y1="45" x2="100" y2="165" stroke="#c0392b" stroke-dasharray="5"/><text x="80" y="190" font-size="14">A: 1 line</text><rect x="190" y="60" width="16" height="90" fill="#aed6f1" stroke="#333"/><rect x="254" y="60" width="16" height="90" fill="#aed6f1" stroke="#333"/><rect x="206" y="97" width="48" height="16" fill="#aed6f1" stroke="#333"/><line x1="230" y1="45" x2="230" y2="165" stroke="#c0392b" stroke-dasharray="5"/><line x1="175" y1="105" x2="285" y2="105" stroke="#c0392b" stroke-dasharray="5"/><text x="195" y="190" font-size="14">H: 2 lines</text><rect x="350" y="60" width="16" height="90" fill="#aed6f1" stroke="#333"/><rect x="366" y="60" width="40" height="14" fill="#aed6f1" stroke="#333"/><rect x="366" y="98" width="30" height="14" fill="#aed6f1" stroke="#333"/><rect x="366" y="136" width="40" height="14" fill="#aed6f1" stroke="#333"/><line x1="335" y1="105" x2="420" y2="105" stroke="#c0392b" stroke-dasharray="5"/><text x="345" y="190" font-size="14">E: horizontal</text><rect x="470" y="60" width="14" height="90" fill="#aed6f1" stroke="#333"/><rect x="530" y="60" width="14" height="90" fill="#aed6f1" stroke="#333"/><polygon points="484,60 498,60 530,150 516,150" fill="#aed6f1" stroke="#333"/><text x="455" y="190" font-size="14">N: no line, but turns</text></g></svg>