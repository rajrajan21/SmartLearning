<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="100%" role="img"><rect width="560" height="250" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="22" text-anchor="middle" font-weight="bold">Combined solids: add the visible surfaces</text><rect x="40" y="90" width="80" height="90" fill="#d6eaf8" stroke="#333"/><path d="M40 90 A40 40 0 0 1 120 90" fill="#aed6f1" stroke="#333"/><text x="80" y="210" text-anchor="middle" font-size="12">cylinder + hemisphere</text><polygon points="230,60 190,150 270,150" fill="#fadbd8" stroke="#333"/><path d="M190 150 A40 40 0 0 0 270 150" fill="#f5b7b1" stroke="#333"/><text x="230" y="210" text-anchor="middle" font-size="12">cone + hemisphere</text><rect x="340" y="110" width="90" height="70" fill="#d5f5e3" stroke="#333"/><path d="M340 110 A45 40 0 0 1 430 110" fill="#a9dfbf" stroke="#333"/><text x="385" y="210" text-anchor="middle" font-size="12">cuboid + half cylinder</text><text x="280" y="236" text-anchor="middle" font-size="13">Surface: only visible parts. Volume: sum of volumes.</text></g></svg>