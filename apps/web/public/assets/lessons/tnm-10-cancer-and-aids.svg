<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="100%" role="img"><rect width="560" height="250" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="24" text-anchor="middle" font-weight="bold">Cancer: types, causes and treatment</text><rect x="10" y="45" width="175" height="90" rx="8" fill="#fadbd8" stroke="#333"/><text x="97.5" y="67" text-anchor="middle" font-size="12" font-weight="bold">Types</text><text x="97.5" y="84" text-anchor="middle" font-size="12">carcinoma (epithelium)</text><text x="97.5" y="101" text-anchor="middle" font-size="12">sarcoma (connective)</text><text x="97.5" y="118" text-anchor="middle" font-size="12">leukaemia (blood)</text><rect x="192" y="45" width="175" height="90" rx="8" fill="#fdebd0" stroke="#333"/><text x="279.5" y="67" text-anchor="middle" font-size="12" font-weight="bold">Carcinogens</text><text x="279.5" y="84" text-anchor="middle" font-size="12">tobacco smoke, X-rays, UV</text><text x="279.5" y="101" text-anchor="middle" font-size="12">asbestos, oncogenic viruses</text><rect x="375" y="45" width="175" height="90" rx="8" fill="#d5f5e3" stroke="#333"/><text x="462.5" y="67" text-anchor="middle" font-size="12" font-weight="bold">Treatment</text><text x="462.5" y="84" text-anchor="middle" font-size="12">surgery, radiation</text><text x="462.5" y="101" text-anchor="middle" font-size="12">chemotherapy, immunotherapy</text><text x="280" y="170" text-anchor="middle" font-size="13">Metastasis: cancer cells spread to lungs, bones, liver, skin and brain</text><text x="280" y="195" text-anchor="middle" font-size="13">Benign tumours stay confined; malignant tumours invade</text><text x="280" y="220" text-anchor="middle" font-size="13">World Cancer Day 4 February</text></g></svg>