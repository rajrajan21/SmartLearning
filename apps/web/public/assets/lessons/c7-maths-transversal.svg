<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" width="100%" role="img"><rect width="700" height="270" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="20" y="24" font-weight="bold">A transversal t crossing parallel lines l and m</text><line x1="30" y1="95" x2="400" y2="95" stroke="#1f618d" stroke-width="3"/><line x1="30" y1="195" x2="400" y2="195" stroke="#1f618d" stroke-width="3"/><text x="410" y="100">l</text><text x="410" y="200">m</text><line x1="235" y1="40" x2="175" y2="250" stroke="#c0392b" stroke-width="3"/><text x="240" y="48" fill="#c0392b">t</text><text x="205" y="80" font-size="17">1</text><text x="225" y="80" font-size="17">2</text><text x="212" y="125" font-size="17">3</text><text x="170" y="125" font-size="17">4</text><text x="153" y="180" font-size="17">5</text><text x="185" y="180" font-size="17">6</text><text x="180" y="225" font-size="17">7</text><text x="138" y="225" font-size="17">8</text><text x="440" y="70" font-size="14">Corresponding: 1=5, 2=6, 3=7, 4=8</text><text x="440" y="96" font-size="14">Alternate: 4=6, 3=5</text><text x="440" y="122" font-size="14">Same-side interior: 4 + 5 = 180</text><text x="440" y="148" font-size="14">3 + 6 = 180</text><text x="440" y="190" font-size="14">Vertically opposite: 1=3, 2=4</text><text x="440" y="216" font-size="14">Linear pair: 1 + 2 = 180</text></g></svg>