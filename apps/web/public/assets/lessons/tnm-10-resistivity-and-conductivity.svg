<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" width="100%" role="img"><rect width="560" height="270" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#333"/></marker></defs><text x="280.0" y="24" text-anchor="middle" font-weight="bold">R = rho L / A</text><rect x="20" y="50" width="230" height="60" rx="8" fill="#fcf3cf" stroke="#333"/><text x="135.0" y="72" text-anchor="middle" font-size="13" font-weight="bold">R proportional to L</text><text x="135.0" y="90" text-anchor="middle" font-size="13">R inversely proportional to A</text><rect x="300" y="50" width="240" height="60" rx="8" fill="#d5f5e3" stroke="#333"/><text x="420.0" y="72" text-anchor="middle" font-size="14" font-weight="bold">R = rho L / A</text><text x="420.0" y="91" text-anchor="middle" font-size="14">rho = R A / L</text><line x1="250" y1="80" x2="298" y2="80" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><rect x="20" y="140" width="160" height="60" rx="8" fill="#fadbd8" stroke="#333"/><text x="100.0" y="162" text-anchor="middle" font-size="13" font-weight="bold">Resistivity rho</text><text x="100.0" y="180" text-anchor="middle" font-size="13">unit: ohm metre</text><rect x="200" y="140" width="160" height="60" rx="8" fill="#d6eaf8" stroke="#333"/><text x="280.0" y="162" text-anchor="middle" font-size="13" font-weight="bold">Conductivity 1/rho</text><text x="280.0" y="180" text-anchor="middle" font-size="13">unit: mho per metre</text><rect x="380" y="140" width="160" height="60" rx="8" fill="#e8daef" stroke="#333"/><text x="460.0" y="162" text-anchor="middle" font-size="13" font-weight="bold">Nichrome</text><text x="460.0" y="180" text-anchor="middle" font-size="13">rho = 1.5e-6 ohm m</text><text x="280" y="235" text-anchor="middle" font-size="13">Conductors: low resistivity (copper). Insulators: very high (glass, rubber).</text></g></svg>