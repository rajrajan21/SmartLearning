<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 280" width="100%" role="img"><rect width="620" height="280" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="20" y="26" font-weight="bold">Kaprekar routine: 6382 reaches 6174 in 3 rounds</text><rect x="30" y="50" width="170" height="170" rx="8" fill="#fef9e7" stroke="#b9770e"/><text x="42" y="76" font-weight="bold">Start 6382</text><text x="42" y="108">A = 8632 (largest)</text><text x="42" y="134">B = 2368 (smallest)</text><text x="42" y="172" font-weight="bold" fill="#c0392b">C = A - B = 6264</text><text x="202" y="140" font-size="22">→</text><rect x="220" y="50" width="170" height="170" rx="8" fill="#fef9e7" stroke="#b9770e"/><text x="232" y="76" font-weight="bold">Start 6264</text><text x="232" y="108">A = 6642 (largest)</text><text x="232" y="134">B = 2466 (smallest)</text><text x="232" y="172" font-weight="bold" fill="#c0392b">C = A - B = 4176</text><text x="392" y="140" font-size="22">→</text><rect x="410" y="50" width="170" height="170" rx="8" fill="#fef9e7" stroke="#b9770e"/><text x="422" y="76" font-weight="bold">Start 4176</text><text x="422" y="108">A = 7641 (largest)</text><text x="422" y="134">B = 1467 (smallest)</text><text x="422" y="172" font-weight="bold" fill="#c0392b">C = A - B = 6174</text><text x="30" y="256" font-size="14">Any 4-digit number with at least two different digits reaches 6174, the Kaprekar constant.</text></g></svg>