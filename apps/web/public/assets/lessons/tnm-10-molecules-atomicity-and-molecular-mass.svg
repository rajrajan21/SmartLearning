<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" width="100%" role="img"><rect width="620" height="250" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="310" y="22" text-anchor="middle" font-weight="bold">Molecules and atomicity</text><circle cx="60" cy="80" r="16" fill="#aed6f1" stroke="#333"/><circle cx="90" cy="80" r="16" fill="#aed6f1" stroke="#333"/><text x="75" y="125" text-anchor="middle" font-size="13">O2</text><text x="75" y="142" text-anchor="middle" font-size="12">homodiatomic</text><circle cx="190" cy="80" r="16" fill="#aed6f1" stroke="#333"/><circle cx="220" cy="80" r="16" fill="#aed6f1" stroke="#333"/><circle cx="205" cy="55" r="16" fill="#aed6f1" stroke="#333"/><text x="205" y="125" text-anchor="middle" font-size="13">O3</text><text x="205" y="142" text-anchor="middle" font-size="12">homotriatomic</text><circle cx="330" cy="80" r="16" fill="#f9e79f" stroke="#333"/><circle cx="362" cy="80" r="20" fill="#abebc6" stroke="#333"/><text x="346" y="125" text-anchor="middle" font-size="13">HCl</text><text x="346" y="142" text-anchor="middle" font-size="12">heterodiatomic</text><circle cx="470" cy="55" r="12" fill="#f9e79f" stroke="#333"/><circle cx="520" cy="55" r="12" fill="#f9e79f" stroke="#333"/><circle cx="495" cy="85" r="20" fill="#f5b7b1" stroke="#333"/><text x="495" y="125" text-anchor="middle" font-size="13">H2O</text><text x="495" y="142" text-anchor="middle" font-size="12">heterotriatomic</text><text x="20" y="185" font-size="14">RMM = sum of relative atomic masses</text><text x="20" y="207" font-size="14">H2O = 2 x 1 + 16 = 18   CO2 = 12 + 2 x 16 = 44</text><text x="20" y="229" font-size="14">% of element = (mass of element in formula / RMM) x 100</text></g></svg>