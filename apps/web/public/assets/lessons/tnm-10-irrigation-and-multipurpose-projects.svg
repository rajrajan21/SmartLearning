<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" width="100%" role="img"><rect width="560" height="260" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="22" text-anchor="middle" font-weight="bold">Sources of irrigation in India</text><rect x="10" y="45" width="130" height="90" rx="8" fill="#d6eaf8" stroke="#333"/><text x="75.0" y="67" text-anchor="middle" font-size="12" font-weight="bold">Tube wells</text><text x="75.0" y="84" text-anchor="middle" font-size="12">46 percent</text><text x="75.0" y="101" text-anchor="middle" font-size="12">Gujarat, Punjab, TN</text><rect x="148" y="45" width="130" height="90" rx="8" fill="#d5f5e3" stroke="#333"/><text x="213.0" y="67" text-anchor="middle" font-size="12" font-weight="bold">Canals</text><text x="213.0" y="84" text-anchor="middle" font-size="12">24 percent</text><text x="213.0" y="101" text-anchor="middle" font-size="12">northern plains</text><rect x="286" y="45" width="130" height="90" rx="8" fill="#fcf3cf" stroke="#333"/><text x="351.0" y="67" text-anchor="middle" font-size="12" font-weight="bold">Other wells</text><text x="351.0" y="84" text-anchor="middle" font-size="12">16 percent</text><text x="351.0" y="101" text-anchor="middle" font-size="12">Ganga plains</text><rect x="424" y="45" width="126" height="90" rx="8" fill="#fdebd0" stroke="#333"/><text x="487.0" y="67" text-anchor="middle" font-size="12" font-weight="bold">Tanks</text><text x="487.0" y="84" text-anchor="middle" font-size="12">3 percent</text><text x="487.0" y="101" text-anchor="middle" font-size="12">peninsular India</text><text x="280" y="170" text-anchor="middle" font-size="13">Modern: drip (saves up to 70 percent water), sprinkler, rain gun, central pivot</text><text x="280" y="195" text-anchor="middle" font-size="13">Multipurpose projects: irrigation, hydropower, flood control, drinking water</text><text x="280" y="220" text-anchor="middle" font-size="13">PMKSY: more crop per drop</text></g></svg>