<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="100%" role="img"><rect width="720" height="320" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><rect width="720" height="320" fill="#fffaf0"/><text x="360" y="26" text-anchor="middle" font-size="18" font-weight="bold">A balanced food plate</text><path d="M210 175 L210.0 55.0 A120 120 0 0 1 210.0 295.0 Z" fill="#9ccf6b" stroke="#fff" stroke-width="3"/><path d="M210 175 L210.0 295.0 A120 120 0 0 1 95.9 137.9 Z" fill="#f2b36b" stroke="#fff" stroke-width="3"/><path d="M210 175 L95.9 137.9 A120 120 0 0 1 210.0 55.0 Z" fill="#f7e07a" stroke="#fff" stroke-width="3"/><text x="275" y="170" text-anchor="middle" font-size="14" font-weight="bold">Most</text><text x="150" y="255" text-anchor="middle" font-size="13" font-weight="bold">Some</text><text x="130" y="140" text-anchor="middle" font-size="13" font-weight="bold">Some</text><rect x="380" y="90" width="22" height="22" fill="#9ccf6b" stroke="#555"/><text x="412" y="107" font-size="15" font-weight="bold">Protective foods (most)</text><text x="412" y="128" font-size="12">fruits and vegetables: carrot, orange, spinach, guava, amla</text><rect x="380" y="160" width="22" height="22" fill="#f2b36b" stroke="#555"/><text x="412" y="177" font-size="15" font-weight="bold">Body-building foods</text><text x="412" y="198" font-size="12">pulses, milk, eggs, fish, nuts, soybean</text><rect x="380" y="230" width="22" height="22" fill="#f7e07a" stroke="#555"/><text x="412" y="247" font-size="15" font-weight="bold">Energy foods (some)</text><text x="412" y="268" font-size="12">rice, wheat, potato, millets, ghee, oil</text><text x="360" y="308" text-anchor="middle" font-size="12">Sector sizes show the order of how much to eat, not exact amounts.</text></g></svg>