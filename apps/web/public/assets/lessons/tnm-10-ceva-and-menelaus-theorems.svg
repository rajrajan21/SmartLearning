<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="100%" role="img"><rect width="560" height="250" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="22" text-anchor="middle" font-weight="bold">Ceva and Menelaus</text><polygon points="40,200 240,200 140,50" fill="#d5f5e3" stroke="#333" stroke-width="2"/><line x1="140" y1="50" x2="140" y2="200" stroke="#c0392b"/><line x1="40" y1="200" x2="190" y2="125" stroke="#c0392b"/><line x1="240" y1="200" x2="90" y2="125" stroke="#c0392b"/><circle cx="140" cy="150" r="4" fill="#1f618d"/><text x="140" y="228" text-anchor="middle" font-size="13">Ceva: concurrent cevians</text><text x="140" y="244" text-anchor="middle" font-size="12">BD/DC x CE/EA x AF/FB = 1</text><polygon points="330,200 500,200 400,60" fill="#fcf3cf" stroke="#333" stroke-width="2"/><line x1="320" y1="170" x2="520" y2="150" stroke="#c0392b"/><text x="420" y="228" text-anchor="middle" font-size="13">Menelaus: collinear points</text><text x="420" y="244" text-anchor="middle" font-size="12">BP/PC x CQ/QA x AR/RB = 1 (lengths)</text></g></svg>