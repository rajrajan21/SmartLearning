<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="100%" role="img"><rect width="680" height="250" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="20" y="24" font-weight="bold">Constructing a triangle with sides 4 cm, 5 cm, 6 cm using a compass</text><line x1="60" y1="200" x2="160" y2="200" stroke="#333" stroke-width="3"/><path d="M 117.0 88.8 A 125 125 0 0 0 32.1 78.1" fill="none" stroke="#1f618d" stroke-dasharray="4 3"/><path d="M 123.4 54.5 A 150 150 0 0 0 38.4 112.0" fill="none" stroke="#c0392b" stroke-dasharray="4 3"/><line x1="60" y1="200" x2="75.6" y2="76" stroke="#333" stroke-width="3"/><line x1="160" y1="200" x2="75.6" y2="76" stroke="#333" stroke-width="3"/><text x="40" y="218">A</text><text x="164" y="218">B</text><text x="70" y="68">C</text><text x="100" y="216" font-size="13">4 cm</text><text x="100" y="46" font-size="13" fill="#1f618d">arc 5 cm from A</text><text x="20" y="108" font-size="13" fill="#c0392b">arc 6 from B</text><text x="260" y="70" font-weight="bold" font-size="15">Triangle inequality: each side &lt; sum of the other two</text><text x="260" y="100" font-size="15">4, 5, 6: 6 &lt; 9, 5 &lt; 10, 4 &lt; 11  -> triangle exists</text><text x="260" y="128" font-size="15">10, 15, 30: 30 is not less than 25  -> no triangle</text><text x="260" y="170" font-weight="bold" font-size="15">Angle sum of a triangle = 180 degrees</text><text x="260" y="198" font-size="15">acute: all angles &lt; 90 | right: one = 90 | obtuse: one &gt; 90</text><text x="260" y="226" font-size="15">equilateral 3 equal sides | isosceles 2 | scalene none</text></g></svg>