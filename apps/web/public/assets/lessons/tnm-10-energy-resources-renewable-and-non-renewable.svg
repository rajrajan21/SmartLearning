<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="100%" role="img"><rect width="640" height="290" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#333"/></marker></defs><text x="320.0" y="24" text-anchor="middle" font-weight="bold">Energy resources of India</text><rect x="240" y="36" width="160" height="34" rx="8" fill="#d6eaf8" stroke="#333"/><text x="320.0" y="58" text-anchor="middle" font-size="13" font-weight="bold">Energy resources</text><rect x="40" y="110" width="250" height="150" rx="8" fill="#f5cba7" stroke="#333"/><text x="165.0" y="132" text-anchor="middle" font-size="13" font-weight="bold">Non-renewable</text><text x="165.0" y="150" text-anchor="middle" font-size="13">Coal (Gondwana, Jharkhand)</text><text x="165.0" y="168" text-anchor="middle" font-size="13">Petroleum (Mumbai High)</text><text x="165.0" y="186" text-anchor="middle" font-size="13">Natural gas (Bassein)</text><text x="165.0" y="204" text-anchor="middle" font-size="13">Thermal power (Neyveli)</text><text x="165.0" y="222" text-anchor="middle" font-size="13">Nuclear (Tarapur, Kudankulam)</text><rect x="350" y="110" width="250" height="150" rx="8" fill="#abebc6" stroke="#333"/><text x="475.0" y="132" text-anchor="middle" font-size="13" font-weight="bold">Renewable</text><text x="475.0" y="150" text-anchor="middle" font-size="13">Hydropower (Darjeeling 1897)</text><text x="475.0" y="168" text-anchor="middle" font-size="13">Solar (Rajasthan, Gujarat)</text><text x="475.0" y="186" text-anchor="middle" font-size="13">Wind (Muppandal, TN)</text><text x="475.0" y="204" text-anchor="middle" font-size="13">Biomass</text><text x="475.0" y="222" text-anchor="middle" font-size="13">Tidal and wave (Cambay)</text><line x1="300" y1="70" x2="165" y2="108" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><line x1="340" y1="70" x2="475" y2