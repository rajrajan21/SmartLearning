<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="100%" role="img"><rect width="520" height="320" fill="#ffffff"/><g font-family="sans-serif" font-size="15" fill="#222" stroke-linecap="round" stroke-linejoin="round"><polygon points="100,220 400,220 340,90 170,90" fill="#eaf4fb" stroke="#333" stroke-width="2"/><line x1="170" y1="90" x2="170" y2="220" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5"/><text x="120" y="80" font-size="15" fill="#2874a6" text-anchor="start">a (parallel)</text><text x="210" y="245" font-size="15" fill="#2874a6" text-anchor="start">b (parallel)</text><text x="176" y="160" font-size="15" fill="#c0392b" text-anchor="start">h</text><text x="60" y="285" font-size="16" fill="#222" text-anchor="start">Area of a trapezium = ½ × (a + b) × h</text><text x="60" y="308" font-size="13" fill="#555" text-anchor="start">a and b are the parallel sides; h is the distance between them.</text></g></svg>