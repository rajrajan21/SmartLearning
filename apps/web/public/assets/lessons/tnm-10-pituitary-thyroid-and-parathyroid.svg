<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 578 270" width="100%" role="img"><rect width="578" height="270" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="289.0" y="24" text-anchor="middle" font-weight="bold">Endocrine glands: hormones and disorders</text><rect x="20" y="40" width="110" height="30" fill="#d6eaf8" stroke="#555"/><text x="26" y="60" font-size="13" font-weight="bold">Gland</text><rect x="130" y="40" width="250" height="30" fill="#d6eaf8" stroke="#555"/><text x="136" y="60" font-size="13" font-weight="bold">Hormones</text><rect x="380" y="40" width="218" height="30" fill="#d6eaf8" stroke="#555"/><text x="386" y="60" font-size="13" font-weight="bold">Disorder / effect</text><rect x="20" y="70" width="110" height="30" fill="#f4f6f7" stroke="#555"/><text x="26" y="90" font-size="12">Pituitary</text><rect x="130" y="70" width="250" height="30" fill="#f4f6f7" stroke="#555"/><text x="136" y="90" font-size="12">GH, TSH, ACTH, FSH, LH, PRL</text><rect x="380" y="70" width="218" height="30" fill="#f4f6f7" stroke="#555"/><text x="386" y="90" font-size="12">dwarfism, gigantism</text><rect x="20" y="100" width="110" height="30" fill="#fdfefe" stroke="#555"/><text x="26" y="120" font-size="12">Thyroid</text><rect x="130" y="100" width="250" height="30" fill="#fdfefe" stroke="#555"/><text x="136" y="120" font-size="12">thyroxine T4, T3</text><rect x="380" y="100" width="218" height="30" fill="#fdfefe" stroke="#555"/><text x="386" y="120" font-size="12">goitre, cretinism, Grave's</text><rect x="20" y="130" width="110" height="30" fill="#f4f6f7" stroke="#555"/><text x="26" y="150" font-size="12">Parathyroid</text><rect x="130" y="130" width="250" height="30" fill="#f4f6f7" stroke="#555"/><text x="136" y="150" font-size="12">parathormone</text><rect x="380" y="130" width="218" height="30" fill="#f4f6f7" stroke="#555"/><text x="386" y="150" font-size="12">tetany</text><rect x="20" y="160" width="110" height="30" fill="#fdfefe" stroke="#555"/><text x="26" y="180" font-size="12">Pancreas</text><rect x="130" y="160" width="250" height="30" fill="#fdfefe" stroke="#555"/><text x="136" y="180" font-size="12">insulin, glucagon</text><rect x="380" y="160" width="218" height="30" fill="#fdfefe" stroke="#555"/><text x="386" y="180" font-size="12">diabetes mellitus</text><rect x="20" y="190" width="110" height="30" fill="#f4f6f7" stroke="#555"/><text x="26" y="210" font-size="12">Adrenal</text><rect x="130" y="190" width="250" height="30" fill="#f4f6f7" stroke="#555"/><text x="136" y="210" font-size="12">cortisol, aldosterone, adrenaline</text><rect x="380" y="190" width="218" height="30" fill="#f4f6f7" stroke="#555"/><text x="386" y="210" font-size="12">emergency response</text><rect x="20" y="220" width="110" height="30" fill="#fdfefe" stroke="#555"/><text x="26" y="240" font-size="12">Testis / Ovary</text><rect x="130" y="220" width="250" height="30" fill="#fdfefe" stroke="#555"/><text x="136" y="240" font-size="12">testosterone / oestrogen, progesterone</text><rect x="380" y="220" width="218" height="30" fill="#fdfefe" stroke="#555"/><text x="386" y="240" font-size="12">sex characters</text></g></svg>