<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" width="100%" role="img"><rect width="720" height="410" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="360" y="26" text-anchor="middle" font-size="18" font-weight="bold">15 × 14 by splitting into tens and ones</text><rect x="120" y="60" width="300" height="200" fill="#cfe8f3" stroke="#222" stroke-width="2"/><rect x="420" y="60" width="120" height="200" fill="#fde7b0" stroke="#222" stroke-width="2"/><rect x="120" y="260" width="300" height="100" fill="#d4efd0" stroke="#222" stroke-width="2"/><rect x="420" y="260" width="120" height="100" fill="#f6c8d0" stroke="#222" stroke-width="2"/><text x="270" y="165" text-anchor="middle" font-size="20">10 × 10 = 100</text><text x="480" y="165" text-anchor="middle" font-size="20">10 × 4 = 40</text><text x="270" y="315" text-anchor="middle" font-size="20">5 × 10 = 50</text><text x="480" y="315" text-anchor="middle" font-size="20">5 × 4 = 20</text><text x="270" y="50" text-anchor="middle">10</text><text x="480" y="50" text-anchor="middle">4</text><text x="100" y="165" text-anchor="end">10</text><text x="100" y="315" text-anchor="end">5</text><text x="360" y="395" text-anchor="middle" font-size="19" font-weight="bold">100 + 40 + 50 + 20 = 210</text></g></svg>