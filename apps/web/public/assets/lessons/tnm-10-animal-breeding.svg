<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" width="100%" role="img"><rect width="560" height="220" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="24" text-anchor="middle" font-weight="bold">Animal breeding</text><rect x="20" y="50" width="240" height="110" rx="10" fill="#d6eaf8" stroke="#333"/><text x="140" y="76" text-anchor="middle" font-size="15" font-weight="bold">Inbreeding</text><text x="140" y="100" text-anchor="middle" font-size="12">same breed mated</text><text x="140" y="120" text-anchor="middle" font-size="12">keeps pure line</text><text x="140" y="140" text-anchor="middle" font-size="12">risk: less vigour</text><rect x="300" y="50" width="240" height="110" rx="10" fill="#d5f5e3" stroke="#333"/><text x="420" y="76" text-anchor="middle" font-size="15" font-weight="bold">Outbreeding</text><text x="420" y="100" text-anchor="middle" font-size="12">different breeds crossed</text><text x="420" y="120" text-anchor="middle" font-size="12">hybrid vigour (heterosis)</text><text x="420" y="140" text-anchor="middle" font-size="12">example: mule</text><text x="280" y="195" text-anchor="middle" font-size="13">Examples: Hissardale sheep, Karan Swiss cattle</text></g></svg>