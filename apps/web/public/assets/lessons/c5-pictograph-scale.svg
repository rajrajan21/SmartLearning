<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" width="100%" role="img"><rect width="560" height="230" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="20" y="28" font-weight="bold">Toys sold (1 circle = 5 toys)</text><text x="20" y="76">Cars</text><circle cx="150" cy="70" r="13" fill="#f39c12" stroke="#333"/><circle cx="184" cy="70" r="13" fill="#f39c12" stroke="#333"/><circle cx="218" cy="70" r="13" fill="#f39c12" stroke="#333"/><circle cx="252" cy="70" r="13" fill="#f39c12" stroke="#333"/><text x="20" y="121">Balls</text><circle cx="150" cy="115" r="13" fill="#f39c12" stroke="#333"/><circle cx="184" cy="115" r="13" fill="#f39c12" stroke="#333"/><circle cx="218" cy="115" r="13" fill="#f39c12" stroke="#333"/><circle cx="252" cy="115" r="13" fill="#f39c12" stroke="#333"/><circle cx="286" cy="115" r="13" fill="#f39c12" stroke="#333"/><circle cx="320" cy="115" r="13" fill="#f39c12" stroke="#333"/><text x="20" y="166">Dolls</text><circle cx="150" cy="160" r="13" fill="#f39c12" stroke="#333"/><circle cx="184" cy="160" r="13" fill="#f39c12" stroke="#333"/><circle cx="218" cy="160" r="13" fill="#f39c12" stroke="#333"/><text x="20" y="210" font-size="14">Cars 4 x 5 = 20, Balls 6 x 5 = 30, Dolls 3 x 5 = 15</text></g></svg>