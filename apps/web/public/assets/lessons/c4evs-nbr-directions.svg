<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="100%" role="img"><rect width="720" height="320" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><rect width="720" height="320" fill="#f6f6ee"/><rect x="290" y="120" width="140" height="80" rx="12" fill="#ffe9b0" stroke="#b9801f" stroke-width="3"/><text x="360" y="157" text-anchor="middle" font-size="16" font-weight="bold">My home</text><text x="360" y="178" text-anchor="middle" font-size="12">centre of the map</text><text x="360" y="30" text-anchor="middle" font-size="20" font-weight="bold">N</text><line x1="360" y1="38" x2="360" y2="115" stroke="#444" stroke-width="3"/><polygon points="360,38 352,54 368,54" fill="#444"/><text x="360" y="312" text-anchor="middle" font-size="20" font-weight="bold">S</text><line x1="360" y1="205" x2="360" y2="284" stroke="#444" stroke-width="3"/><polygon points="360,284 352,268 368,268" fill="#444"/><text x="690" y="166" text-anchor="middle" font-size="20" font-weight="bold">E</text><line x1="435" y1="160" x2="660" y2="160" stroke="#444" stroke-width="3"/><polygon points="660,160 644,152 644,168" fill="#444"/><text x="30" y="166" text-anchor="middle" font-size="20" font-weight="bold">W</text><line x1="285" y1="160" x2="60" y2="160" stroke="#444" stroke-width="3"/><polygon points="60,160 76,152 76,168" fill="#444"/><text x="450" y="80" font-size="13">The Sun rises in the East,</text><text x="450" y="98" font-size="13">so East is on the right of a map.</text><text x="30" y="80" font-size="13">North is at the top,</text><text x="30" y="98" font-size="13">South at the bottom.</text></g></svg>