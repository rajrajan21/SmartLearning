<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" width="100%" role="img"><rect width="560" height="260" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="22" text-anchor="middle" font-weight="bold">Frustum of a cone</text><polygon points="170,70 330,70 370,190 130,190" fill="#d6eaf8" stroke="#333" stroke-width="2"/><ellipse cx="250" cy="70" rx="80" ry="10" fill="#aed6f1" stroke="#333"/><ellipse cx="250" cy="190" rx="120" ry="14" fill="#85c1e9" stroke="#333"/><line x1="250" y1="70" x2="330" y2="70" stroke="#c0392b" stroke-dasharray="4"/><text x="290" y="62" font-size="13" fill="#c0392b">r</text><line x1="250" y1="190" x2="370" y2="190" stroke="#c0392b" stroke-dasharray="4"/><text x="315" y="208" font-size="13" fill="#c0392b">R</text><line x1="250" y1="70" x2="250" y2="190" stroke="#1e8449" stroke-dasharray="4"/><text x="256" y="135" font-size="13" fill="#1e8449">h</text><text x="360" y="130" font-size="13" fill="#6c3483">l</text><text x="400" y="90" font-size="13">l = sqrt(h^2 + (R - r)^2)</text><text x="400" y="115" font-size="13">CSA = pi (R + r) l</text><text x="400" y="140" font-size="13">TSA = CSA + pi R^2 + pi r^2</text><text x="400" y="165" font-size="13">V = (pi h / 3)(R^2 + Rr + r^2)</text></g></svg>