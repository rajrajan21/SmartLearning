<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="100%" role="img"><rect width="720" height="270" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><rect width="720" height="270" fill="#f2f8fd"/><text x="360" y="28" text-anchor="middle" font-size="18" font-weight="bold">Four habits for a happy and healthy life</text><rect x="18" y="55" width="162" height="170" rx="16" fill="#f7d98b" stroke="#666" stroke-width="2"/><text x="99" y="90" text-anchor="middle" font-size="17" font-weight="bold">Eat right</text><text x="99" y="125" text-anchor="middle" font-size="13">right food, at the</text><text x="99" y="145" text-anchor="middle" font-size="13">right time, in the</text><text x="99" y="165" text-anchor="middle" font-size="13">right way (no waste)</text><rect x="193" y="55" width="162" height="170" rx="16" fill="#b9dc8f" stroke="#666" stroke-width="2"/><text x="274" y="90" text-anchor="middle" font-size="17" font-weight="bold">Play and exercise</text><text x="274" y="125" text-anchor="middle" font-size="13">running, cycling,</text><text x="274" y="145" text-anchor="middle" font-size="13">skipping, yoga,</text><text x="274" y="165" text-anchor="middle" font-size="13">open-field games</text><rect x="368" y="55" width="162" height="170" rx="16" fill="#bcd6f2" stroke="#666" stroke-width="2"/><text x="449" y="90" text-anchor="middle" font-size="17" font-weight="bold">Sleep well</text><text x="449" y="125" text-anchor="middle" font-size="13">enough sleep takes</text><text x="449" y="145" text-anchor="middle" font-size="13">tiredness away and</text><text x="449" y="165" text-anchor="middle" font-size="13">helps us focus</text><rect x="543" y="55" width="162" height="170" rx="16" fill="#f4c3cf" stroke="#666" stroke-width="2"/><text x="624" y="90" text-anchor="middle" font-size="17" font-weight="bold">Feel safe</text><text x="624" y="125" text-anchor="middle" font-size="13">know safe and unsafe</text><text x="624" y="145" text-anchor="middle" font-size="13">touch; say No and tell</text><text x="624" y="165" text-anchor="middle" font-size="13">a trusted adult</text><text x="360" y="255" text-anchor="middle" font-size="13">Take care of the body and the mind to stay happy, healthy and joyful.</text></g></svg>