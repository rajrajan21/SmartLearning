<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" width="100%" role="img"><rect width="760" height="190" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="380" y="22" text-anchor="middle" font-size="18" font-weight="bold">One metre, half a metre and a quarter metre</text><rect x="40" y="60" width="640" height="16" rx="8" fill="#f4a261" stroke="#333" stroke-width="2"/><text x="690" y="73" font-size="15">1 metre</text><rect x="40" y="105" width="320" height="16" rx="8" fill="#f4a261" stroke="#333" stroke-width="2"/><text x="370" y="118" font-size="15">half metre (fold the rope once)</text><rect x="40" y="150" width="160" height="16" rx="8" fill="#f4a261" stroke="#333" stroke-width="2"/><text x="210" y="163" font-size="15">quarter metre (fold again)</text></g></svg>