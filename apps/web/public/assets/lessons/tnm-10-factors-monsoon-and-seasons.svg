<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="100%" role="img"><rect width="560" height="250" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="22" text-anchor="middle" font-weight="bold">Six factors controlling the climate of India</text><rect x="10" y="45" width="175" height="70" rx="8" fill="#fadbd8" stroke="#333"/><text x="97.5" y="67" text-anchor="middle" font-size="12" font-weight="bold">Latitude</text><text x="97.5" y="84" text-anchor="middle" font-size="12">8 N to 37 N</text><text x="97.5" y="101" text-anchor="middle" font-size="12">Tropic of Cancer</text><rect x="192" y="45" width="175" height="70" rx="8" fill="#fdebd0" stroke="#333"/><text x="279.5" y="67" text-anchor="middle" font-size="11" font-weight="bold">Altitude</text><text x="279.5" y="83" text-anchor="middle" font-size="11">6.5 C fall per 1000 m</text><text x="279.5" y="99" text-anchor="middle" font-size="11">normal lapse rate</text><rect x="375" y="45" width="175" height="70" rx="8" fill="#fcf3cf" stroke="#333"/><text x="462.5" y="67" text-anchor="middle" font-size="11" font-weight="bold">Distance from sea</text><text x="462.5" y="83" text-anchor="middle" font-size="11">maritime: equable</text><text x="462.5" y="99" text-anchor="middle" font-size="11">interior: extremes</text><rect x="10" y="130" width="175" height="70" rx="8" fill="#d5f5e3" stroke="#333"/><text x="97.5" y="152" text-anchor="middle" font-size="12" font-weight="bold">Monsoon winds</text><text x="97.5" y="169" text-anchor="middle" font-size="12">seasonal reversal</text><text x="97.5" y="186" text-anchor="middle" font-size="12">dominant factor</text><rect x="192" y="130" width="175" height="70" rx="8" fill="#d6eaf8" stroke="#333"/><text x="279.5" y="152" text-anchor="middle" font-size="11" font-weight="bold">Relief</text><text x="279.5" y="168" text-anchor="middle" font-size="11">Himalayas block cold</text><text x="279.5" y="184" text-anchor="middle" font-size="11">Western Ghats rain shadow</text><rect x="375" y="130" width="175" height="70" rx="8" fill="#ebdef0" stroke="#333"/><text x="462.5" y="152" text-anchor="middle" font-size="11" font-weight="bold">Jet streams</text><text x="462.5" y="168" text-anchor="middle" font-size="11">fast upper winds</text><text x="462.5" y="184" text-anchor="middle" font-size="11">onset of monsoon</text><text x="280" y="228" text-anchor="middle" font-size="13">Ooty (2240 m) is much cooler than Chennai (6.7 m) on the same day</text></g></svg>