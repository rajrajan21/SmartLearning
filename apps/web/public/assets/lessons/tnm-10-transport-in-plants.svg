<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="100%" role="img"><rect width="560" height="300" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="24" text-anchor="middle" font-weight="bold">Ascent of sap: forces that move water upward</text><rect x="240" y="50" width="80" height="150" fill="#d5f5e3" stroke="#1e8449"/><text x="280" y="125" text-anchor="middle" font-size="13">xylem</text><polygon points="280,35 250,50 310,50" fill="#1e8449"/><text x="360" y="75" font-size="14" fill="#1e8449">1. Transpiration pull (suction at leaves)</text><text x="345" y="125" font-size="14" fill="#2874a6">2. Cohesion and adhesion: unbroken water column</text><text x="345" y="165" font-size="14" fill="#b9770e">3. Capillary action in narrow tubes</text><rect x="180" y="215" width="200" height="40" fill="#fdebd0" stroke="#333"/><text x="280" y="240" text-anchor="middle" font-size="14">Root hairs: osmosis, root pressure</text><text x="395" y="240" font-size="14" fill="#a04000">4. Root pressure pushes water up</text><text x="280" y="285" text-anchor="middle" font-size="13">Water enters root hairs by osmosis, then moves to the xylem</text></g></svg>