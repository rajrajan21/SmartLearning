<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" role="img"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs><rect width="900" height="290" fill="#ffffff"/><text x="450.0" y="30" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#0f172a">Three organs of government, three levels</text><rect x="40" y="70" width="220" height="80" rx="10" fill="#dbeafe" stroke="#334155" stroke-width="2"/><text x="150.0" y="105.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Legislature</text><text x="150.0" y="125.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#0f172a">makes the laws</text><rect x="340" y="70" width="220" height="80" rx="10" fill="#dcfce7" stroke="#334155" stroke-width="2"/><text x="450.0" y="105.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Executive</text><text x="450.0" y="125.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#0f172a">carries out the laws</text><rect x="640" y="70" width="220" height="80" rx="10" fill="#fef3c7" stroke="#334155" stroke-width="2"/><text x="750.0" y="105.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Judiciary</text><text x="750.0" y="125.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#0f172a">courts settle disputes</text><line x1="260" y1="110" x2="340" y2="110" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/><line x1="560" y1="110" x2="640" y2="110" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/><text x="450" y="185" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">Kept separate, working together: checks and balances</text><rect x="60" y="215" width="230" height="50" rx="10" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><text x="175.0" y="245.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#0f172a">Centre (national level)</text><rect x="335" y="215" width="230" height="50" rx="10" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><text x="450.0" y="245.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#0f172a">State level</text><rect x="610" y="215" width="230" height="50" rx="10" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><text x="725.0" y="245.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#0f172a">Local level</text></svg>