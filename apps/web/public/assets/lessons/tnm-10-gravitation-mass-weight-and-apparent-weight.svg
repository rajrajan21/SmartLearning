<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270" width="100%" role="img"><rect width="600" height="270" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="300" y="22" text-anchor="middle" font-weight="bold">Gravitation and apparent weight</text><circle cx="90" cy="110" r="26" fill="#aed6f1" stroke="#333"/><text x="90" y="115" text-anchor="middle">m1</text><circle cx="250" cy="110" r="38" fill="#f9e79f" stroke="#333"/><text x="250" y="115" text-anchor="middle">m2</text><line x1="118" y1="110" x2="170" y2="110" stroke="#c0392b" stroke-width="3"/><line x1="212" y1="110" x2="165" y2="110" stroke="#c0392b" stroke-width="3"/><text x="170" y="150" text-anchor="middle" font-size="14">distance r</text><text x="170" y="180" text-anchor="middle" font-size="15">F = G m1 m2 / r^2</text><text x="170" y="204" text-anchor="middle" font-size="14">g = GM / R^2 = 9.8 m/s^2</text><text x="170" y="228" text-anchor="middle" font-size="13">Moon g = 1.625 m/s^2</text><rect x="360" y="45" width="110" height="170" fill="none" stroke="#333"/><text x="415" y="62" text-anchor="middle" font-size="13">Lift</text><circle cx="415" cy="125" r="12" fill="#f5b7b1" stroke="#333"/><line x1="415" y1="137" x2="415" y2="175" stroke="#333" stroke-width="3"/><line x1="415" y1="150" x2="415" y2="200" stroke="#1f618d" stroke-width="3"/><text x="428" y="196" font-size="12">mg</text><text x="378" y="200" font-size="12" fill="#1f618d">R</text><text x="485" y="85" font-size="13">At rest: R = mg</text><text x="485" y="110" font-size="13">Up, accel a: R = m(g+a)</text><text x="485" y="135" font-size="13">Down, accel a: R = m(g-a)</text><text x="485" y="160" font-size="13">Free fall: R = 0</text><text x="485" y="185" font-size="13">(weightless)</text></g></svg>