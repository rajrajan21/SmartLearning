<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" width="100%" role="img"><rect width="560" height="230" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="24" text-anchor="middle" font-weight="bold">How fossils form</text><rect x="10" y="60" width="160" height="70" rx="8" fill="#fadbd8" stroke="#333"/><text x="90" y="88" text-anchor="middle" font-size="13" font-weight="bold">Petrifaction</text><text x="90" y="108" text-anchor="middle" font-size="11">silica replaces tissue</text><rect x="200" y="60" width="160" height="70" rx="8" fill="#fdebd0" stroke="#333"/><text x="280" y="88" text-anchor="middle" font-size="13" font-weight="bold">Mould and cast</text><text x="280" y="108" text-anchor="middle" font-size="11">hollow then filled</text><rect x="390" y="60" width="160" height="70" rx="8" fill="#d6eaf8" stroke="#333"/><text x="470" y="88" text-anchor="middle" font-size="13" font-weight="bold">Preservation</text><text x="470" y="108" text-anchor="middle" font-size="11">in ice or amber</text><text x="280" y="170" text-anchor="middle" font-size="14">Also: carbonization, compression, infiltration</text><text x="280" y="196" text-anchor="middle" font-size="13">Age by carbon-14 dating (W. F. Libby) and other radioactive elements</text></g></svg>