<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="100%" role="img"><rect width="720" height="290" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="360" y="26" text-anchor="middle" font-size="18" font-weight="bold">Adding with regrouping: 438 + 476</text><text x="200" y="70" text-anchor="middle" font-size="16" fill="#555">H</text><text x="260" y="70" text-anchor="middle" font-size="16" fill="#555">T</text><text x="320" y="70" text-anchor="middle" font-size="16" fill="#555">O</text><text x="260" y="105" text-anchor="middle" font-size="20" fill="#d1495b">1</text><text x="200" y="105" text-anchor="middle" font-size="20" fill="#d1495b">1</text><text x="200" y="140" text-anchor="middle" font-size="26">4</text><text x="200" y="180" text-anchor="middle" font-size="26">4</text><text x="200" y="250" text-anchor="middle" font-size="26">9</text><text x="260" y="140" text-anchor="middle" font-size="26">3</text><text x="260" y="180" text-anchor="middle" font-size="26">7</text><text x="260" y="250" text-anchor="middle" font-size="26">1</text><text x="320" y="140" text-anchor="middle" font-size="26">8</text><text x="320" y="180" text-anchor="middle" font-size="26">6</text><text x="320" y="250" text-anchor="middle" font-size="26">4</text><text x="140" y="180" font-size="26">+</text><line x1="150" y1="200" x2="350" y2="200" stroke="#222" stroke-width="3"/><text x="520" y="120" text-anchor="middle" font-size="16">8 + 6 = 14 ones</text><text x="520" y="150" text-anchor="middle" font-size="16">= 1 ten + 4 ones</text><text x="520" y="190" text-anchor="middle" font-size="16">3 + 7 + 1 = 11 tens</text><text x="520" y="220" text-anchor="middle" font-size="16">= 1 hundred + 1 ten</text><text x="520" y="260" text-anchor="middle" font-size="16">4 + 4 + 1 = 9 hundreds</text></g></svg>