<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" width="100%" role="img"><rect width="520" height="330" fill="#ffffff"/><g font-family="sans-serif" font-size="13" fill="#222" stroke-linecap="round" stroke-linejoin="round"><text x="260" y="24" font-size="15" fill="#2874a6" text-anchor="middle" font-weight="bold">India's road to independence</text><line x1="150" y1="44" x2="150" y2="316" stroke="#999" stroke-width="3"/><text x="138" y="68" font-size="14" fill="#c0392b" text-anchor="end" font-weight="bold">1858</text><circle cx="150" cy="64" r="6" fill="#2874a6" stroke="#2874a6" stroke-width="1"/><text x="165" y="68" font-size="13" fill="#222" text-anchor="start" font-weight="normal">British Crown takes direct control after 1857</text><text x="138" y="98" font-size="14" fill="#c0392b" text-anchor="end" font-weight="bold">1885</text><circle cx="150" cy="94" r="6" fill="#2874a6" stroke="#2874a6" stroke-width="1"/><text x="165" y="98" font-size="13" fill="#222" text-anchor="start" font-weight="normal">Indian National Congress founded, Bombay</text><text x="138" y="128" font-size="14" fill="#c0392b" text-anchor="end" font-weight="bold">1905</text><circle cx="150" cy="124" r="6" fill="#2874a6" stroke="#2874a6" stroke-width="1"/><text x="165" y="128" font-size="13" fill="#222" text-anchor="start" font-weight="normal">Partition of Bengal (annulled 1911)</text><text x="138" y="158" font-size="14" fill="#c0392b" text-anchor="end" font-weight="bold">1915</text><circle cx="150" cy="154" r="6" fill="#2874a6" stroke="#2874a6" stroke-width="1"/><text x="165" y="158" font-size="13" fill="#222" text-anchor="start" font-weight="normal">Gandhi returns from South Africa</text><text x="138" y="188" font-size="14" fill="#c0392b" text-anchor="end" font-weight="bold">1920–22</text><circle cx="150" cy="184" r="6" fill="#2874a6" stroke="#2874a6" stroke-width="1"/><text x="165" y="188" font-size="13" fill="#222" text-anchor="start" font-weight="normal">Non-Cooperation Movement</text><text x="138" y="218" font-size="14" fill="#c0392b" text-anchor="end" font-weight="bold">1929</text><circle cx="150" cy="214" r="6" fill="#2874a6" stroke="#2874a6" stroke-width="1"/><text x="165" y="218" font-size="13" fill="#222" text-anchor="start" font-weight="normal">Lahore session demands Purna Swaraj</text><text x="138" y="248" font-size="14" fill="#c0392b" text-anchor="end" font-weight="bold">1930</text><circle cx="150" cy="244" r="6" fill="#2874a6" stroke="#2874a6" stroke-width="1"/><text x="165" y="248" font-size="13" fill="#222" text-anchor="start" font-weight="normal">Dandi Salt March, Civil Disobedience</text><text x="138" y="278" font-size="14" fill="#c0392b" text-anchor="end" font-weight="bold">1942</text><circle cx="150" cy="274" r="6" fill="#2874a6" stroke="#2874a6" stroke-width="1"/><text x="165" y="278" font-size="13" fill="#222" text-anchor="start" font-weight="normal">Quit India Movement</text><text x="138" y="308" font-size="14" fill="#c0392b" text-anchor="end" font-weight="bold">1947</text><circle cx="150" cy="304" r="6" fill="#2874a6" stroke="#2874a6" stroke-width="1"/><text x="165" y="308" font-size="13" fill="#222" text-anchor="start" font-weight="normal">15 August: independence and Partition</text></g></svg>