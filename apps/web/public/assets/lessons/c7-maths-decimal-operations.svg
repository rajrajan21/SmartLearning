<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" width="100%" role="img"><rect width="700" height="260" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="20" y="24" font-weight="bold">Multiplying and dividing decimals</text><text x="20" y="58" font-size="15">5.8 × 1.24</text><text x="20" y="84" font-size="14">58 × 124 = 7192</text><text x="20" y="108" font-size="14">1 + 2 = 3 digits after the point</text><text x="20" y="132" font-size="15" fill="#1e8449">so 5.8 × 1.24 = 7.192</text><text x="20" y="176" font-weight="bold" font-size="15">Dividing by 10, 100, 1000</text><text x="20" y="200" font-size="14">move the point left by 1, 2, 3 places</text><text x="20" y="224" font-size="14">123 ÷ 10 = 12.3     678 ÷ 1000 = 0.678</text><text x="380" y="58" font-weight="bold" font-size="15">Long division with regrouping</text><text x="380" y="84" font-size="14">237 ÷ 8: 23 tens → 2 tens, 7 left</text><text x="380" y="106" font-size="14">77 ones → 9 ones, 5 left</text><text x="380" y="128" font-size="14">5 ones = 50 tenths → 6 tenths, 2 left</text><text x="380" y="150" font-size="14">20 hundredths → 2 hundredths, 4 left</text><text x="380" y="172" font-size="14">40 thousandths → 5, nothing left</text><text x="380" y="204" font-size="15" fill="#1f618d">237 ÷ 8 = 29.625</text><text x="380" y="236" font-size="14">Divisor a decimal: multiply both numbers by 10, 100 ...</text></g></svg>