<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="100%" role="img"><rect width="520" height="280" fill="#ffffff"/><g font-family="sans-serif" font-size="14" fill="#222" stroke-linecap="round" stroke-linejoin="round"><text x="260" y="22" font-size="15" fill="#2874a6" text-anchor="middle" font-weight="bold">Criss-cross the charges to write the formula</text><text x="70" y="60" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">Al</text><text x="180" y="60" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">O</text><text x="70" y="96" font-size="17" fill="#2874a6" text-anchor="middle" font-weight="normal">3+</text><text x="180" y="96" font-size="17" fill="#c0392b" text-anchor="middle" font-weight="normal">2–</text><line x1="74" y1="104" x2="168" y2="160" stroke="#2874a6" stroke-width="1.5"/><line x1="176" y1="104" x2="82" y2="160" stroke="#c0392b" stroke-width="1.5"/><text x="125" y="195" font-size="24" fill="#1e8449" text-anchor="middle" font-weight="bold">Al₂O₃</text><text x="125" y="222" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">3 and 2 swap places</text><text x="330" y="60" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">Mg</text><text x="440" y="60" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">O</text><text x="330" y="96" font-size="17" fill="#2874a6" text-anchor="middle" font-weight="normal">2+</text><text x="440" y="96" font-size="17" fill="#c0392b" text-anchor="middle" font-weight="normal">2–</text><line x1="334" y1="104" x2="428" y2="160" stroke="#2874a6" stroke-width="1.5"/><line x1="436" y1="104" x2="342" y2="160" stroke="#c0392b" stroke-width="1.5"/><text x="385" y="195" font-size="24" fill="#1e8449" text-anchor="middle" font-weight="bold">Mg₂O₂ → MgO</text><text x="385" y="222" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">divide by common factor 2</text><text x="260" y="262" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">Use brackets for repeated polyatomic ions, e.g. Al₂(SO₄)₃ and Mg(OH)₂</text></g></svg>