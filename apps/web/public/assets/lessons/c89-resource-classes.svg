<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 295" width="100%" role="img"><rect width="520" height="295" fill="#ffffff"/><g font-family="sans-serif" font-size="13" fill="#222" stroke-linecap="round" stroke-linejoin="round"><text x="260" y="24" font-size="15" fill="#2874a6" text-anchor="middle" font-weight="bold">Classifying natural resources</text><rect x="180" y="40" width="160" height="34" rx="6" fill="#fdf2d0" stroke="#b7950b" stroke-width="2"/><text x="260.0" y="61.0" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">Natural resources</text><line x1="260" y1="74" x2="260" y2="92" stroke="#555" stroke-width="1.5"/><line x1="120" y1="92" x2="400" y2="92" stroke="#555" stroke-width="1.5"/><line x1="120" y1="92" x2="120" y2="104" stroke="#555" stroke-width="1.5"/><line x1="400" y1="92" x2="400" y2="104" stroke="#555" stroke-width="1.5"/><rect x="30" y="104" width="180" height="30" rx="6" fill="#eaf4fb" stroke="#2874a6" stroke-width="2"/><text x="120.0" y="123.0" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">By renewability</text><rect x="310" y="104" width="180" height="30" rx="6" fill="#eaf4fb" stroke="#2874a6" stroke-width="2"/><text x="400.0" y="123.0" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">By origin</text><line x1="120" y1="134" x2="70" y2="160" stroke="#555" stroke-width="1.5"/><rect x="20" y="160" width="100" height="80" rx="6" fill="#d5f5e3" stroke="#1e8449" stroke-width="2"/><text x="70.0" y="189.0" font-size="11" fill="#222" text-anchor="middle" font-weight="bold">Renewable</text><text x="70.0" y="204.0" font-size="11" fill="#222" text-anchor="middle" font-weight="normal">sunlight, wind</text><text x="70.0" y="219.0" font-size="11" fill="#222" text-anchor="middle" font-weight="normal">can be replaced</text><line x1="120" y1="134" x2="170" y2="160" stroke="#555" stroke-width="1.5"/><rect x="120" y="160" width="100" height="80" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="2"/><text x="170.0" y="189.0" font-size="11" fill="#222" text-anchor="middle" font-weight="bold">Non-renewable</text><text x="170.0" y="204.0" font-size="11" fill="#222" text-anchor="middle" font-weight="normal">coal, petroleum</text><text x="170.0" y="219.0" font-size="11" fill="#222" text-anchor="middle" font-weight="normal">get used up</text><line x1="400" y1="134" x2="350" y2="160" stroke="#555" stroke-width="1.5"/><rect x="300" y="160" width="100" height="80" rx="6" fill="#d5f5e3" stroke="#1e8449" stroke-width="2"/><text x="350.0" y="189.0" font-size="11" fill="#222" text-anchor="middle" font-weight="bold">Biotic</text><text x="350.0" y="204.0" font-size="11" fill="#222" text-anchor="middle" font-weight="normal">forests, fish</text><text x="350.0" y="219.0" font-size="11" fill="#222" text-anchor="middle" font-weight="normal">from living things</text><line x1="400" y1="134" x2="450" y2="160" stroke="#555" stroke-width="1.5"/><rect x="400" y="160" width="100" height="80" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="2"/><text x="450.0" y="189.0" font-size="11" fill="#222" text-anchor="middle" font-weight="bold">Abiotic</text><text x="450.0" y="204.0" font-size="11" fill="#222" text-anchor="middle" font-weight="normal">minerals, water</text><text x="450.0" y="219.0" font-size="11" fill="#222" text-anchor="middle" font-weight="normal">non-living</text><text x="260" y="275" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">Sustainable use: meet today's needs without harming future generations</text></g></svg>