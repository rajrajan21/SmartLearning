<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" width="100%" role="img"><rect width="560" height="260" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="24" text-anchor="middle" font-weight="bold">Insulin and glucagon keep blood glucose steady</text><rect x="210" y="100" width="140" height="50" rx="10" fill="#fdebd0" stroke="#333"/><text x="280" y="130" text-anchor="middle" font-size="14">Blood glucose</text><rect x="30" y="40" width="160" height="50" rx="10" fill="#aed6f1" stroke="#333"/><text x="110" y="62" text-anchor="middle" font-size="13">Beta cells: INSULIN</text><text x="110" y="80" text-anchor="middle" font-size="12">glucose -> glycogen</text><rect x="370" y="40" width="160" height="50" rx="10" fill="#f5b7b1" stroke="#333"/><text x="450" y="62" text-anchor="middle" font-size="13">Alpha cells: GLUCAGON</text><text x="450" y="80" text-anchor="middle" font-size="12">glycogen -> glucose</text><text x="110" y="125" text-anchor="middle" font-size="13" fill="#2874a6">lowers glucose</text><text x="450" y="125" text-anchor="middle" font-size="13" fill="#c0392b">raises glucose</text><text x="280" y="195" text-anchor="middle" font-size="14">Too little insulin = diabetes mellitus</text><text x="280" y="220" text-anchor="middle" font-size="13">high blood sugar, sugar in urine, thirst, frequent urination</text></g></svg>