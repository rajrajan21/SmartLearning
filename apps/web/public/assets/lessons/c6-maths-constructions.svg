<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="100%" role="img"><rect width="640" height="260" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="20" y="24" font-weight="bold">A circle, and a point 5 cm from both B and C</text><circle cx="140" cy="130" r="80" fill="#eaf2f8" stroke="#1b4f72" stroke-width="3"/><circle cx="140" cy="130" r="4" fill="#c0392b"/><line x1="140" y1="130" x2="220" y2="130" stroke="#c0392b" stroke-width="2"/><text x="128" y="152" font-size="14">P (centre)</text><text x="170" y="122" font-size="14">radius</text><text x="40" y="240" font-size="14">Every point on the circle is the same distance from P</text><circle cx="400" cy="170" r="90" fill="none" stroke="#7d3c98" stroke-width="2" stroke-dasharray="5 4"/><circle cx="490" cy="170" r="90" fill="none" stroke="#1e8449" stroke-width="2" stroke-dasharray="5 4"/><circle cx="400" cy="170" r="4" fill="#333"/><circle cx="490" cy="170" r="4" fill="#333"/><circle cx="445" cy="92" r="5" fill="#c0392b"/><text x="390" y="190" font-size="14">B</text><text x="486" y="190" font-size="14">C</text><text x="452" y="88" font-size="14">A</text><text x="340" y="240" font-size="14">Arcs from B and C meet at A: AB = AC</text></g></svg>