<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" width="100%" role="img"><rect width="760" height="200" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="380" y="26" text-anchor="middle" font-size="18" font-weight="bold">BCE counts backward, CE counts forward. There is no year zero.</text>
<line x1="40" y1="110" x2="720" y2="110" stroke="#444" stroke-width="3"/>
<g text-anchor="middle" font-size="14">
<line x1="130" y1="95" x2="130" y2="125" stroke="#333" stroke-width="2"/><text x="130" y="150">560 BCE</text><text x="130" y="72" font-weight="bold">Buddha born</text>
<line x1="330" y1="95" x2="330" y2="125" stroke="#333" stroke-width="2"/><text x="330" y="150">2 BCE</text>
<line x1="380" y1="85" x2="380" y2="135" stroke="#c33" stroke-width="3"/><text x="380" y="72" font-weight="bold">1 BCE then 1 CE</text><text x="380" y="150">no year 0</text>
<line x1="430" y1="95" x2="430" y2="125" stroke="#333" stroke-width="2"/><text x="430" y="150">2 CE</text>
<line x1="620" y1="95" x2="620" y2="125" stroke="#333" stroke-width="2"/><text x="620" y="150">1947 CE</text><text x="620" y="72" font-weight="bold">Independence</text></g>
<text x="380" y="182" text-anchor="middle" font-size="14">From 2 BCE to 2 CE only 2 + 2 - 1 = 3 years pass</text></g></svg>