<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 310" width="100%" role="img"><rect width="620" height="310" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="20" y="24" font-weight="bold">Grade 7 journey: how the chapters connect</text><rect x="40" y="50" width="160" height="80" rx="10" fill="#d6eaf8" stroke="#555" stroke-width="2"/><text x="50" y="78" font-size="15" font-weight="bold">Materials</text><text x="50" y="100" font-size="13">acids, bases,</text><text x="50" y="118" font-size="13">metals, non-metals</text><rect x="230" y="50" width="160" height="80" rx="10" fill="#fcf3cf" stroke="#555" stroke-width="2"/><text x="240" y="78" font-size="15" font-weight="bold">Changes</text><text x="240" y="100" font-size="13">physical, chemical,</text><text x="240" y="118" font-size="13">heat transfer</text><rect x="420" y="50" width="160" height="80" rx="10" fill="#d5f5e3" stroke="#555" stroke-width="2"/><text x="430" y="78" font-size="15" font-weight="bold">Living things</text><text x="430" y="100" font-size="13">growing up, animals,</text><text x="430" y="118" font-size="13">plants</text><rect x="40" y="170" width="160" height="80" rx="10" fill="#fadbd8" stroke="#555" stroke-width="2"/><text x="50" y="198" font-size="15" font-weight="bold">Time and motion</text><text x="50" y="220" font-size="13">clocks, speed</text><text x="50" y="238" font-size="13"></text><rect x="230" y="170" width="160" height="80" rx="10" fill="#e8daef" stroke="#555" stroke-width="2"/><text x="240" y="198" font-size="15" font-weight="bold">Light</text><text x="240" y="220" font-size="13">sources, shadows,</text><text x="240" y="238" font-size="13">reflection</text><rect x="420" y="170" width="160" height="80" rx="10" fill="#fdebd0" stroke="#555" stroke-width="2"/><text x="430" y="198" font-size="15" font-weight="bold">Earth and sky</text><text x="430" y="220" font-size="13">rotation, Moon,</text><text x="430" y="238" font-size="13">Sun, eclipses</text><line x1="200" y1="90" x2="230" y2="90" stroke="#1b4f72" stroke-width="3" marker-end="url(#a)"/><line x1="390" y1="90" x2="420" y2="90" stroke="#1b4f72" stroke-width="3" marker-end="url(#a)"/><line x1="200" y1="210" x2="230" y2="210" stroke="#1b4f72" stroke-width="3" marker-end="url(#a)"/><line x1="390" y1="210" x2="420" y2="210" stroke="#1b4f72" stroke-width="3" marker-end="url(#a)"/><line x1="120" y1="130" x2="120" y2="170" stroke="#1b4f72" stroke-width="3" marker-end="url(#a)"/><line x1="310" y1="130" x2="310" y2="170" stroke="#1b4f72" stroke-width="3" marker-end="url(#a)"/><line x1="500" y1="130" x2="500" y2="170" stroke="#1b4f72" stroke-width="3" marker-end="url(#a)"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1b4f72"/></marker></defs><text x="40" y="290" font-size="14">Everything is interconnected: an idea in one area helps us ask questions in another.</text></g></svg>