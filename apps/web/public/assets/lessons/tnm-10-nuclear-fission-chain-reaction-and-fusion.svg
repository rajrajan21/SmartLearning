<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 260" width="100%" role="img"><rect width="620" height="260" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="310" y="22" text-anchor="middle" font-weight="bold">Fission, chain reaction and fusion</text><circle cx="60" cy="110" r="9" fill="#e67e22"/><text x="60" y="95" text-anchor="middle" font-size="12">n</text><line x1="72" y1="110" x2="105" y2="110" stroke="#333" stroke-width="2"/><circle cx="140" cy="110" r="30" fill="#aed6f1" stroke="#333"/><text x="140" y="114" text-anchor="middle" font-size="13">U-235</text><circle cx="230" cy="70" r="20" fill="#f9e79f" stroke="#333"/><text x="230" y="74" text-anchor="middle" font-size="11">Ba-141</text><circle cx="230" cy="150" r="20" fill="#f5b7b1" stroke="#333"/><text x="230" y="154" text-anchor="middle" font-size="11">Kr-92</text><line x1="170" y1="100" x2="210" y2="76" stroke="#333"/><line x1="170" y1="120" x2="210" y2="144" stroke="#333"/><circle cx="270" cy="110" r="7" fill="#e67e22"/><circle cx="270" cy="95" r="7" fill="#e67e22"/><circle cx="270" cy="125" r="7" fill="#e67e22"/><text x="290" y="114" font-size="12">3 neutrons + about 200 MeV</text><text x="20" y="200" font-size="14">Chain reaction: 1 -> 3 -> 9 -> 27 neutrons</text><text x="20" y="222" font-size="13">Controlled (reactor): one neutron left per fission</text><text x="20" y="242" font-size="13">Uncontrolled (atom bomb): neutrons multiply freely</text><text x="400" y="190" font-size="14" font-weight="bold">Fusion</text><text x="400" y="212" font-size="13">two light nuclei join to form</text><text x="400" y="232" font-size="13">a heavier nucleus (Sun, H-bomb)</text></g></svg>