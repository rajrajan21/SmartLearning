<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="100%" role="img"><rect width="560" height="250" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="24" text-anchor="middle" font-weight="bold">Plant tissue systems</text><rect x="210" y="40" width="140" height="40" rx="8" fill="#fcf3cf" stroke="#333"/><text x="280.0" y="65.0" text-anchor="middle" font-size="14">Plant tissues</text><line x1="240" y1="80" x2="110" y2="110" stroke="#333" stroke-width="2"/><polygon points="110,110 105,102 115,102" fill="#333"/><line x1="280" y1="80" x2="280" y2="110" stroke="#333" stroke-width="2"/><polygon points="280,110 275,102 285,102" fill="#333"/><line x1="320" y1="80" x2="450" y2="110" stroke="#333" stroke-width="2"/><polygon points="450,110 445,102 455,102" fill="#333"/><rect x="20" y="110" width="180" height="50" rx="8" fill="#d6eaf8" stroke="#333"/><text x="110.0" y="131.0" text-anchor="middle" font-size="14">Dermal system</text><text x="110.0" y="149.0" text-anchor="middle" font-size="12">epidermis, stomata, root hairs</text><rect x="190" y="110" width="180" height="50" rx="8" fill="#d5f5e3" stroke="#333"/><text x="280.0" y="131.0" text-anchor="middle" font-size="14">Ground system</text><text x="280.0" y="149.0" text-anchor="middle" font-size="12">cortex, pith, endodermis</text><rect x="380" y="110" width="170" height="50" rx="8" fill="#fadbd8" stroke="#333"/><text x="465.0" y="131.0" text-anchor="middle" font-size="14">Vascular system</text><text x="465.0" y="149.0" text-anchor="middle" font-size="12">xylem and phloem</text><text x="110" y="190" text-anchor="middle" font-size="13">protection, less water loss</text><text x="280" y="190" text-anchor="middle" font-size="13">storage, photosynthesis, support</text><text x="465" y="190" text-anchor="middle" font-size="13">water up, food down</text><text x="280" y="225" text-anchor="middle" font-size="13">Xylem: water and minerals     Phloem: food</text></g></svg>