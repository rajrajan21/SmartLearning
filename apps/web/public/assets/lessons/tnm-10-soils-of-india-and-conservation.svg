<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 290" width="100%" role="img"><rect width="560" height="290" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="22" text-anchor="middle" font-weight="bold">Eight major soils of India (ICAR, 1953)</text><rect x="20" y="38" width="520" height="29" rx="6" fill="#fdebd0" stroke="#333"/><text x="28" y="57" font-size="12" font-weight="bold">Alluvial</text><text x="160" y="57" font-size="12">Ganga-Brahmaputra plains</text><text x="330" y="57" font-size="12">rice, wheat, sugarcane</text><rect x="20" y="71" width="520" height="29" rx="6" fill="#d5dbdb" stroke="#333"/><text x="28" y="90" font-size="12" font-weight="bold">Black (regur)</text><text x="160" y="90" font-size="12">Deccan trap, basalt</text><text x="330" y="90" font-size="12">cotton, millets, tobacco</text><rect x="20" y="104" width="520" height="29" rx="6" fill="#fadbd8" stroke="#333"/><text x="28" y="123" font-size="12" font-weight="bold">Red</text><text x="160" y="123" font-size="12">Deccan east, TN, Karnataka</text><text x="330" y="123" font-size="12">wheat, cotton, pulses</text><rect x="20" y="137" width="520" height="29" rx="6" fill="#f5cba7" stroke="#333"/><text x="28" y="156" font-size="12" font-weight="bold">Laterite</text><text x="160" y="156" font-size="12">Assam hills, Kerala</text><text x="330" y="156" font-size="12">coffee, rubber, cashew</text><rect x="20" y="170" width="520" height="29" rx="6" fill="#d5f5e3" stroke="#333"/><text x="28" y="189" font-size="12" font-weight="bold">Forest and mountain</text><text x="160" y="189" font-size="12">Himalayas, Ghats</text><text x="330" y="189" font-size="12">tea, coffee, spices</text><rect x="20" y="203" width="520" height="29" rx="6" fill="#fcf3cf" stroke="#333"/><text x="28" y="222" font-size="12" font-weight="bold">Arid and desert</text><text x="160" y="222" font-size="12">Rajasthan, Gujarat</text><text x="330" y="222" font-size="12">millets, barley</text><rect x="20" y="236" width="520" height="29" rx="6" fill="#ebdef0" stroke="#333"/><text x="28" y="255" font-size="12" font-weight="bold">Saline, Peaty</text><text x="160" y="255" font-size="12">Punjab, Kerala, Sundarbans</text><text x="330" y="255" font-size="12">paddy, jute</text></g></svg>