<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="100%" role="img"><rect width="760" height="230" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="380" y="26" text-anchor="middle" font-size="18" font-weight="bold">Each 15 degrees of longitude is one hour</text>
<line x1="40" y1="110" x2="720" y2="110" stroke="#444" stroke-width="2"/>
<g text-anchor="middle" font-size="14">
<line x1="110" y1="70" x2="110" y2="150" stroke="#2a6"/><text x="110" y="62">45 W</text><text x="110" y="172">9 AM</text>
<line x1="210" y1="70" x2="210" y2="150" stroke="#2a6"/><text x="210" y="62">30 W</text><text x="210" y="172">10 AM</text>
<line x1="310" y1="70" x2="310" y2="150" stroke="#2a6"/><text x="310" y="62">15 W</text><text x="310" y="172">11 AM</text>
<line x1="410" y1="60" x2="410" y2="150" stroke="#c33" stroke-width="3"/><text x="410" y="52">0 Greenwich</text><text x="410" y="172" font-weight="bold">12 noon</text>
<line x1="510" y1="70" x2="510" y2="150" stroke="#2a6"/><text x="510" y="62">15 E</text><text x="510" y="172">1 PM</text>
<line x1="610" y1="70" x2="610" y2="150" stroke="#2a6"/><text x="610" y="62">30 E</text><text x="610" y="172">2 PM</text></g>
<text x="380" y="206" text-anchor="middle" font-size="14">Going east, add 1 hour for every 15 degrees. Going west, subtract 1 hour.</text></g></svg>