<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" width="100%" role="img"><rect width="560" height="260" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="22" text-anchor="middle" font-weight="bold">Early nationalism in Madras</text><rect x="15" y="36" width="530" height="31" rx="6" fill="#d6eaf8" stroke="#333"/><text x="23" y="57" font-size="12" font-weight="bold">1852</text><text x="130" y="57" font-size="12">Madras Native Association: Gazulu Lakshminarasu</text><rect x="15" y="72" width="530" height="31" rx="6" fill="#d5f5e3" stroke="#333"/><text x="23" y="93" font-size="12" font-weight="bold">1878</text><text x="130" y="93" font-size="12">The Hindu started by G. Subramaniam and others</text><rect x="15" y="108" width="530" height="31" rx="6" fill="#fcf3cf" stroke="#333"/><text x="23" y="129" font-size="12" font-weight="bold">16 May 1884</text><text x="130" y="129" font-size="12">Madras Mahajana Sabha, P. Rangaiah president</text><rect x="15" y="144" width="530" height="31" rx="6" fill="#fadbd8" stroke="#333"/><text x="23" y="165" font-size="12" font-weight="bold">Dec 1884</text><text x="130" y="165" font-size="12">Adyar meeting before the Congress</text><rect x="15" y="180" width="530" height="31" rx="6" fill="#ebdef0" stroke="#333"/><text x="23" y="201" font-size="12" font-weight="bold">1885</text><text x="130" y="201" font-size="12">First Congress: 22 of 72 delegates from Madras</text><rect x="15" y="216" width="530" height="31" rx="6" fill="#fdebd0" stroke="#333"/><text x="23" y="237" font-size="12" font-weight="bold">1887</text><text x="130" y="237" font-size="12">Madras session: 362 of 607 delegates</text></g></svg>