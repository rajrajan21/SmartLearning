<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="100%" role="img"><rect width="600" height="260" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="20" y="24" font-weight="bold">A 3 x 3 magic square: every row, column and diagonal adds to 15</text><rect x="40" y="44" width="60" height="60" fill="#fdebd0" stroke="#333"/><text x="62" y="84" font-size="22">8</text><rect x="100" y="44" width="60" height="60" fill="#d6eaf8" stroke="#333"/><text x="122" y="84" font-size="22">1</text><rect x="160" y="44" width="60" height="60" fill="#fdebd0" stroke="#333"/><text x="182" y="84" font-size="22">6</text><text x="236" y="84" font-size="16" fill="#c0392b">= 15</text><rect x="40" y="104" width="60" height="60" fill="#d6eaf8" stroke="#333"/><text x="62" y="144" font-size="22">3</text><rect x="100" y="104" width="60" height="60" fill="#fdebd0" stroke="#333"/><text x="122" y="144" font-size="22">5</text><rect x="160" y="104" width="60" height="60" fill="#d6eaf8" stroke="#333"/><text x="182" y="144" font-size="22">7</text><text x="236" y="144" font-size="16" fill="#c0392b">= 15</text><rect x="40" y="164" width="60" height="60" fill="#fdebd0" stroke="#333"/><text x="62" y="204" font-size="22">4</text><rect x="100" y="164" width="60" height="60" fill="#d6eaf8" stroke="#333"/><text x="122" y="204" font-size="22">9</text><rect x="160" y="164" width="60" height="60" fill="#fdebd0" stroke="#333"/><text x="182" y="204" font-size="22">2</text><text x="236" y="204" font-size="16" fill="#c0392b">= 15</text><text x="58" y="236" font-size="16" fill="#c0392b">15</text><text x="118" y="236" font-size="16" fill="#c0392b">15</text><text x="178" y="236" font-size="16" fill="#c0392b">15</text><text x="300" y="70" font-size="15">Centre is 5, always.</text><text x="300" y="96" font-size="15">Corners: even numbers (8, 6, 4, 2).</text><text x="300" y="122" font-size="15">Edges: odd numbers (1, 3, 7, 9).</text><text x="300" y="164" font-weight="bold" font-size="15">Parity (even or odd)</text><text x="300" y="190" font-size="15">even + even = even, odd + odd = even</text><text x="300" y="216" font-size="15">even + odd = odd</text><text x="300" y="242" font-size="15">nth even = 2n, nth odd = 2n - 1</text></g></svg>