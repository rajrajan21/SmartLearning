<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="100%" role="img"><rect width="760" height="250" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="380" y="24" text-anchor="middle" font-size="18" font-weight="bold">Continents can be counted in four ways</text>
<g font-size="14">
<rect x="20" y="40" width="720" height="40" fill="#e8f1fb" stroke="#5b8fc7"/><text x="30" y="65"><tspan font-weight="bold">4:</tspan> Africa-Eurasia, America, Antarctica, Australia</text>
<rect x="20" y="88" width="720" height="40" fill="#eaf6ea" stroke="#5aa55a"/><text x="30" y="113"><tspan font-weight="bold">5:</tspan> Africa, America, Antarctica, Australia, Eurasia</text>
<rect x="20" y="136" width="720" height="40" fill="#fff4e0" stroke="#d29b3a"/><text x="30" y="161"><tspan font-weight="bold">6:</tspan> Africa, Antarctica, Australia, Eurasia, North America, South America</text>
<rect x="20" y="184" width="720" height="50" fill="#fbe9e7" stroke="#cc6f5e"/><text x="30" y="205"><tspan font-weight="bold">7 (most used):</tspan> Africa, Antarctica, Asia, Australia,</text><text x="30" y="225">Europe, North America, South America</text></g></g></svg>