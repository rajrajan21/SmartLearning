<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="100%" role="img"><rect width="560" height="250" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="22" text-anchor="middle" font-weight="bold">Matrix multiplication: row times column</text><text x="40" y="70" font-size="20">A =</text><text x="90" y="62" font-size="18">1  2</text><text x="90" y="86" font-size="18">3  4</text><text x="170" y="70" font-size="20">B =</text><text x="220" y="62" font-size="18">5  6</text><text x="220" y="86" font-size="18">7  8</text><rect x="82" y="44" width="62" height="24" fill="none" stroke="#c0392b" stroke-width="2"/><rect x="215" y="44" width="30" height="46" fill="none" stroke="#1f618d" stroke-width="2"/><text x="40" y="140" font-size="16">AB =</text><text x="95" y="132" font-size="16">1x5+2x7   1x6+2x8</text><text x="95" y="156" font-size="16">3x5+4x7   3x6+4x8</text><text x="40" y="195" font-size="16">AB =</text><text x="95" y="187" font-size="16">19  22</text><text x="95" y="211" font-size="16">43  50</text><text x="300" y="100" font-size="13">Rule: columns of A = rows of B</text><text x="300" y="124" font-size="13">A is m x n, B is n x p, AB is m x p</text><text x="300" y="148" font-size="13">In general AB is not equal to BA</text><text x="300" y="172" font-size="13">A I = I A = A</text></g></svg>