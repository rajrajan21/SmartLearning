<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="100%" role="img"><rect width="560" height="250" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="22" text-anchor="middle" font-weight="bold">Major crops of India</text><rect x="20" y="38" width="520" height="29" rx="6" fill="#d5f5e3" stroke="#333"/><text x="28" y="57" font-size="12" font-weight="bold">Food crops</text><text x="160" y="57" font-size="12">rice, wheat, jowar, bajra</text><text x="330" y="57" font-size="12">pulses, maize, barley</text><rect x="20" y="71" width="520" height="29" rx="6" fill="#fcf3cf" stroke="#333"/><text x="28" y="90" font-size="12" font-weight="bold">Cash crops</text><text x="160" y="90" font-size="12">sugarcane, cotton, jute</text><text x="330" y="90" font-size="12">tobacco, oilseeds</text><rect x="20" y="104" width="520" height="29" rx="6" fill="#fdebd0" stroke="#333"/><text x="28" y="123" font-size="12" font-weight="bold">Plantation</text><text x="160" y="123" font-size="12">tea, coffee, rubber</text><text x="330" y="123" font-size="12">spices (Kerala)</text><rect x="20" y="137" width="520" height="29" rx="6" fill="#d6eaf8" stroke="#333"/><text x="28" y="156" font-size="12" font-weight="bold">Horticulture</text><text x="160" y="156" font-size="12">fruits, vegetables</text><text x="330" y="156" font-size="12">flowers: 2nd in world</text><rect x="20" y="170" width="520" height="29" rx="6" fill="#fadbd8" stroke="#333"/><text x="28" y="189" font-size="12" font-weight="bold">Leading states</text><text x="160" y="189" font-size="12">Assam: tea; W Bengal: jute</text><text x="330" y="189" font-size="12">Karnataka: coffee; Gujarat: oilseeds</text><rect x="20" y="203" width="520" height="29" rx="6" fill="#ebdef0" stroke="#333"/><text x="28" y="222" font-size="12" font-weight="bold">Livestock, fisheries</text><text x="160" y="222" font-size="12">cattle 37.3 percent of stock</text><text x="330" y="222" font-size="12">fisheries: 2nd after China</text></g></svg>