<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" width="100%" role="img"><rect width="700" height="290" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="20" y="24" font-weight="bold">Multiplying and dividing integers: the sign rules</text><line x1="30" y1="90" x2="400" y2="90" stroke="#333" stroke-width="2"/><line x1="55" y1="84" x2="55" y2="96" stroke="#333"/><text x="43" y="114" font-size="13">-5</text><line x1="87" y1="84" x2="87" y2="96" stroke="#333"/><text x="75" y="114" font-size="13">-4</text><line x1="119" y1="84" x2="119" y2="96" stroke="#333"/><text x="107" y="114" font-size="13">-3</text><line x1="151" y1="84" x2="151" y2="96" stroke="#333"/><text x="139" y="114" font-size="13">-2</text><line x1="183" y1="84" x2="183" y2="96" stroke="#333"/><text x="171" y="114" font-size="13">-1</text><line x1="215" y1="84" x2="215" y2="96" stroke="#333"/><text x="207" y="114" font-size="13">0</text><line x1="247" y1="84" x2="247" y2="96" stroke="#333"/><text x="239" y="114" font-size="13">1</text><line x1="279" y1="84" x2="279" y2="96" stroke="#333"/><text x="271" y="114" font-size="13">2</text><line x1="311" y1="84" x2="311" y2="96" stroke="#333"/><text x="303" y="114" font-size="13">3</text><line x1="343" y1="84" x2="343" y2="96" stroke="#333"/><text x="335" y="114" font-size="13">4</text><line x1="375" y1="84" x2="375" y2="96" stroke="#333"/><text x="367" y="114" font-size="13">5</text><circle cx="215" cy="90" r="6" fill="#1f618d"/><path d="M 215 80 Q 279 52 343 80" fill="none" stroke="#1e8449" stroke-width="2"/><text x="248" y="56" font-size="13" fill="#1e8449">+4</text><path d="M 343 80 Q 311 56 279 80" fill="none" stroke="#c0392b" stroke-width="2"/><text x="296" y="64" font-size="13" fill="#c0392b">-2</text><text x="30" y="140" font-size="14">Coin: first strike +4, second strike -2, so P = 4 + (-2) = 2</text><text x="450" y="52" font-weight="bold" font-size="15">Sign of a product or quotient</text><text x="450" y="82" font-size="14">positive × positive = positive</text><text x="450" y="108" font-size="14">negative × negative = positive</text><text x="450" y="134" font-size="14">positive × negative = negative</text><text x="450" y="160" font-size="14">negative × positive = negative</text><text x="450" y="196" font-size="14">Division follows the same signs.</text><text x="30" y="190" font-weight="bold" font-size="15">Number of negative factors</text><text x="30" y="214" font-size="14">even  -> product is positive</text><text x="30" y="238" font-size="14">odd   -> product is negative</text><text x="30" y="270" font-size="14">1 × a = a    -1 × a = -a    a × b = b × a</text></g></svg>