<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" width="100%" role="img"><rect width="760" height="200" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="380" y="24" text-anchor="middle" font-size="18" font-weight="bold">Whole, half and quarter</text><rect x="30" y="50" width="200" height="110" fill="#fff3c4" stroke="#333" stroke-width="3"/><text x="130" y="185" text-anchor="middle">1 whole</text><rect x="280" y="50" width="200" height="110" fill="#fff3c4" stroke="#333" stroke-width="3"/><rect x="280" y="50" width="100" height="110" fill="#f4a261" stroke="#333" stroke-width="3"/><text x="380" y="185" text-anchor="middle">one half (2 halves = 1 whole)</text><rect x="530" y="50" width="200" height="110" fill="#fff3c4" stroke="#333" stroke-width="3"/><rect x="530" y="50" width="100" height="55" fill="#2a9d8f" stroke="#333" stroke-width="3"/><line x1="630" y1="50" x2="630" y2="160" stroke="#333" stroke-width="3"/><line x1="530" y1="105" x2="730" y2="105" stroke="#333" stroke-width="3"/><text x="630" y="185" text-anchor="middle">one quarter (4 quarters = 1 whole)</text></g></svg>