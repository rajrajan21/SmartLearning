es</text><text x="430.0" y="246.5" font-size="11" fill="#222" text-anchor="middle" font-weight="normal">Mesopotamia</text><line x1="160" y1="235" x2="190" y2="235" stroke="#c0392b" stroke-width="2" stroke-dasharray="4"/><line x1="330" y1="235" x2="360" y2="235" stroke="#c0392b" stroke-width="2" stroke-dasharray="4"/><text x="260" y="290" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="normal">Civilisations traded: Indus beads and seals have been found in Mesopotamia</text><text x="260" y="310" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">Their cities had planned streets, drains, trade and craft work.</text></g></svg>