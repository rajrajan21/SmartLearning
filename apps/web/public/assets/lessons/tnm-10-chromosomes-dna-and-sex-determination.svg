<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 260" width="100%" role="img"><rect width="620" height="260" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="310" y="22" text-anchor="middle" font-weight="bold">Chromosome, DNA and sex determination</text><text x="20" y="55" font-size="14" font-weight="bold">DNA ladder</text><line x1="40" y1="70" x2="40" y2="210" stroke="#1f618d" stroke-width="3"/><line x1="130" y1="70" x2="130" y2="210" stroke="#1f618d" stroke-width="3"/><line x1="40" y1="90" x2="130" y2="90" stroke="#c0392b" stroke-width="2"/><text x="85" y="86" text-anchor="middle" font-size="12">A = T</text><line x1="40" y1="125" x2="130" y2="125" stroke="#c0392b" stroke-width="3"/><text x="85" y="121" text-anchor="middle" font-size="12">G = C</text><line x1="40" y1="160" x2="130" y2="160" stroke="#c0392b" stroke-width="2"/><text x="85" y="156" text-anchor="middle" font-size="12">T = A</text><line x1="40" y1="195" x2="130" y2="195" stroke="#c0392b" stroke-width="3"/><text x="85" y="191" text-anchor="middle" font-size="12">C = G</text><text x="160" y="95" font-size="13">A-T: 2 hydrogen bonds</text><text x="160" y="118" font-size="13">G-C: 3 hydrogen bonds</text><text x="160" y="141" font-size="13">Nucleotide = sugar + base + phosphate</text><text x="160" y="164" font-size="13">Purines: A, G   Pyrimidines: C, T</text><text x="160" y="187" font-size="13">10 base pairs per turn (3.4 nm)</text><text x="420" y="55" font-size="14" font-weight="bold">Human sex determination</text><text x="420" y="85" font-size="13">Mother XX  x  Father XY</text><text x="420" y="110" font-size="13">Eggs: X, X   Sperms: X or Y</text><text x="420" y="135" font-size="13">X + X = girl (XX)</text><text x="420" y="158" font-size="13">X + Y = boy (XY)</text><text x="420" y="190" font-size="13">23 pairs: 22 autosomes + 1 sex pair</text></g></svg>