<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" width="100%" role="img"><rect width="560" height="260" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="22" text-anchor="middle" font-weight="bold">Slope m = tan(theta) = (y2 - y1) / (x2 - x1)</text><line x1="110" y1="190" x2="330" y2="190" stroke="#555"/><line x1="130" y1="30" x2="130" y2="210" stroke="#555"/><line x1="150" y1="170" x2="310" y2="50" stroke="#1f618d" stroke-width="2"/><line x1="150" y1="170" x2="310" y2="170" stroke="#999" stroke-dasharray="4"/><line x1="310" y1="170" x2="310" y2="50" stroke="#999" stroke-dasharray="4"/><circle cx="150" cy="170" r="3.5" fill="#c0392b"/><text x="140" y="186" font-size="12">A(x1,y1)</text><circle cx="310" cy="50" r="3.5" fill="#c0392b"/><text x="280" y="42" font-size="12">B(x2,y2)</text><text x="400" y="80" font-size="13">m &gt; 0: rises left to right</text><text x="400" y="104" font-size="13">m &lt; 0: falls left to right</text><text x="400" y="128" font-size="13">parallel lines: m1 = m2</text><text x="400" y="152" font-size="13">perpendicular: m1 m2 = -1</text><text x="400" y="176" font-size="13">vertical line: undefined</text></g></svg>