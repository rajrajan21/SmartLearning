<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="100%" role="img"><rect width="520" height="320" fill="#ffffff"/><g font-family="sans-serif" font-size="15" fill="#222" stroke-linecap="round" stroke-linejoin="round"><circle cx="260" cy="185" r="105" fill="none" stroke="#333" stroke-width="2"/><circle cx="260" cy="185" r="3" fill="#333" stroke="#333" stroke-width="2"/><text x="250" y="175" font-size="15" fill="#222" text-anchor="start">O</text><line x1="192" y1="265" x2="328" y2="265" stroke="#c0392b" stroke-width="3"/><text x="176" y="285" font-size="15" fill="#222" text-anchor="start">A</text><text x="330" y="285" font-size="15" fill="#222" text-anchor="start">B</text><line x1="260" y1="185" x2="260" y2="265" stroke="#2874a6" stroke-width="2"/><rect x="260" y="253" width="12" height="12" fill="none" stroke="#2874a6" stroke-width="1.5"/><text x="266" y="283" font-size="15" fill="#222" text-anchor="start">M</text><text x="40" y="28" font-size="15" fill="#2874a6" text-anchor="start">A perpendicular from the centre to a chord bisects the chord:</text><text x="40" y="50" font-size="16" fill="#c0392b" text-anchor="start">OM ⊥ AB  ⇒  AM = MB</text></g></svg>