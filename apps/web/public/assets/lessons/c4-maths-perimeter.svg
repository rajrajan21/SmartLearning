<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 210" width="100%" role="img"><rect width="420" height="210" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="10" y="20" font-weight="bold">Perimeter: walk around the boundary</text><rect x="60" y="40" width="240" height="120" fill="#e8f6e8" stroke="#c0392b" stroke-width="4"/><text x="180" y="105" text-anchor="middle" font-size="16">garden</text><text x="180" y="34" text-anchor="middle" font-size="14">6 cm</text><text x="320" y="105" font-size="14">4 cm</text><text x="20" y="195" font-size="16">Perimeter = 6 + 4 + 6 + 4 = 20 cm</text></g></svg>