<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" width="100%" role="img"><rect width="560" height="240" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="24" text-anchor="middle" font-weight="bold">Methods of plant breeding</text><rect x="10" y="50" width="100" height="56" rx="8" fill="#fadbd8" stroke="#333"/><text x="60" y="76" text-anchor="middle" font-size="12">Introduction</text><text x="60" y="94" text-anchor="middle" font-size="11">exotic varieties</text><rect x="115" y="50" width="100" height="56" rx="8" fill="#fdebd0" stroke="#333"/><text x="165" y="76" text-anchor="middle" font-size="12">Selection</text><text x="165" y="94" text-anchor="middle" font-size="11">mass, pureline, clonal</text><rect x="220" y="50" width="100" height="56" rx="8" fill="#fcf3cf" stroke="#333"/><text x="270" y="76" text-anchor="middle" font-size="12">Polyploidy</text><text x="270" y="94" text-anchor="middle" font-size="11">colchicine</text><rect x="325" y="50" width="100" height="56" rx="8" fill="#d5f5e3" stroke="#333"/><text x="375" y="76" text-anchor="middle" font-size="12">Mutation</text><text x="375" y="94" text-anchor="middle" font-size="11">gamma rays</text><rect x="430" y="50" width="100" height="56" rx="8" fill="#d6eaf8" stroke="#333"/><text x="480" y="76" text-anchor="middle" font-size="12">Hybridization</text><text x="480" y="94" text-anchor="middle" font-size="11">crossing plants</text><text x="280" y="150" text-anchor="middle" font-size="14">Aims: higher yield, better quality, disease resistance, shorter duration</text><text x="280" y="176" text-anchor="middle" font-size="13">Green Revolution: Borlaug (Nobel 1970) and M. S. Swaminathan</text></g></svg>