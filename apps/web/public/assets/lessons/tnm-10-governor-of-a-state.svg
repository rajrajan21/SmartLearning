<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="100%" role="img"><rect width="560" height="300" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="22" text-anchor="middle" font-weight="bold">Powers of the Governor</text><rect x="10" y="40" width="170" height="100" rx="8" fill="#d6eaf8" stroke="#333"/><text x="95.0" y="62" text-anchor="middle" font-size="11" font-weight="bold">Executive</text><text x="95.0" y="78" text-anchor="middle" font-size="11">appoints CM on majority,</text><text x="95.0" y="94" text-anchor="middle" font-size="11">ministers, SPSC members</text><rect x="195" y="40" width="170" height="100" rx="8" fill="#d5f5e3" stroke="#333"/><text x="280.0" y="62" text-anchor="middle" font-size="11" font-weight="bold">Legislative</text><text x="280.0" y="78" text-anchor="middle" font-size="11">summons, prorogues,</text><text x="280.0" y="94" text-anchor="middle" font-size="11">assent or withhold, ordinances</text><rect x="380" y="40" width="170" height="100" rx="8" fill="#fcf3cf" stroke="#333"/><text x="465.0" y="62" text-anchor="middle" font-size="11" font-weight="bold">Financial</text><text x="465.0" y="78" text-anchor="middle" font-size="11">budget, Money Bills only</text><text x="465.0" y="94" text-anchor="middle" font-size="11">with his recommendation</text><rect x="10" y="155" width="170" height="100" rx="8" fill="#fadbd8" stroke="#333"/><text x="95.0" y="177" text-anchor="middle" font-size="11" font-weight="bold">Judicial</text><text x="95.0" y="193" text-anchor="middle" font-size="11">appoints district judges,</text><text x="95.0" y="209" text-anchor="middle" font-size="11">pardon except death sentence</text><rect x="195" y="155" width="170" height="100" rx="8" fill="#ebdef0" stroke="#333"/><text x="280.0" y="177" text-anchor="middle" font-size="11" font-weight="bold">Discretionary</text><text x="280.0" y="193" text-anchor="middle" font-size="11">reserve bill for President,</text><text x="280.0" y="209" text-anchor="middle" font-size="11">invite largest party</text><rect x="380" y="155" width="170" height="100" rx="8" fill="#fdebd0" stroke="#333"/><text x="465.0" y="177" text-anchor="middle" font-size="11" font-weight="bold">Emergency</text><text x="465.0" y="193" text-anchor="middle" font-size="11">Article 356 report,</text><text x="465.0" y="209" text-anchor="middle" font-size="11">President Rule</text><text x="280" y="282" text-anchor="middle" font-size="13">Appointed by the President, 5-year term, minimum age 35</text></g></svg>