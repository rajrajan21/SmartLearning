<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 290" width="100%" role="img"><rect width="560" height="290" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="22" text-anchor="middle" font-weight="bold">Foundations of India foreign policy</text><rect x="10" y="40" width="170" height="100" rx="8" fill="#d6eaf8" stroke="#333"/><text x="95.0" y="62" text-anchor="middle" font-size="11" font-weight="bold">Article 51</text><text x="95.0" y="78" text-anchor="middle" font-size="11">promote peace and security,</text><text x="95.0" y="94" text-anchor="middle" font-size="11">just relations,</text><text x="95.0" y="110" text-anchor="middle" font-size="11">settle by arbitration</text><rect x="195" y="40" width="170" height="100" rx="8" fill="#d5f5e3" stroke="#333"/><text x="280.0" y="62" text-anchor="middle" font-size="11" font-weight="bold">Panchsheel 1954</text><text x="280.0" y="78" text-anchor="middle" font-size="11">Nehru and Chou En-lai,</text><text x="280.0" y="94" text-anchor="middle" font-size="11">28 April 1954,</text><text x="280.0" y="110" text-anchor="middle" font-size="11">Bandung 1955</text><rect x="380" y="40" width="170" height="100" rx="8" fill="#fcf3cf" stroke="#333"/><text x="465.0" y="62" text-anchor="middle" font-size="11" font-weight="bold">Non-alignment</text><text x="465.0" y="78" text-anchor="middle" font-size="11">not joining military blocs,</text><text x="465.0" y="94" text-anchor="middle" font-size="11">NAM: Nehru, Tito, Nasser,</text><text x="465.0" y="110" text-anchor="middle" font-size="11">Sukarno, Nkrumah</text><rect x="10" y="155" width="540" height="90" rx="8" fill="#fadbd8" stroke="#333"/><text x="280.0" y="177" text-anchor="middle" font-size="12" font-weight="bold">Objectives</text><text x="280.0" y="194" text-anchor="middle" font-size="12">national security, prosperity, friendly nations, world peace, economic development</text><text x="280" y="270" text-anchor="middle" font-size="13">Non-alignment is not neutrality: freedom to decide each issue independently</text></g></svg>