<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="100%" role="img"><rect width="520" height="320" fill="#ffffff"/><g font-family="sans-serif" font-size="15" fill="#222" stroke-linecap="round" stroke-linejoin="round"><line x1="60" y1="230" x2="460" y2="230" stroke="#333" stroke-width="4"/><line x1="260" y1="230" x2="260" y2="60" stroke="#777" stroke-width="1.5" stroke-dasharray="6"/><line x1="110" y1="80" x2="260" y2="230" stroke="#c0392b" stroke-width="2.5"/><line x1="260" y1="230" x2="410" y2="80" stroke="#2874a6" stroke-width="2.5"/><text x="268" y="70" font-size="13" fill="#555" text-anchor="start">normal</text><text x="15" y="110" font-size="13" fill="#c0392b" text-anchor="start">incident ray</text><text x="400" y="110" font-size="13" fill="#2874a6" text-anchor="start">reflected ray</text><text x="200" y="205" font-size="15" fill="#c0392b" text-anchor="start">i</text><text x="300" y="205" font-size="15" fill="#2874a6" text-anchor="start">r</text><text x="210" y="262" font-size="13" fill="#555" text-anchor="start">plane mirror</text><text x="150" y="298" font-size="15" fill="#222" text-anchor="start">Law of reflection: angle i = angle r</text></g></svg>