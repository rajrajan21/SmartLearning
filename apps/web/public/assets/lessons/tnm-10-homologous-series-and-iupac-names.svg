<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" width="100%" role="img"><rect width="560" height="270" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#333"/></marker></defs><text x="280.0" y="24" text-anchor="middle" font-weight="bold">A homologous series: alkanes differ by CH2 (14 amu)</text><rect x="10" y="60" width="100" height="70" rx="8" fill="#d5f5e3" stroke="#333"/><text x="60.0" y="82" text-anchor="middle" font-size="13" font-weight="bold">Methane</text><text x="60.0" y="100" text-anchor="middle" font-size="13">CH4</text><rect x="120" y="60" width="100" height="70" rx="8" fill="#d5f5e3" stroke="#333"/><text x="170.0" y="82" text-anchor="middle" font-size="13" font-weight="bold">Ethane</text><text x="170.0" y="100" text-anchor="middle" font-size="13">CH3CH3</text><rect x="230" y="60" width="100" height="70" rx="8" fill="#d5f5e3" stroke="#333"/><text x="280.0" y="82" text-anchor="middle" font-size="12" font-weight="bold">Propane</text><text x="280.0" y="99" text-anchor="middle" font-size="12">CH3CH2CH3</text><rect x="340" y="60" width="100" height="70" rx="8" fill="#d5f5e3" stroke="#333"/><text x="390.0" y="82" text-anchor="middle" font-size="11" font-weight="bold">Butane</text><text x="390.0" y="98" text-anchor="middle" font-size="11">CH3(CH2)2CH3</text><rect x="450" y="60" width="100" height="70" rx="8" fill="#d5f5e3" stroke="#333"/><text x="500.0" y="82" text-anchor="middle" font-size="11" font-weight="bold">Pentane</text><text x="500.0" y="98" text-anchor="middle" font-size="11">CH3(CH2)3CH3</text><line x1="110" y1="95" x2="118" y2="95" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><line x1="220" y1="95" x2="228" y2="95" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><line x1="330" y1="95" x2="338" y2="95" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><line x1="440" y1="95" x2="448" y2="95" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="280" y="165" text-anchor="middle" font-size="13">Each step adds one -CH2 group: same functional group, same general formula</text><text x="280" y="195" text-anchor="middle" font-size="13">IUPAC name = Prefix + Root word + Suffix</text><text x="280" y="222" text-anchor="middle" font-size="13">Root words: Meth 1, Eth 2, Prop 3, But 4, Pent 5, Hex 6, Hept 7, Oct 8, Non 9, Dec 10</text></g></svg>