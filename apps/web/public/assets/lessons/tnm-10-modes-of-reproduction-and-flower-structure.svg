<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="100%" role="img"><rect width="560" height="320" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="24" text-anchor="middle" font-weight="bold">Parts of a typical flower (four whorls)</text><ellipse cx="210" cy="190" rx="110" ry="100" fill="#fdebd0" stroke="#333"/><rect x="195" y="120" width="30" height="130" rx="12" fill="#a9dfbf" stroke="#1e8449"/><ellipse cx="210" cy="115" rx="22" ry="12" fill="#f5b7b1" stroke="#333"/><ellipse cx="210" cy="250" rx="22" ry="22" fill="#d5f5e3" stroke="#333"/><line x1="150" y1="150" x2="150" y2="230" stroke="#b9770e" stroke-width="4"/><circle cx="150" cy="145" r="10" fill="#f9e79f" stroke="#333"/><line x1="270" y1="150" x2="270" y2="230" stroke="#b9770e" stroke-width="4"/><circle cx="270" cy="145" r="10" fill="#f9e79f" stroke="#333"/><text x="350" y="70" font-size="14">1. Calyx = sepals (outermost)</text><text x="350" y="100" font-size="14">2. Corolla = petals</text><text x="350" y="130" font-size="14">3. Androecium = stamens</text><text x="365" y="150" font-size="12">(filament + anther: male)</text><text x="350" y="185" font-size="14">4. Gynoecium = carpels</text><text x="365" y="205" font-size="12">(stigma, style, ovary: female)</text><text x="350" y="245" font-size="13" fill="#a04000">Essential whorls: androecium, gynoecium</text><text x="350" y="265" font-size="13" fill="#555">Accessory whorls: calyx, corolla</text><text x="210" y="112" text-anchor="middle" font-size="11">stigma</text><text x="152" y="125" text-anchor="middle" font-size="11">anther</text><text x="210" y="252" text-anchor="middle" font-size="11">ovary</text></g></svg>