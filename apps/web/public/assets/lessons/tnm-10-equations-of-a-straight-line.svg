<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" width="100%" role="img"><rect width="560" height="260" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="22" text-anchor="middle" font-weight="bold">Forms of the equation of a straight line</text><rect x="20" y="40" width="520" height="32" rx="6" fill="#fadbd8" stroke="#333"/><text x="30" y="61" font-size="13" font-weight="bold">Slope-intercept</text><text x="220" y="61" font-size="13">y = mx + c   (slope m, y-intercept c)</text><rect x="20" y="78" width="520" height="32" rx="6" fill="#fdebd0" stroke="#333"/><text x="30" y="99" font-size="13" font-weight="bold">Point-slope</text><text x="220" y="99" font-size="13">y - y1 = m (x - x1)</text><rect x="20" y="116" width="520" height="32" rx="6" fill="#fcf3cf" stroke="#333"/><text x="30" y="137" font-size="13" font-weight="bold">Two-point</text><text x="220" y="137" font-size="13">(y - y1)/(y2 - y1) = (x - x1)/(x2 - x1)</text><rect x="20" y="154" width="520" height="32" rx="6" fill="#d5f5e3" stroke="#333"/><text x="30" y="175" font-size="13" font-weight="bold">Intercept</text><text x="220" y="175" font-size="13">x/a + y/b = 1</text><rect x="20" y="192" width="520" height="32" rx="6" fill="#d6eaf8" stroke="#333"/><text x="30" y="213" font-size="13" font-weight="bold">General</text><text x="220" y="213" font-size="13">ax + by + c = 0  (slope -a/b)</text><rect x="20" y="230" width="520" height="32" rx="6" fill="#ebdef0" stroke="#333"/><text x="30" y="251" font-size="13" font-weight="bold">Axes parallels</text><text x="220" y="251" font-size="13">y = b (parallel to X axis); x = c (parallel to Y axis)</text></g></svg>