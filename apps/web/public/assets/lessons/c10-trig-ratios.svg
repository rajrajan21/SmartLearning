<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="100%" role="img"><rect width="520" height="320" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222" stroke-linecap="round"><polygon points="60,260 380,260 380,60" fill="#eafaf1" stroke="#333" stroke-width="2"/><rect x="360" y="240" width="20" height="20" fill="none" stroke="#333"/><text x="40" y="282" font-size="16" fill="#222">A</text><text x="385" y="282" font-size="16" fill="#222">B</text><text x="388" y="55" font-size="16" fill="#222">C</text><text x="215" y="285" font-size="16" fill="#222">adjacent (to A)</text><text x="388" y="165" font-size="16" fill="#222">opposite</text><text x="170" y="145" font-size="16" fill="#222">hypotenuse</text><text x="80" y="250" font-size="16" fill="#222">θ</text><text x="20" y="25" font-size="15" fill="#222">sin A = opposite / hypotenuse</text><text x="20" y="45" font-size="15" fill="#222">cos A = adjacent / hypotenuse</text><text x="300" y="25" font-size="15" fill="#222">tan A = opposite / adjacent</text></g></svg>