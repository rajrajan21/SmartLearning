<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="100%" role="img"><rect width="520" height="320" fill="#ffffff"/><g font-family="sans-serif" font-size="15" fill="#222" stroke-linecap="round" stroke-linejoin="round"><circle cx="180" cy="150" r="100" fill="#eaf4fb" stroke="#333" stroke-width="2"/><line x1="180" y1="150" x2="280" y2="150" stroke="#c0392b" stroke-width="3"/><circle cx="180" cy="150" r="3" fill="#333" stroke="#333" stroke-width="2"/><text x="222" y="140" font-size="16" fill="#c0392b" text-anchor="start">r</text><text x="330" y="110" font-size="17" fill="#2874a6" text-anchor="start">Circumference = 2πr</text><text x="330" y="150" font-size="17" fill="#2874a6" text-anchor="start">Area = πr²</text><text x="330" y="190" font-size="14" fill="#1e8449" text-anchor="start">π ≈ 3.14 (or 22/7)</text><text x="60" y="290" font-size="14" fill="#222" text-anchor="start">r = radius; the circumference is the distance around the circle.</text></g></svg>