<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="100%" role="img"><rect width="520" height="280" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="260" y="24" text-anchor="middle" font-weight="bold">Rusting: wet (electrochemical) corrosion of iron</text><rect x="60" y="190" width="400" height="40" fill="#7f8c8d" stroke="#333"/><text x="260" y="216" text-anchor="middle" fill="#fff" font-size="14">Iron surface</text><path d="M150 190 Q260 70 370 190 Z" fill="#aed6f1" stroke="#2874a6"/><text x="260" y="150" text-anchor="middle" font-size="14">Water droplet with dissolved O2</text><text x="175" y="180" font-size="13" fill="#c0392b">Anode</text><text x="175" y="262" font-size="13">Fe -> Fe2+ + 2e-</text><text x="330" y="180" font-size="13" fill="#1e8449">Cathode</text><text x="290" y="262" font-size="13">O2 + 2H2O + 4e- -> 4OH-</text><text x="260" y="60" text-anchor="middle" font-size="14">Result: rust = Fe2O3.xH2O (hydrated ferric oxide)</text></g></svg>