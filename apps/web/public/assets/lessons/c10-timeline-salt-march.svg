<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 408" width="100%" role="img"><rect width="720" height="408" fill="#ffffff"/><g font-family="sans-serif" font-size="15" fill="#222"><text x="20" y="28" font-size="18" font-weight="bold">Road to freedom: key dates</text><line x1="150" y1="50" x2="150" y2="398" stroke="#555" stroke-width="3"/><circle cx="150" cy="75" r="8" fill="#c0392b"/><text x="20" y="80" font-weight="bold" fill="#c0392b">1919</text><text x="172" y="80">Rowlatt Act; Jallianwala Bagh (13 April)</text><circle cx="150" cy="133" r="8" fill="#c0392b"/><text x="20" y="138" font-weight="bold" fill="#c0392b">1920-22</text><text x="172" y="138">Non-Cooperation Movement; ends after Chauri Chaura</text><circle cx="150" cy="191" r="8" fill="#c0392b"/><text x="20" y="196" font-weight="bold" fill="#c0392b">1927</text><text x="172" y="196">Simon Commission arrives, boycotted</text><circle cx="150" cy="249" r="8" fill="#c0392b"/><text x="20" y="254" font-weight="bold" fill="#c0392b">Dec 1929</text><text x="172" y="254">Lahore Congress demands Purna Swaraj</text><circle cx="150" cy="307" r="8" fill="#c0392b"/><text x="20" y="312" font-weight="bold" fill="#c0392b">1930</text><text x="172" y="312">Salt March, Sabarmati to Dandi; Civil Disobedience</text><circle cx="150" cy="365" r="8" fill="#c0392b"/><text x="20" y="370" font-weight="bold" fill="#c0392b">1931-32</text><text x="172" y="370">Gandhi-Irwin Pact; Poona Pact</text></g></svg>