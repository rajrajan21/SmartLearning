<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" width="100%" role="img"><rect width="560" height="270" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="20" y="24" font-size="15" font-weight="bold">From tiny to big</text><rect x="60" y="45" width="420" height="42" fill="#fad7a0" stroke="#333"/><text x="75" y="72" font-size="16" font-weight="bold">1,000 mg  = 1 g</text><rect x="80" y="100" width="400" height="42" fill="#a9dfbf" stroke="#333"/><text x="95" y="127" font-size="16" font-weight="bold">1,000 g  = 1 kg</text><rect x="100" y="155" width="380" height="42" fill="#aed6f1" stroke="#333"/><text x="115" y="182" font-size="16" font-weight="bold">100 kg  = 1 quintal</text><rect x="120" y="210" width="360" height="42" fill="#d7bde2" stroke="#333"/><text x="135" y="237" font-size="16" font-weight="bold">10 quintals  = 1 tonne (1,000 kg)</text></g></svg>