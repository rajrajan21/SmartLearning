<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" width="100%" role="img"><rect width="560" height="260" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="24" text-anchor="middle" font-weight="bold">Menstrual cycle (28 days)</text><rect x="20" y="60" width="70" height="46" fill="#f5b7b1" stroke="#333"/><text x="55.0" y="88" text-anchor="middle" font-size="12">Menstrual 1-5</text><rect x="90" y="60" width="190" height="46" fill="#aed6f1" stroke="#333"/><text x="185.0" y="88" text-anchor="middle" font-size="12">Follicular 6-13</text><rect x="280" y="60" width="20" height="46" fill="#f9e79f" stroke="#333"/><text x="290.0" y="88" text-anchor="middle" font-size="12"></text><rect x="300" y="60" width="240" height="46" fill="#d2b4de" stroke="#333"/><text x="420.0" y="88" text-anchor="middle" font-size="12">Luteal 15-28</text><text x="290" y="130" text-anchor="middle" font-size="13" fill="#b9770e">Day 14: ovulation (LH peak)</text><line x1="290" y1="106" x2="290" y2="118" stroke="#b9770e" stroke-width="2"/><text x="55" y="160" text-anchor="middle" font-size="12">lining breaks</text><text x="185" y="160" text-anchor="middle" font-size="12">lining rebuilt (FSH, oestrogen)</text><text x="420" y="160" text-anchor="middle" font-size="12">corpus luteum: progesterone</text><text x="280" y="205" text-anchor="middle" font-size="14">No fertilization: corpus luteum degenerates and menstruation starts</text><text x="280" y="228" text-anchor="middle" font-size="14">Fertilization: corpus luteum persists and pregnancy is maintained</text></g></svg>