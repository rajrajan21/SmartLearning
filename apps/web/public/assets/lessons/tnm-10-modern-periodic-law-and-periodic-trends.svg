<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="100%" role="img"><rect width="560" height="300" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="26" text-anchor="middle" font-weight="bold">Periodic trends in the modern periodic table</text><line x1="60" y1="60" x2="500" y2="60" stroke="#2874a6" stroke-width="3"/><polygon points="500,52 516,60 500,68" fill="#2874a6"/><text x="280" y="52" text-anchor="middle" fill="#2874a6">Across a period (left to right)</text><line x1="40" y1="75" x2="40" y2="270" stroke="#b9770e" stroke-width="3"/><polygon points="32,270 40,286 48,270" fill="#b9770e"/><text x="20" y="180" fill="#b9770e" transform="rotate(-90 20 180)" text-anchor="middle">Down a group</text><rect x="70" y="85" width="440" height="30" fill="#d6eaf8" stroke="#555"/><text x="80" y="106" font-size="14">Property</text><text x="300" y="106" font-size="14">Along a period</text><text x="420" y="106" font-size="14">Down a group</text><rect x="70" y="115" width="440" height="30" fill="#f4f6f7" stroke="#555"/><text x="80" y="136" font-size="14">Atomic radius</text><text x="300" y="136" font-size="14">Decreases</text><text x="420" y="136" font-size="14">Increases</text><rect x="70" y="145" width="440" height="30" fill="#fdfefe" stroke="#555"/><text x="80" y="166" font-size="14">Ionic radius</text><text x="300" y="166" font-size="14">Decreases</text><text x="420" y="166" font-size="14">Increases</text><rect x="70" y="175" width="440" height="30" fill="#f4f6f7" stroke="#555"/><text x="80" y="196" font-size="14">Ionisation energy</text><text x="300" y="196" font-size="14">Increases</text><text x="420" y="196" font-size="14">Decreases</text><rect x="70" y="205" width="440" height="30" fill="#fdfefe" stroke="#555"/><text x="80" y="226" font-size="14">Electron affinity</text><text x="300" y="226" font-size="14">Increases</text><text x="420" y="226" font-size="14">Decreases</text><rect x="70" y="235" width="440" height="30" f