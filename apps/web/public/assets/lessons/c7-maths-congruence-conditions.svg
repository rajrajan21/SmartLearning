<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" width="100%" role="img"><rect width="680" height="290" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="20" y="24" font-weight="bold">Congruent triangles: which facts are enough?</text><polygon points="40,150 140,150 100,80" fill="#d6eaf8" stroke="#1f618d" stroke-width="2"/><polygon points="200,150 300,150 260,80" fill="#d6eaf8" stroke="#1f618d" stroke-width="2"/><text x="34" y="168">A</text><text x="138" y="168">B</text><text x="96" y="72">C</text><text x="194" y="168">X</text><text x="298" y="168">Y</text><text x="256" y="72">Z</text><text x="105" y="196" font-size="14" fill="#1f618d">triangle ABC is congruent to triangle XYZ</text><text x="370" y="52" font-weight="bold" font-size="15" fill="#1e8449">Guarantee congruence</text><text x="370" y="78" font-size="14">SSS: three sides equal</text><text x="370" y="104" font-size="14">SAS: two sides and the angle between them</text><text x="370" y="130" font-size="14">ASA: two angles and the side between them</text><text x="370" y="156" font-size="14">AAS: two angles and a side not between them</text><text x="370" y="182" font-size="14">RHS: right angle, hypotenuse and one side</text><text x="370" y="222" font-weight="bold" font-size="15" fill="#c0392b">Do NOT guarantee</text><text x="370" y="246" font-size="14">SSA (two sides and a non-included angle)</text><text x="370" y="270" font-size="14">AAA (three angles: same shape, any size)</text><text x="40" y="230" font-size="14">Equal sides lie opposite equal angles</text><text x="40" y="254" font-size="14">Equilateral triangle: every angle = 60 degrees</text></g></svg>