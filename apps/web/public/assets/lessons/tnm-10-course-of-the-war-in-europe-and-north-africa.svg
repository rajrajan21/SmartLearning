<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 318" width="100%" role="img"><rect width="560" height="318" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="22" text-anchor="middle" font-weight="bold">World War II in Europe and Africa</text><rect x="15" y="36" width="530" height="29" rx="6" fill="#d6eaf8" stroke="#333"/><text x="23" y="56" font-size="12" font-weight="bold">Sept 1939</text><text x="140" y="56" font-size="12">Britain and France declare war on Germany</text><rect x="15" y="70" width="530" height="29" rx="6" fill="#d5f5e3" stroke="#333"/><text x="23" y="90" font-size="12" font-weight="bold">May 1940</text><text x="140" y="90" font-size="12">Dunkirk: 300,000+ soldiers on the beaches</text><rect x="15" y="104" width="530" height="29" rx="6" fill="#fcf3cf" stroke="#333"/><text x="23" y="124" font-size="12" font-weight="bold">Jul-Oct 1940</text><text x="140" y="124" font-size="12">Battle of Britain and the Blitz</text><rect x="15" y="138" width="530" height="29" rx="6" fill="#fadbd8" stroke="#333"/><text x="23" y="158" font-size="12" font-weight="bold">Mar 1941</text><text x="140" y="158" font-size="12">Lend Lease begins</text><rect x="15" y="172" width="530" height="29" rx="6" fill="#ebdef0" stroke="#333"/><text x="23" y="192" font-size="12" font-weight="bold">Jun 1941</text><text x="140" y="192" font-size="12">Germany invades Russia</text><rect x="15" y="206" width="530" height="29" rx="6" fill="#fdebd0" stroke="#333"/><text x="23" y="226" font-size="12" font-weight="bold">1942</text><text x="140" y="226" font-size="12">El Alamein and Stalingrad</text><rect x="15" y="240" width="530" height="29" rx="6" fill="#d6eaf8" stroke="#333"/><text x="23" y="260" font-size="12" font-weight="bold">1943</text><text x="140" y="260" font-size="12">Italy surrenders</text><rect x="15" y="274" width="530" height="29" rx="6" fill="#d5f5e3" stroke="#333"/><text x="23" y="294" font-size="12" font-weight="bold">May 1945</text><te