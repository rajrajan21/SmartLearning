<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="100%" role="img"><rect width="720" height="290" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="360" y="26" text-anchor="middle" font-size="18" font-weight="bold">Four landforms of India</text><rect x="20" y="50" width="160" height="190" fill="#e8f4d9" stroke="#222"/><rect x="20" y="170" width="160" height="70" fill="#9ccf6d"/><text x="100" y="270" text-anchor="middle">Plains</text><text x="100" y="205" text-anchor="middle" font-size="13">fields, rivers</text><rect x="190" y="50" width="160" height="190" fill="#fbe9b7" stroke="#222"/><circle cx="270" cy="100" r="22" fill="#f4b400"/><polygon points="230,240 290,170 320,240" fill="#e0b34a"/><text x="270" y="270" text-anchor="middle">Desert</text><text x="270" y="140" text-anchor="middle" font-size="13">sand, camels, cactus</text><rect x="360" y="50" width="160" height="190" fill="#d4ecf7" stroke="#222"/><rect x="360" y="170" width="160" height="70" fill="#4aa3d1"/><path d="M360 160 Q400 140 440 170 T520 165" fill="none" stroke="#fff" stroke-width="3"/><text x="440" y="270" text-anchor="middle">Coast</text><text x="440" y="130" text-anchor="middle" font-size="13">sea, fish, sand</text><rect x="530" y="50" width="170" height="190" fill="#e6eefb" stroke="#222"/><polygon points="530,240 610,90 650,150 690,240" fill="#7a8ea3"/><polygon points="595,115 610,90 625,115" fill="#fff"/><text x="615" y="270" text-anchor="middle">Mountains</text><text x="615" y="78" text-anchor="middle" font-size="13">snow, yaks, pine</text></g></svg>