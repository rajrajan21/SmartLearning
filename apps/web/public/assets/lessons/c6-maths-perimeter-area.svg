<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="100%" role="img"><rect width="640" height="290" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="20" y="24" font-weight="bold">Perimeter goes around; area fills inside; a diagonal halves a rectangle</text><rect x="40" y="60" width="240" height="160" fill="#fef9e7" stroke="#b9770e" stroke-width="3"/><text x="130" y="50">length = 12 cm</text><text x="288" y="145">breadth = 8 cm</text><text x="40" y="250" font-size="14">Perimeter = 2 x (12 + 8) = 40 cm</text><text x="40" y="272" font-size="14">Area = 12 x 8 = 96 sq cm</text><rect x="400" y="60" width="200" height="160" fill="#eaf2f8" stroke="#2874a6" stroke-width="3"/><polygon points="400,220 600,60 600,220" fill="#aed6f1" stroke="#2874a6" stroke-width="3"/><line x1="400" y1="220" x2="600" y2="60" stroke="#c0392b" stroke-width="3" stroke-dasharray="6 4"/><text x="480" y="205" font-size="14">triangle</text><text x="410" y="120" font-size="13">other triangle</text><text x="400" y="250" font-size="14">Each triangle = half of the rectangle</text><text x="400" y="272" font-size="14">200 x 160 half = 100 x 80 scale units</text></g></svg>