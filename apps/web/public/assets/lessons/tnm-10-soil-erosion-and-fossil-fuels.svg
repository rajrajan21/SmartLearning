<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="100%" role="img"><rect width="560" height="250" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="24" text-anchor="middle" font-weight="bold">Energy resources</text><rect x="20" y="45" width="250" height="110" rx="8" fill="#fadbd8" stroke="#333"/><text x="145.0" y="67" text-anchor="middle" font-size="12" font-weight="bold">Non-renewable</text><text x="145.0" y="84" text-anchor="middle" font-size="12">coal, petroleum, natural gas</text><text x="145.0" y="101" text-anchor="middle" font-size="12">nuclear power</text><text x="145.0" y="118" text-anchor="middle" font-size="12">formed over millions of years</text><text x="145.0" y="135" text-anchor="middle" font-size="12">will be exhausted</text><rect x="290" y="45" width="250" height="110" rx="8" fill="#d5f5e3" stroke="#333"/><text x="415.0" y="67" text-anchor="middle" font-size="12" font-weight="bold">Renewable</text><text x="415.0" y="84" text-anchor="middle" font-size="12">solar, wind, water, tidal</text><text x="415.0" y="101" text-anchor="middle" font-size="12">biogas, biomass, geothermal</text><text x="415.0" y="118" text-anchor="middle" font-size="12">can be renewed quickly</text><text x="415.0" y="135" text-anchor="middle" font-size="12">clean and inexhaustible</text><text x="280" y="190" text-anchor="middle" font-size="13">Fossil fuels give about 90 percent of commercial energy</text><text x="280" y="215" text-anchor="middle" font-size="13">Conserve: save electricity, use pressure cooker, walk or cycle</text></g></svg>