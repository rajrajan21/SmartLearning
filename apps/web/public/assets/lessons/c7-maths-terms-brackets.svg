<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 290" width="100%" role="img"><rect width="560" height="290" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="20" y="26" font-weight="bold">Terms are the parts joined by + (subtraction becomes adding the inverse)</text><rect x="20" y="44" width="60" height="34" rx="5" fill="#d6eaf8" stroke="#555"/><text x="28" y="67" font-size="18">30</text><text x="90" y="68" font-size="22">+</text><rect x="110" y="44" width="90" height="34" rx="5" fill="#fdebd0" stroke="#555"/><text x="118" y="67" font-size="18">5 x 4</text><text x="210" y="68" font-size="18">= 30 + 20 = 50</text><rect x="20" y="100" width="60" height="34" rx="5" fill="#d6eaf8" stroke="#555"/><text x="28" y="123" font-size="18">83</text><text x="90" y="124" font-size="22">+</text><rect x="110" y="100" width="90" height="34" rx="5" fill="#fadbd8" stroke="#555"/><text x="118" y="123" font-size="18">(-14)</text><text x="210" y="124" font-size="18">83 - 14 has terms 83 and -14</text><text x="20" y="178" font-weight="bold">Brackets after a minus sign: signs inside change</text><text x="20" y="206" font-size="18">500 - (250 - 100) = 500 - 250 + 100 = 350</text><text x="20" y="234" font-size="18">200 - (40 + 3) = 200 - 40 - 3 = 157</text><text x="20" y="266" font-size="15" fill="#c0392b">Brackets NOT after a minus sign keep their signs: 28 + (35 - 10) = 28 + 35 - 10</text></g></svg>