<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" width="100%" role="img"><rect width="620" height="250" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="310" y="22" text-anchor="middle" font-weight="bold">Sound as a longitudinal wave</text><line x1="40" y1="60" x2="40" y2="110" stroke="#1f618d" stroke-width="3"/><line x1="50" y1="60" x2="50" y2="110" stroke="#1f618d" stroke-width="3"/><line x1="60" y1="60" x2="60" y2="110" stroke="#1f618d" stroke-width="3"/><line x1="70" y1="60" x2="70" y2="110" stroke="#1f618d" stroke-width="3"/><line x1="100" y1="60" x2="100" y2="110" stroke="#1f618d" stroke-width="3"/><line x1="115" y1="60" x2="115" y2="110" stroke="#1f618d" stroke-width="3"/><line x1="130" y1="60" x2="130" y2="110" stroke="#1f618d" stroke-width="3"/><line x1="145" y1="60" x2="145" y2="110" stroke="#1f618d" stroke-width="3"/><line x1="150" y1="60" x2="150" y2="110" stroke="#1f618d" stroke-width="3"/><line x1="160" y1="60" x2="160" y2="110" stroke="#1f618d" stroke-width="3"/><line x1="170" y1="60" x2="170" y2="110" stroke="#1f618d" stroke-width="3"/><line x1="180" y1="60" x2="180" y2="110" stroke="#1f618d" stroke-width="3"/><line x1="185" y1="60" x2="185" y2="110" stroke="#1f618d" stroke-width="3"/><line x1="195" y1="60" x2="195" y2="110" stroke="#1f618d" stroke-width="3"/><line x1="205" y1="60" x2="205" y2="110" stroke="#1f618d" stroke-width="3"/><line x1="225" y1="60" x2="225" y2="110" stroke="#1f618d" stroke-width="3"/><line x1="245" y1="60" x2="245" y2="110" stroke="#1f618d" stroke-width="3"/><line x1="265" y1="60" x2="265" y2="110" stroke="#1f618d" stroke-width="3"/><line x1="285" y1="60" x2="285" y2="110" stroke="#1f618d" stroke-width="3"/><line x1="305" y1="60" x2="305" y2="110" stroke="#1f618d" stroke-width="3"/><line x1="325" y1="60" x2="325" y2="110" stroke="#1f618d" stroke-width="3"/><text x="55" y="130" text-anchor="middle" font-size="12">compression</text><text x="120" y="130" text-anchor="middle" font-size="12">rarefaction</text><line x1="40" y1="150" x2="305" y2="150" stroke="#c0392b" stroke-width="2"/><text x="172" y="168" text-anchor="middle" font-size="12">wavelength (one compression + one rarefaction)</text><text x="350" y="60" font-size="14" font-weight="bold">v = n x wavelength</text><text x="350" y="84" font-size="13">Infrasonic: below 20 Hz</text><text x="350" y="104" font-size="13">Audible: 20 Hz to 20 kHz</text><text x="350" y="124" font-size="13">Ultrasonic: above 20 kHz</text><text x="30" y="200" font-size="13">Solid > Liquid > Gas   (iron 5950, water 1493, air 343 m/s)</text><text x="30" y="222" font-size="13">v at T degrees C = 331 + 0.61 T m/s; humid air is faster; denser gas is slower</text></g></svg>