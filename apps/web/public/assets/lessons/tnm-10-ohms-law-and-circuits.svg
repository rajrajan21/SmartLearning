<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" width="100%" role="img"><rect width="560" height="280" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#333"/></marker></defs><text x="280.0" y="24" text-anchor="middle" font-weight="bold">Ohm's law: V = I R</text><line x1="70" y1="230" x2="70" y2="50" stroke="#333" stroke-width="2"/><line x1="70" y1="230" x2="300" y2="230" stroke="#333" stroke-width="2"/><line x1="70" y1="230" x2="280" y2="70" stroke="#c0392b" stroke-width="3"/><text x="285" y="68" font-size="13" fill="#c0392b">straight line</text><text x="40" y="60" font-size="13">V</text><text x="300" y="250" font-size="13">I</text><text x="90" y="262" font-size="12">V-I graph of a conductor at constant temperature</text><rect x="340" y="70" width="200" height="50" rx="8" fill="#fcf3cf" stroke="#333"/><text x="440.0" y="92" text-anchor="middle" font-size="14" font-weight="bold">V = I R</text><text x="440.0" y="111" text-anchor="middle" font-size="14">R = V / I</text><rect x="340" y="140" width="200" height="50" rx="8" fill="#d5f5e3" stroke="#333"/><text x="440.0" y="162" text-anchor="middle" font-size="12" font-weight="bold">Unit of R: ohm (V/A)</text><text x="440.0" y="179" text-anchor="middle" font-size="12">1 ohm = 1 volt per ampere</text><rect x="340" y="210" width="200" height="50" rx="8" fill="#d6eaf8" stroke="#333"/><text x="440.0" y="232" text-anchor="middle" font-size="12" font-weight="bold">Slope of V-I line = R</text><text x="440.0" y="249" text-anchor="middle" font-size="12">Conductance G = 1/R (mho)</text></g></svg>