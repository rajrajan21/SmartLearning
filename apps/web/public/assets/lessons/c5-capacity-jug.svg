<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 305" width="100%" role="img"><rect width="640" height="305" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="20" y="24" font-size="15" font-weight="bold">Measuring jug: 1 litre = 1,000 millilitres</text><rect x="60" y="40" width="110" height="220" fill="#fff" stroke="#333" stroke-width="3"/><rect x="61" y="130" width="108" height="129" fill="#85c1e9" stroke="#333"/><line x1="170" y1="40" x2="195" y2="40" stroke="#333"/><text x="200" y="45" font-size="14">1 l</text><line x1="170" y1="95" x2="195" y2="95" stroke="#333"/><text x="200" y="100" font-size="14">750 ml</text><line x1="170" y1="150" x2="195" y2="150" stroke="#333"/><text x="200" y="155" font-size="14">500 ml</text><line x1="170" y1="205" x2="195" y2="205" stroke="#333"/><text x="200" y="210" font-size="14">250 ml</text><text x="60" y="290" font-size="14">Water is at 500 ml (half a litre)</text><rect x="380" y="150" width="70" height="110" fill="#f9e79f" stroke="#333"/><text x="360" y="140" font-size="14">1 l bottle</text><rect x="480" y="200" width="45" height="60" fill="#f9e79f" stroke="#333"/><text x="465" y="190" font-size="14">500 ml</text><rect x="550" y="225" width="30" height="35" fill="#f9e79f" stroke="#333"/><text x="540" y="215" font-size="14">200 ml</text></g></svg>