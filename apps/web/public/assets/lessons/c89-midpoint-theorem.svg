<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="100%" role="img"><rect width="520" height="320" fill="#ffffff"/><g font-family="sans-serif" font-size="15" fill="#222" stroke-linecap="round" stroke-linejoin="round"><polygon points="260,30 60,280 460,280" fill="#eaf4fb" stroke="#333" stroke-width="2"/><line x1="160" y1="155" x2="360" y2="155" stroke="#c0392b" stroke-width="3"/><text x="255" y="22" font-size="15" fill="#222" text-anchor="start">A</text><text x="40" y="296" font-size="15" fill="#222" text-anchor="start">B</text><text x="465" y="296" font-size="15" fill="#222" text-anchor="start">C</text><text x="135" y="160" font-size="15" fill="#222" text-anchor="start">D</text><text x="367" y="160" font-size="15" fill="#222" text-anchor="start">E</text><text x="20" y="70" font-size="14" fill="#2874a6" text-anchor="start">D, E are the midpoints</text><text x="20" y="90" font-size="14" fill="#2874a6" text-anchor="start">of AB and AC</text><text x="150" y="232" font-size="16" fill="#c0392b" text-anchor="start">DE ∥ BC</text><text x="150" y="308" font-size="15" fill="#222" text-anchor="start">DE = ½ BC  (Midpoint Theorem)</text></g></svg>