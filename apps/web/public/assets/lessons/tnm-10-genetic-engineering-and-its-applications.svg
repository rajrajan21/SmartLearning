<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="100%" role="img"><rect width="560" height="250" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="24" text-anchor="middle" font-weight="bold">Steps of gene cloning</text><rect x="10" y="60" width="100" height="70" rx="8" fill="#fadbd8" stroke="#333"/><text x="60" y="88" text-anchor="middle" font-size="11">Cut DNA with</text><text x="60" y="106" text-anchor="middle" font-size="11">restriction enzyme</text><rect x="115" y="60" width="100" height="70" rx="8" fill="#fdebd0" stroke="#333"/><text x="165" y="88" text-anchor="middle" font-size="11">Join to plasmid</text><text x="165" y="106" text-anchor="middle" font-size="11">by DNA ligase</text><rect x="220" y="60" width="100" height="70" rx="8" fill="#fcf3cf" stroke="#333"/><text x="270" y="88" text-anchor="middle" font-size="11">rDNA enters</text><text x="270" y="106" text-anchor="middle" font-size="11">bacterium</text><rect x="325" y="60" width="100" height="70" rx="8" fill="#d5f5e3" stroke="#333"/><text x="375" y="88" text-anchor="middle" font-size="11">Bacterium</text><text x="375" y="106" text-anchor="middle" font-size="11">multiplies</text><rect x="430" y="60" width="100" height="70" rx="8" fill="#d6eaf8" stroke="#333"/><text x="480" y="88" text-anchor="middle" font-size="11">Gene product</text><text x="480" y="106" text-anchor="middle" font-size="11">expressed</text><polygon points="112,95 122,90 122,100" fill="#333"/><polygon points="217,95 227,90 227,100" fill="#333"/><polygon points="322,95 332,90 332,100" fill="#333"/><polygon points="427,95 437,90 437,100" fill="#333"/><text x="280" y="170" text-anchor="middle" font-size="13">Restriction enzymes = molecular scissors; DNA ligase = molecular glue</text><text x="280" y="195" text-anchor="middle" font-size="13">Plasmid: small circular DNA of bacteria that replicates on its own</text><text x="280" y="220" text-anchor="middle" font-size="13">Products: insulin (Eli Lilly, 1979), growth hormone, vaccines</text></g></svg>