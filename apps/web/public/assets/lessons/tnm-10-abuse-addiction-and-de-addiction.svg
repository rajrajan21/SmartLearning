<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="100%" role="img"><rect width="560" height="250" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="24" text-anchor="middle" font-weight="bold">Drug de-addiction: the path to recovery</text><rect x="10" y="55" width="100" height="80" rx="8" fill="#fadbd8" stroke="#333"/><text x="60.0" y="77" text-anchor="middle" font-size="12" font-weight="bold">1 Detoxify</text><text x="60.0" y="94" text-anchor="middle" font-size="12">drug stopped</text><text x="60.0" y="111" text-anchor="middle" font-size="12">gradually</text><rect x="120" y="55" width="100" height="80" rx="8" fill="#fdebd0" stroke="#333"/><text x="170.0" y="77" text-anchor="middle" font-size="11" font-weight="bold">2 Psychotherapy</text><text x="170.0" y="93" text-anchor="middle" font-size="11">individual and</text><text x="170.0" y="109" text-anchor="middle" font-size="11">group counselling</text><rect x="230" y="55" width="100" height="80" rx="8" fill="#fcf3cf" stroke="#333"/><text x="280.0" y="77" text-anchor="middle" font-size="12" font-weight="bold">3 Family</text><text x="280.0" y="94" text-anchor="middle" font-size="12">counselling</text><text x="280.0" y="111" text-anchor="middle" font-size="12">accept addict</text><rect x="340" y="55" width="100" height="80" rx="8" fill="#d5f5e3" stroke="#333"/><text x="390.0" y="77" text-anchor="middle" font-size="12" font-weight="bold">4 Rehabilitation</text><text x="390.0" y="94" text-anchor="middle" font-size="12">vocational</text><text x="390.0" y="111" text-anchor="middle" font-size="12">training</text><rect x="450" y="55" width="100" height="80" rx="8" fill="#d6eaf8" stroke="#333"/><text x="500.0" y="77" text-anchor="middle" font-size="12" font-weight="bold">5 Follow-up</text><text x="500.0" y="94" text-anchor="middle" font-size="12">healthy life</text><text x="280" y="175" text-anchor="middle" font-size="13">WHO (1984): use the term drug dependence; Child Helpline 1098</text><text x="280" y="200" text-anchor="middle" font-size="13">26 June: International Day against Drug Abuse; 31 May: No Tobacco Day</text></g></svg>