<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" width="100%" role="img"><rect width="560" height="260" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="24" text-anchor="middle" font-weight="bold">ABO blood groups: who can give to whom</text><rect x="60" y="60" width="100" height="50" rx="10" fill="#f5b7b1" stroke="#333"/><text x="110" y="92" text-anchor="middle" font-size="20" font-weight="bold">A</text><rect x="200" y="60" width="100" height="50" rx="10" fill="#aed6f1" stroke="#333"/><text x="250" y="92" text-anchor="middle" font-size="20" font-weight="bold">B</text><rect x="340" y="60" width="100" height="50" rx="10" fill="#d2b4de" stroke="#333"/><text x="390" y="92" text-anchor="middle" font-size="20" font-weight="bold">AB</text><rect x="480" y="60" width="100" height="50" rx="10" fill="#f9e79f" stroke="#333"/><text x="530" y="92" text-anchor="middle" font-size="20" font-weight="bold">O</text><text x="110" y="135" text-anchor="middle" font-size="12">antigen A, anti-b</text><text x="250" y="135" text-anchor="middle" font-size="12">antigen B, anti-a</text><text x="390" y="135" text-anchor="middle" font-size="12">A and B, no antibody</text><text x="530" y="135" text-anchor="middle" font-size="12">no antigen, both</text><text x="280" y="180" text-anchor="middle" font-size="15">O is the universal donor (gives to A, B, AB, O)</text><text x="280" y="205" text-anchor="middle" font-size="15">AB is the universal recipient (receives from A, B, AB, O)</text><text x="280" y="235" text-anchor="middle" font-size="13">A gives to A and AB; B gives to B and AB</text></g></svg>