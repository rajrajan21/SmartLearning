<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="100%" role="img"><rect width="560" height="300" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="24" text-anchor="middle" font-weight="bold">Photosynthesis inside the chloroplast</text><ellipse cx="280" cy="160" rx="250" ry="110" fill="#d5f5e3" stroke="#1e8449" stroke-width="2"/><rect x="60" y="110" width="150" height="70" rx="8" fill="#a9dfbf" stroke="#333"/><text x="135.0" y="141.0" text-anchor="middle" font-size="14">Grana (thylakoids)</text><text x="135.0" y="159.0" text-anchor="middle" font-size="12">LIGHT reaction</text><rect x="350" y="110" width="150" height="70" rx="8" fill="#fcf3cf" stroke="#333"/><text x="425.0" y="141.0" text-anchor="middle" font-size="14">Stroma</text><text x="425.0" y="159.0" text-anchor="middle" font-size="12">DARK reaction (Calvin)</text><line x1="210" y1="145" x2="350" y2="145" stroke="#333" stroke-width="2"/><polygon points="350,145 342,140 342,150" fill="#333"/><text x="280" y="135" text-anchor="middle" font-size="13">ATP + NADPH</text><text x="130" y="95" text-anchor="middle" font-size="13">Sunlight + H2O in, O2 out</text><text x="425" y="95" text-anchor="middle" font-size="13">CO2 in, glucose out</text><text x="280" y="250" text-anchor="middle" font-size="14">6CO2 + 12H2O -> C6H12O6 + 6H2O + 6O2 (light, chlorophyll)</text></g></svg>