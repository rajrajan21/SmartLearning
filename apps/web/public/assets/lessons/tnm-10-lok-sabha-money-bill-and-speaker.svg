<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" width="100%" role="img"><rect width="560" height="280" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="22" text-anchor="middle" font-weight="bold">How the Lok Sabha works</text><rect x="10" y="40" width="170" height="95" rx="8" fill="#d6eaf8" stroke="#333"/><text x="95.0" y="62" text-anchor="middle" font-size="11" font-weight="bold">Election</text><text x="95.0" y="78" text-anchor="middle" font-size="11">direct, adult franchise</text><text x="95.0" y="94" text-anchor="middle" font-size="11">all citizens 18+ vote</text><rect x="195" y="40" width="170" height="95" rx="8" fill="#d5f5e3" stroke="#333"/><text x="280.0" y="62" text-anchor="middle" font-size="11" font-weight="bold">Money Bill</text><text x="280.0" y="78" text-anchor="middle" font-size="11">only Lok Sabha introduces</text><text x="280.0" y="94" text-anchor="middle" font-size="11">Rajya Sabha has 14 days</text><rect x="380" y="40" width="170" height="95" rx="8" fill="#fcf3cf" stroke="#333"/><text x="465.0" y="62" text-anchor="middle" font-size="11" font-weight="bold">Speaker</text><text x="465.0" y="78" text-anchor="middle" font-size="11">presides, decides</text><text x="465.0" y="94" text-anchor="middle" font-size="11">Money Bill or not</text><rect x="10" y="150" width="170" height="95" rx="8" fill="#fadbd8" stroke="#333"/><text x="95.0" y="172" text-anchor="middle" font-size="11" font-weight="bold">No-confidence motion</text><text x="95.0" y="188" text-anchor="middle" font-size="11">only in Lok Sabha</text><text x="95.0" y="204" text-anchor="middle" font-size="11">ministry must resign if passed</text><rect x="195" y="150" width="170" height="95" rx="8" fill="#ebdef0" stroke="#333"/><text x="280.0" y="172" text-anchor="middle" font-size="11" font-weight="bold">Sessions</text><text x="280.0" y="188" text-anchor="middle" font-size="11">Budget Feb to May</text><text x="280.0" y="204" text-anchor="middle" font-size="11">Monsoon Jul-Sep, Winter Nov-Dec</text><rect x="380" y="150" width="170" height="95" rx="8" fill="#fdebd0" stroke="#333"/><text x="465.0" y="172" text-anchor="middle" font-size="11" font-weight="bold">Tamil Nadu</text><text x="465.0" y="188" text-anchor="middle" font-size="11">39 Lok Sabha seats</text><text x="465.0" y="204" text-anchor="middle" font-size="11">18 Rajya Sabha seats</text><text x="280" y="268" text-anchor="middle" font-size="13">Speaker remains in office after dissolution until the new Speaker is elected</text></g></svg>