<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" width="100%" role="img"><rect width="560" height="280" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="22" text-anchor="middle" font-weight="bold">Natural vegetation and rainfall</text><rect x="20" y="38" width="520" height="30" rx="6" fill="#d5f5e3" stroke="#333"/><text x="30" y="58" font-size="12" font-weight="bold">Tropical evergreen</text><text x="190" y="58" font-size="12">above 200 cm</text><text x="380" y="58" font-size="12">rubber, mahogany, ebony</text><rect x="20" y="72" width="520" height="30" rx="6" fill="#fcf3cf" stroke="#333"/><text x="30" y="92" font-size="12" font-weight="bold">Tropical deciduous</text><text x="190" y="92" font-size="12">100 - 200 cm</text><text x="380" y="92" font-size="12">teak, sal, sandalwood</text><rect x="20" y="106" width="520" height="30" rx="6" fill="#fdebd0" stroke="#333"/><text x="30" y="126" font-size="12" font-weight="bold">Tropical dry</text><text x="190" y="126" font-size="12">50 - 100 cm</text><text x="380" y="126" font-size="12">babool, khair, banyan</text><rect x="20" y="140" width="520" height="30" rx="6" fill="#fadbd8" stroke="#333"/><text x="30" y="160" font-size="12" font-weight="bold">Desert, thorn</text><text x="190" y="160" font-size="12">below 50 cm</text><text x="380" y="160" font-size="12">babul, kikar, wild palm</text><rect x="20" y="174" width="520" height="30" rx="6" fill="#d6eaf8" stroke="#333"/><text x="30" y="194" font-size="12" font-weight="bold">Mountain / alpine</text><text x="190" y="194" font-size="12">altitude based</text><text x="380" y="194" font-size="12">oak, fir, pine, juniper</text><rect x="20" y="208" width="520" height="30" rx="6" fill="#ebdef0" stroke="#333"/><text x="30" y="228" font-size="12" font-weight="bold">Mangrove (tidal)</text><text x="190" y="228" font-size="12">deltas, estuaries</text><text x="380" y="228" font-size="12">Sundarbans, Godavari delta</text></g></svg>