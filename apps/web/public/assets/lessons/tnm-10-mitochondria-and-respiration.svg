<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" width="100%" role="img"><rect width="560" height="260" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="24" text-anchor="middle" font-weight="bold">Aerobic respiration in three stages</text><rect x="20" y="60" width="150" height="70" rx="8" fill="#fdebd0" stroke="#333"/><text x="95.0" y="91.0" text-anchor="middle" font-size="14">Glycolysis</text><text x="95.0" y="109.0" text-anchor="middle" font-size="12">cytoplasm</text><rect x="205" y="60" width="150" height="70" rx="8" fill="#fadbd8" stroke="#333"/><text x="280.0" y="91.0" text-anchor="middle" font-size="14">Krebs cycle</text><text x="280.0" y="109.0" text-anchor="middle" font-size="12">mitochondrial matrix</text><rect x="390" y="60" width="150" height="70" rx="8" fill="#d6eaf8" stroke="#333"/><text x="465.0" y="91.0" text-anchor="middle" font-size="14">Electron transport</text><text x="465.0" y="109.0" text-anchor="middle" font-size="12">inner membrane</text><line x1="170" y1="95" x2="205" y2="95" stroke="#333" stroke-width="2"/><polygon points="205,95 197,90 197,100" fill="#333"/><line x1="355" y1="95" x2="390" y2="95" stroke="#333" stroke-width="2"/><polygon points="390,95 382,90 382,100" fill="#333"/><text x="95" y="155" text-anchor="middle" font-size="13">glucose (6C) -> 2 pyruvic acid (3C)</text><text x="280" y="155" text-anchor="middle" font-size="13">pyruvic acid -> CO2 + H2O</text><text x="465" y="155" text-anchor="middle" font-size="13">O2 -> water; ATP made</text><text x="280" y="215" text-anchor="middle" font-size="14">C6H12O6 + 6O2 -> 6CO2 + 6H2O + ATP</text></g></svg>