<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" width="100%" role="img"><rect width="560" height="270" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#333"/></marker></defs><text x="280.0" y="24" text-anchor="middle" font-weight="bold">The mole links mass, particles and volume</text><rect x="210" y="100" width="140" height="60" rx="8" fill="#fcf3cf" stroke="#333"/><text x="280.0" y="122" text-anchor="middle" font-size="12" font-weight="bold">1 mole</text><text x="280.0" y="139" text-anchor="middle" font-size="12">6.023 x 10^23 particles</text><rect x="10" y="100" width="140" height="60" rx="8" fill="#d6eaf8" stroke="#333"/><text x="80.0" y="122" text-anchor="middle" font-size="12" font-weight="bold">Mass in grams</text><text x="80.0" y="139" text-anchor="middle" font-size="12">= molar mass</text><rect x="410" y="100" width="140" height="60" rx="8" fill="#d5f5e3" stroke="#333"/><text x="480.0" y="122" text-anchor="middle" font-size="12" font-weight="bold">Gas volume at STP</text><text x="480.0" y="139" text-anchor="middle" font-size="12">= 22.4 litre</text><line x1="210" y1="130" x2="152" y2="130" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="181" y="118" text-anchor="middle" font-size="12">mass / molar mass</text><line x1="350" y1="130" x2="408" y2="130" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="379" y="118" text-anchor="middle" font-size="12">x 22.4 L</text><text x="280" y="200" text-anchor="middle" font-size="13">Moles = mass / molar mass = number of particles / 6.023 x 10^23</text><text x="280" y="226" text-anchor="middle" font-size="13">Example: 32 g of O2 = 1 mole = 6.023 x 10^23 molecules = 22.4 L at STP</text><text x="280" y="250" text-anchor="middle" font-size="12">STP = 273.15 K and 1 atm</text></g></svg>