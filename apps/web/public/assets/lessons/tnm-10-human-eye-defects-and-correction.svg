<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 260" width="100%" role="img"><rect width="620" height="260" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="310" y="22" text-anchor="middle" font-weight="bold">Human eye and its defects</text><ellipse cx="110" cy="130" rx="85" ry="70" fill="#fdfefe" stroke="#333"/><path d="M40,95 Q25,130 40,165" fill="none" stroke="#1f618d" stroke-width="3"/><ellipse cx="62" cy="130" rx="8" ry="22" fill="#aed6f1" stroke="#333"/><path d="M170,80 Q200,130 170,180" fill="none" stroke="#c0392b" stroke-width="3"/><text x="110" y="132" text-anchor="middle" font-size="12">eyeball</text><text x="62" y="210" text-anchor="middle" font-size="12">lens</text><text x="180" y="208" font-size="12" fill="#c0392b">retina</text><text x="230" y="60" font-size="14" font-weight="bold">Myopia (short sight)</text><text x="230" y="82" font-size="13">near clear, far blurred</text><text x="230" y="102" font-size="13">image falls in front of retina</text><text x="230" y="122" font-size="13">corrected with a concave lens</text><text x="230" y="160" font-size="14" font-weight="bold">Hypermetropia (long sight)</text><text x="230" y="182" font-size="13">far clear, near blurred</text><text x="230" y="202" font-size="13">image falls behind the retina</text><text x="230" y="222" font-size="13">corrected with a convex lens</text><text x="470" y="60" font-size="13">Normal eye</text><text x="470" y="80" font-size="13">near point 25 cm</text><text x="470" y="100" font-size="13">far point infinity</text></g></svg>