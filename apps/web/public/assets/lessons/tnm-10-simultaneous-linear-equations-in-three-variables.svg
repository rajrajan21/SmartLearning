<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" width="100%" role="img"><rect width="560" height="230" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="22" text-anchor="middle" font-weight="bold">Three planes: how can they meet?</text><polygon points="30,130 130,100 160,150 60,180" fill="#d6eaf8" stroke="#333"/><polygon points="40,100 90,70 130,170 80,190" fill="#fadbd8" stroke="#333" opacity="0.8"/><polygon points="20,150 150,120 160,160 30,190" fill="#d5f5e3" stroke="#333" opacity="0.8"/><text x="95" y="215" text-anchor="middle" font-size="12">one common point: unique solution</text><polygon points="210,130 300,100 330,150 240,180" fill="#d6eaf8" stroke="#333"/><polygon points="215,120 310,95 335,145 245,170" fill="#fadbd8" stroke="#333" opacity="0.8"/><text x="275" y="215" text-anchor="middle" font-size="12">common line: infinitely many</text><polygon points="390,90 480,90 480,110 390,110" fill="#d6eaf8" stroke="#333"/><polygon points="390,125 480,125 480,145 390,145" fill="#fadbd8" stroke="#333"/><polygon points="390,160 480,160 480,180 390,180" fill="#d5f5e3" stroke="#333"/><text x="440" y="215" text-anchor="middle" font-size="12">parallel planes: no solution</text></g></svg>