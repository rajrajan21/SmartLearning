<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="100%" role="img"><rect width="560" height="300" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="22" text-anchor="middle" font-weight="bold">Powers of the President of India</text><rect x="10" y="40" width="170" height="100" rx="8" fill="#d6eaf8" stroke="#333"/><text x="95.0" y="62" text-anchor="middle" font-size="11" font-weight="bold">Executive</text><text x="95.0" y="78" text-anchor="middle" font-size="11">appoints PM, Governors,</text><text x="95.0" y="94" text-anchor="middle" font-size="11">judges, CAG, CEC</text><rect x="195" y="40" width="170" height="100" rx="8" fill="#d5f5e3" stroke="#333"/><text x="280.0" y="62" text-anchor="middle" font-size="11" font-weight="bold">Legislative</text><text x="280.0" y="78" text-anchor="middle" font-size="11">summons Parliament,</text><text x="280.0" y="94" text-anchor="middle" font-size="11">assents to bills, nominates 12</text><rect x="380" y="40" width="170" height="100" rx="8" fill="#fcf3cf" stroke="#333"/><text x="465.0" y="62" text-anchor="middle" font-size="11" font-weight="bold">Financial</text><text x="465.0" y="78" text-anchor="middle" font-size="11">Budget with approval,</text><text x="465.0" y="94" text-anchor="middle" font-size="11">Contingency Fund</text><rect x="10" y="155" width="170" height="100" rx="8" fill="#fadbd8" stroke="#333"/><text x="95.0" y="177" text-anchor="middle" font-size="11" font-weight="bold">Judicial</text><text x="95.0" y="193" text-anchor="middle" font-size="11">Article 72: pardon,</text><text x="95.0" y="209" text-anchor="middle" font-size="11">reprieve, commute</text><rect x="195" y="155" width="170" height="100" rx="8" fill="#ebdef0" stroke="#333"/><text x="280.0" y="177" text-anchor="middle" font-size="11" font-weight="bold">Military and Diplomatic</text><text x="280.0" y="193" text-anchor="middle" font-size="11">Supreme Commander,</text><text x="280.0" y="209" text-anchor="middle" font-size="11">appoints ambassadors</text><rect x="380" y="155" width="170" height="100" rx="8" fill="#fdebd0" stroke="#333"/><text x="465.0" y="177" text-anchor="middle" font-size="11" font-weight="bold">Emergency</text><text x="465.0" y="193" text-anchor="middle" font-size="11">Art 352 National</text><text x="465.0" y="209" text-anchor="middle" font-size="11">356 State, 360 Financial</text><text x="280" y="282" text-anchor="middle" font-size="13">Elected for 5 years by an electoral college, minimum age 35</text></g></svg>