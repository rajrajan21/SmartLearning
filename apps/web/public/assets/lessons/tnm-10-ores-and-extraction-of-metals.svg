<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="100%" role="img"><rect width="520" height="360" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="260" y="24" text-anchor="middle" font-weight="bold">Blast furnace for iron</text><polygon points="190,40 330,40 350,200 380,300 140,300 170,200" fill="#f5cba7" stroke="#333" stroke-width="2"/><line x1="165" y1="120" x2="355" y2="120" stroke="#333" stroke-dasharray="4"/><line x1="150" y1="210" x2="370" y2="210" stroke="#333" stroke-dasharray="4"/><text x="260" y="95" text-anchor="middle" font-size="14">Reduction zone 400 C</text><text x="260" y="115" text-anchor="middle" font-size="13">Fe2O3 + 3CO -> 2Fe + 3CO2</text><text x="260" y="165" text-anchor="middle" font-size="14">Fusion zone 1000 C</text><text x="260" y="185" text-anchor="middle" font-size="13">CO2 + C -> 2CO ; CaCO3 -> CaO + CO2</text><text x="260" y="245" text-anchor="middle" font-size="14">Combustion zone 1500 C</text><text x="260" y="265" text-anchor="middle" font-size="13">C + O2 -> CO2 (hot air blast)</text><text x="110" y="30" font-size="14" fill="#1e8449">Ore + coke + limestone (8:4:1)</text><line x1="150" y1="36" x2="195" y2="46" stroke="#1e8449"/><text x="395" y="250" font-size="14" fill="#a04000">Hot air in</text><text x="385" y="330" font-size="14" fill="#7d3c98">Slag out</text><text x="20" y="330" font-size="14" fill="#c0392b">Molten iron out</text><text x="260" y="330" text-anchor="middle" font-size="13">CaO + SiO2 -> CaSiO3 (slag)</text></g></svg>