<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" width="100%" role="img"><rect width="560" height="260" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="24" text-anchor="middle" font-weight="bold">Homologous versus analogous organs</text><rect x="20" y="45" width="250" height="150" rx="10" fill="#d6eaf8" stroke="#333"/><text x="145" y="70" text-anchor="middle" font-size="15" font-weight="bold">Homologous</text><text x="145" y="95" text-anchor="middle" font-size="13">same origin and bone plan</text><text x="145" y="118" text-anchor="middle" font-size="13">different functions</text><text x="145" y="148" text-anchor="middle" font-size="13">human hand, cat leg,</text><text x="145" y="166" text-anchor="middle" font-size="13">whale flipper, bat wing</text><rect x="290" y="45" width="250" height="150" rx="10" fill="#fdebd0" stroke="#333"/><text x="415" y="70" text-anchor="middle" font-size="15" font-weight="bold">Analogous</text><text x="415" y="95" text-anchor="middle" font-size="13">different origin</text><text x="415" y="118" text-anchor="middle" font-size="13">similar function</text><text x="415" y="148" text-anchor="middle" font-size="13">wings of a bat,</text><text x="415" y="166" text-anchor="middle" font-size="13">a bird and an insect</text><text x="280" y="228" text-anchor="middle" font-size="14">Homologous organs show common ancestry (divergent evolution)</text></g></svg>