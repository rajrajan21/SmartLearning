<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 230" width="100%" role="img"><rect width="540" height="230" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="270" y="24" text-anchor="middle" font-weight="bold">Body regions of the Indian cattle leech (33 segments)</text><rect x="20" y="70" width="75" height="50" fill="#f5b7b1" stroke="#333"/><text x="57.5" y="62" text-anchor="middle" font-size="12">Cephalic 1-5</text><rect x="95" y="70" width="45" height="50" fill="#fad7a0" stroke="#333"/><text x="117.5" y="150" text-anchor="middle" font-size="12">Pre-clitellar 6-8</text><rect x="140" y="70" width="45" height="50" fill="#f9e79f" stroke="#333"/><text x="162.5" y="62" text-anchor="middle" font-size="12">Clitellar 9-11</text><rect x="185" y="70" width="165" height="50" fill="#abebc6" stroke="#333"/><text x="267.5" y="150" text-anchor="middle" font-size="12">Middle 12-22</text><rect x="350" y="70" width="60" height="50" fill="#a9cce3" stroke="#333"/><text x="380.0" y="62" text-anchor="middle" font-size="12">Caudal 23-26</text><rect x="410" y="70" width="105" height="50" fill="#d2b4de" stroke="#333"/><text x="462.5" y="150" text-anchor="middle" font-size="12">Posterior sucker 27-33</text><text x="270" y="190" text-anchor="middle" font-size="13">Anterior sucker (mouth) at the left end, posterior sucker at the right end</text><text x="270" y="212" text-anchor="middle" font-size="13">Clitellum on segments 9-11 forms the cocoon in the breeding season</text></g></svg>