<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 352" width="100%" role="img"><rect width="520" height="352" fill="#ffffff"/><g font-family="sans-serif" font-size="13" fill="#222" stroke-linecap="round" stroke-linejoin="round"><text x="260" y="24" font-size="15" fill="#2874a6" text-anchor="middle" font-weight="bold">How an election works</text><rect x="20" y="40" width="480" height="34" rx="6" fill="#eaf4fb" stroke="#2874a6" stroke-width="2"/><text x="32" y="62" font-size="15" fill="#c0392b" text-anchor="start" font-weight="bold">1</text><text x="60" y="55" font-size="13" fill="#222" text-anchor="start" font-weight="bold">Electoral roll</text><text x="60" y="69" font-size="11" fill="#555" text-anchor="start" font-weight="normal">Eligible voters are listed</text><line x1="260" y1="74" x2="260.0" y2="82.0" stroke="#555" stroke-width="1.5"/><polygon points="260,86 256.5,77.7 263.5,77.7" fill="#555"/><rect x="20" y="86" width="480" height="34" rx="6" fill="#eaf4fb" stroke="#2874a6" stroke-width="2"/><text x="32" y="108" font-size="15" fill="#c0392b" text-anchor="start" font-weight="bold">2</text><text x="60" y="101" font-size="13" fill="#222" text-anchor="start" font-weight="bold">Constituencies</text><text x="60" y="115" font-size="11" fill="#555" text-anchor="start" font-weight="normal">The country is divided into constituencies</text><line x1="260" y1="120" x2="260.0" y2="128.0" stroke="#555" stroke-width="1.5"/><polygon points="260,132 256.5,123.7 263.5,123.7" fill="#555"/><rect x="20" y="132" width="480" height="34" rx="6" fill="#eaf4fb" stroke="#2874a6" stroke-width="2"/><text x="32" y="154" font-size="15" fill="#c0392b" text-anchor="start" font-weight="bold">3</text><text x="60" y="147" font-size="13" fill="#222" text-anchor="start" font-weight="bold">Candidates</text><text x="60" y="161" font-size="11" fill="#555" text-anchor="start" font-weight="normal">Parties and candidates follow the Model Code of Conduct</text><line x1="260" y1="166" x2="260.0" y2="174.0" stroke="#555" stroke-width="1.5"/><polygon points="260,178 256.5,169.7 263.5,169.7" fill="#555"/><rect x="20" y="178" width="480" height="34" rx="6" fill="#eaf4fb" stroke="#2874a6" stroke-width="2"/><text x="32" y="200" font-size="15" fill="#c0392b" text-anchor="start" font-weight="bold">4</text><text x="60" y="193" font-size="13" fill="#222" text-anchor="start" font-weight="bold">Voting on EVMs</text><text x="60" y="207" font-size="11" fill="#555" text-anchor="start" font-weight="normal">Secret ballot, one vote each, no proxy voting</text><line x1="260" y1="212" x2="260.0" y2="220.0" stroke="#555" stroke-width="1.5"/><polygon points="260,224 256.5,215.7 263.5,215.7" fill="#555"/><rect x="20" y="224" width="480" height="34" rx="6" fill="#eaf4fb" stroke="#2874a6" stroke-width="2"/><text x="32" y="246" font-size="15" fill="#c0392b" text-anchor="start" font-weight="bold">5</text><text x="60" y="239" font-size="13" fill="#222" text-anchor="start" font-weight="bold">First past the post</text><text x="60" y="253" font-size="11" fill="#555" text-anchor="start" font-weight="normal">In each constituency the candidate with most votes wins</text><rect x="20" y="274" width="480" height="40" rx="6" fill="#d5f5e3" stroke="#1e8449" stroke-width="2"/><text x="260" y="292" font-size="12" fill="#1e8449" text-anchor="middle" font-weight="bold">The Election Commission of India, an independent body,</text><text x="260" y="308" font-size="12" fill="#1e8449" text-anchor="middle" font-weight="bold">conducts free and fair elections</text><text x="260" y="336" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">Universal adult franchise: every citizen aged 18 or above has one vote of equal value</text></g></svg>