<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 290" width="100%" role="img"><rect width="560" height="290" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280.0" y="24" text-anchor="middle" font-weight="bold">Four types of chemical reactions</text><rect x="10" y="40" width="265" height="105" rx="8" fill="#d5f5e3" stroke="#333"/><text x="142.5" y="62" text-anchor="middle" font-size="13" font-weight="bold">Combination</text><text x="142.5" y="80" text-anchor="middle" font-size="13">A + B -> AB</text><text x="142.5" y="98" text-anchor="middle" font-size="13">2Na + Cl2 -> 2NaCl</text><text x="142.5" y="116" text-anchor="middle" font-size="13">usually exothermic</text><rect x="285" y="40" width="265" height="105" rx="8" fill="#fadbd8" stroke="#333"/><text x="417.5" y="62" text-anchor="middle" font-size="13" font-weight="bold">Decomposition</text><text x="417.5" y="80" text-anchor="middle" font-size="13">AB -> A + B</text><text x="417.5" y="98" text-anchor="middle" font-size="13">2HgO -> 2Hg + O2 (heat)</text><text x="417.5" y="116" text-anchor="middle" font-size="13">thermal, electrolytic, photo</text><rect x="10" y="155" width="265" height="105" rx="8" fill="#d6eaf8" stroke="#333"/><text x="142.5" y="177" text-anchor="middle" font-size="13" font-weight="bold">Single displacement</text><text x="142.5" y="195" text-anchor="middle" font-size="13">A + BC -> AC + B</text><text x="142.5" y="213" text-anchor="middle" font-size="13">Zn + 2HCl -> ZnCl2 + H2</text><text x="142.5" y="231" text-anchor="middle" font-size="13">more active metal displaces</text><rect x="285" y="155" width="265" height="105" rx="8" fill="#fcf3cf" stroke="#333"/><text x="417.5" y="177" text-anchor="middle" font-size="13" font-weight="bold">Double displacement</text><text x="417.5" y="195" text-anchor="middle" font-size="13">AB + CD -> AD + CB</text><text x="417.5" y="213" text-anchor="middle" font-size="13">precipitation, neutralization</text><text x="417.5" y="231" text-anchor="middle" font-size="13">ions are exchanged</text><text x="280" y="282" text-anchor="middle" font-size="12">Activity series: K Na Li Ca Mg Al Zn Fe Pb H Cu Ag Au Pt (most to least reactive)</text></g></svg>