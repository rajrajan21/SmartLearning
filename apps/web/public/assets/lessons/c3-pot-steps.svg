<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 215" width="100%" role="img"><rect width="580" height="215" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><rect x="10" y="60" width="85" height="90" rx="10" fill="#ffe9cc" stroke="#8d5524" stroke-width="2"/><text x="52" y="100" text-anchor="middle" font-size="12" font-weight="bold">1</text><text x="52" y="120" text-anchor="middle" font-size="11">Wet the clay</text><path d="M96 105 L104 105" stroke="#333" stroke-width="3"/><rect x="105" y="60" width="85" height="90" rx="10" fill="#ffe9cc" stroke="#8d5524" stroke-width="2"/><text x="147" y="100" text-anchor="middle" font-size="12" font-weight="bold">2</text><text x="147" y="120" text-anchor="middle" font-size="11">Pound and knead</text><path d="M191 105 L199 105" stroke="#333" stroke-width="3"/><rect x="200" y="60" width="85" height="90" rx="10" fill="#ffe9cc" stroke="#8d5524" stroke-width="2"/><text x="242" y="100" text-anchor="middle" font-size="12" font-weight="bold">3</text><text x="242" y="120" text-anchor="middle" font-size="11">Shape on the wheel</text><path d="M286 105 L294 105" stroke="#333" stroke-width="3"/><rect x="295" y="60" width="85" height="90" rx="10" fill="#ffe9cc" stroke="#8d5524" stroke-width="2"/><text x="337" y="100" text-anchor="middle" font-size="12" font-weight="bold">4</text><text x="337" y="120" text-anchor="middle" font-size="11">Dry the pot</text><path d="M381 105 L389 105" stroke="#333" stroke-width="3"/><rect x="390" y="60" width="85" height="90" rx="10" fill="#ffe9cc" stroke="#8d5524" stroke-width="2"/><text x="432" y="100" text-anchor="middle" font-size="12" font-weight="bold">5</text><text x="432" y="120" text-anchor="middle" font-size="11">Bake in the kiln</text><path d="M476 105 L484 105" stroke="#333" stroke-width="3"/><rect x="485" y="60" width="85" height="90" rx="10" fill="#ffe9cc" stroke="#8d5524" stroke-width="2"/><text x="527" y="100" text-anchor="middle" font-size="12" font-weight="bold">6</text><text x="527" y="120" text-anchor="middle" font-size="11">Make patterns</text><text x="290" y="30" text-anchor="middle" font-size="18" font-weight="bold">How a pot is made</text><text x="290" y="190" text-anchor="middle" font-size="14">Clay + water, a spinning stone wheel, a hot kiln, and patterns to finish</text></g></svg>