<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 388" width="100%" role="img"><rect width="520" height="388" fill="#ffffff"/><g font-family="sans-serif" font-size="13" fill="#222" stroke-linecap="round" stroke-linejoin="round"><text x="260" y="22" font-size="15" fill="#2874a6" text-anchor="middle" font-weight="bold">Layers of the atmosphere</text><rect x="60" y="38" width="170" height="40" rx="0" fill="#f4f6f7" stroke="#2874a6" stroke-width="1.5"/><text x="145" y="62.0" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">Exosphere</text><rect x="60" y="78" width="170" height="40" rx="0" fill="#e8eef4" stroke="#2874a6" stroke-width="1.5"/><text x="145" y="102.0" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">Thermosphere</text><rect x="60" y="118" width="170" height="42" rx="0" fill="#d6e6f4" stroke="#2874a6" stroke-width="1.5"/><text x="145" y="143.0" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">Mesosphere</text><rect x="60" y="160" width="170" height="50" rx="0" fill="#bcd9f0" stroke="#2874a6" stroke-width="1.5"/><text x="145" y="189.0" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">Stratosphere</text><rect x="60" y="210" width="170" height="70" rx="0" fill="#8fc3ea" stroke="#2874a6" stroke-width="1.5"/><text x="145" y="249.0" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">Troposphere</text><text x="60" y="296" font-size="12" fill="#555" text-anchor="start" font-weight="normal">Earth's surface</text><line x1="250" y1="245.0" x2="240.0" y2="245.0" stroke="#1e8449" stroke-width="1.5"/><polygon points="236,245.0 244.3,241.5 244.3,248.5" fill="#1e8449"/><text x="256" y="249.0" font-size="12" fill="#1e8449" text-anchor="start" font-weight="normal">weather happens here</text><line x1="250" y1="185.0" x2="240.0" y2="185.0" stroke="#c0392b" stroke-width="1.5"/><polygon points="236,185.0 244.3,181.5 244.3,188.5" fill="#c0392b"/><text x="256" y="189.0" font-size="12" fill="#c0392b" text-anchor="start" font-weight="normal">ozone layer absorbs UV rays</text><text x="60" y="322" font-size="13" fill="#222" text-anchor="start" font-weight="bold">Air is mostly:</text><rect x="60" y="330" width="343" height="22" rx="0" fill="#aed6f1" stroke="#2874a6" stroke-width="1"/><text x="231" y="346" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">Nitrogen about 78%</text><rect x="403" y="330" width="92" height="22" rx="0" fill="#f9e79f" stroke="#b7950b" stroke-width="1"/><text x="449" y="346" font-size="11" fill="#222" text-anchor="middle" font-weight="normal">Oxygen about 21%</text><text x="60" y="372" font-size="12" fill="#555" text-anchor="start" font-weight="normal">with small amounts of argon, carbon dioxide and water vapour</text></g></svg>