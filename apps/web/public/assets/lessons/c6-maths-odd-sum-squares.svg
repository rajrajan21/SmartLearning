<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290" width="100%" role="img"><rect width="600" height="290" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="20" y="26" font-weight="bold">Why 1 + 3 + 5 + 7 + 9 + 11 = 36 (a 6 × 6 square of dots)</text><circle cx="40" cy="50" r="11" fill="#c0392b"/><circle cx="74" cy="50" r="11" fill="#e67e22"/><circle cx="108" cy="50" r="11" fill="#f1c40f"/><circle cx="142" cy="50" r="11" fill="#27ae60"/><circle cx="176" cy="50" r="11" fill="#2980b9"/><circle cx="210" cy="50" r="11" fill="#8e44ad"/><circle cx="40" cy="84" r="11" fill="#e67e22"/><circle cx="74" cy="84" r="11" fill="#e67e22"/><circle cx="108" cy="84" r="11" fill="#f1c40f"/><circle cx="142" cy="84" r="11" fill="#27ae60"/><circle cx="176" cy="84" r="11" fill="#2980b9"/><circle cx="210" cy="84" r="11" fill="#8e44ad"/><circle cx="40" cy="118" r="11" fill="#f1c40f"/><circle cx="74" cy="118" r="11" fill="#f1c40f"/><circle cx="108" cy="118" r="11" fill="#f1c40f"/><circle cx="142" cy="118" r="11" fill="#27ae60"/><circle cx="176" cy="118" r="11" fill="#2980b9"/><circle cx="210" cy="118" r="11" fill="#8e44ad"/><circle cx="40" cy="152" r="11" fill="#27ae60"/><circle cx="74" cy="152" r="11" fill="#27ae60"/><circle cx="108" cy="152" r="11" fill="#27ae60"/><circle cx="142" cy="152" r="11" fill="#27ae60"/><circle cx="176" cy="152" r="11" fill="#2980b9"/><circle cx="210" cy="152" r="11" fill="#8e44ad"/><circle cx="40" cy="186" r="11" fill="#2980b9"/><circle cx="74" cy="186" r="11" fill="#2980b9"/><circle cx="108" cy="186" r="11" fill="#2980b9"/><circle cx="142" cy="186" r="11" fill="#2980b9"/><circle cx="176" cy="186" r="11" fill="#2980b9"/><circle cx="210" cy="186" r="11" fill="#8e44ad"/><circle cx="40" cy="220" r="11" fill="#8e44ad"/><circle cx="74" cy="220" r="11" fill="#8e44ad"/><circle cx="108" cy="220" r="11" fill="#8e44ad"/><circle cx="142" cy="220" r="11" fill="#8e44ad"/><circle cx="176" cy="220" r="11" fill="#8e44ad"/><circle cx="210" cy="220" r="11" fill="#8e44ad"/><rect x="300" y="44" width="18" height="18" fill="#c0392b"/><text x="326" y="58" font-size="15">layer 1 has 1 dots</text><rect x="300" y="78" width="18" height="18" fill="#e67e22"/><text x="326" y="92" font-size="15">layer 2 has 3 dots</text><rect x="300" y="112" width="18" height="18" fill="#f1c40f"/><text x="326" y="126" font-size="15">layer 3 has 5 dots</text><rect x="300" y="146" width="18" height="18" fill="#27ae60"/><text x="326" y="160" font-size="15">layer 4 has 7 dots</text><rect x="300" y="180" width="18" height="18" fill="#2980b9"/><text x="326" y="194" font-size="15">layer 5 has 9 dots</text><rect x="300" y="214" width="18" height="18" fill="#8e44ad"/><text x="326" y="228" font-size="15">layer 6 has 11 dots</text><text x="40" y="270" font-size="14">Each new L-shaped layer adds the next odd number, so the first n odd numbers add up to n × n.</text></g></svg>