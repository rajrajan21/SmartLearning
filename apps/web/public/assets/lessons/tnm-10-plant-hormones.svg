<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 578 240" width="100%" role="img"><rect width="578" height="240" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="289.0" y="24" text-anchor="middle" font-weight="bold">Five plant hormones</text><rect x="20" y="40" width="120" height="30" fill="#d6eaf8" stroke="#555"/><text x="26" y="60" font-size="13" font-weight="bold">Hormone</text><rect x="140" y="40" width="210" height="30" fill="#d6eaf8" stroke="#555"/><text x="146" y="60" font-size="13" font-weight="bold">Main role</text><rect x="350" y="40" width="230" height="30" fill="#d6eaf8" stroke="#555"/><text x="356" y="60" font-size="13" font-weight="bold">Other effects</text><rect x="20" y="70" width="120" height="30" fill="#f4f6f7" stroke="#555"/><text x="26" y="90" font-size="12">Auxin</text><rect x="140" y="70" width="210" height="30" fill="#f4f6f7" stroke="#555"/><text x="146" y="90" font-size="12">promotes stem elongation</text><rect x="350" y="70" width="230" height="30" fill="#f4f6f7" stroke="#555"/><text x="356" y="90" font-size="12">apical dominance, seedless fruit</text><rect x="20" y="100" width="120" height="30" fill="#fdfefe" stroke="#555"/><text x="26" y="120" font-size="12">Cytokinin</text><rect x="140" y="100" width="210" height="30" fill="#fdfefe" stroke="#555"/><text x="146" y="120" font-size="12">promotes cell division</text><rect x="350" y="100" width="230" height="30" fill="#fdfefe" stroke="#555"/><text x="356" y="120" font-size="12">delays ageing, lateral buds</text><rect x="20" y="130" width="120" height="30" fill="#f4f6f7" stroke="#555"/><text x="26" y="150" font-size="12">Gibberellin</text><rect x="140" y="130" width="210" height="30" fill="#f4f6f7" stroke="#555"/><text x="146" y="150" font-size="12">internode elongation</text><rect x="350" y="130" width="230" height="30" fill="#f4f6f7" stroke="#555"/><text x="356" y="150" font-size="12">bolting, breaks dormancy</text><rect x="20" y="160" width="120" height="30" fill="#fdfefe" stroke="#555"/><text x="26" y="180" font-size="12">Abscisic acid</text><rect x="140" y="160" width="210" height="30" fill="#fdfefe" stroke="#555"/><text x="146" y="180" font-size="12">growth inhibitor (stress)</text><rect x="350" y="160" width="230" height="30" fill="#fdfefe" stroke="#555"/><text x="356" y="180" font-size="12">abscission, stomatal closure</text><rect x="20" y="190" width="120" height="30" fill="#f4f6f7" stroke="#555"/><text x="26" y="210" font-size="12">Ethylene</text><rect x="140" y="190" width="210" height="30" fill="#f4f6f7" stroke="#555"/><text x="146" y="210" font-size="12">gas; ripens fruits</text><rect x="350" y="190" width="230" height="30" fill="#f4f6f7" stroke="#555"/><text x="356" y="210" font-size="12">senescence, abscission zone</text></g></svg>