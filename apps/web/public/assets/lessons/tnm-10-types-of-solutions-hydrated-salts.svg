<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" width="100%" role="img"><rect width="560" height="270" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280.0" y="24" text-anchor="middle" font-weight="bold">Types of binary solutions (solute in solvent)</text><rect x="10" y="40" width="265" height="52" rx="8" fill="#d5f5e3" stroke="#333"/><text x="142.5" y="62" text-anchor="middle" font-size="12" font-weight="bold">Solid in solid</text><text x="142.5" y="79" text-anchor="middle" font-size="12">copper in gold (alloy)</text><rect x="285" y="40" width="265" height="52" rx="8" fill="#d6eaf8" stroke="#333"/><text x="417.5" y="62" text-anchor="middle" font-size="12" font-weight="bold">Liquid in solid</text><text x="417.5" y="79" text-anchor="middle" font-size="12">mercury in sodium (amalgam)</text><rect x="10" y="100" width="265" height="52" rx="8" fill="#fcf3cf" stroke="#333"/><text x="142.5" y="122" text-anchor="middle" font-size="12" font-weight="bold">Solid in liquid</text><text x="142.5" y="139" text-anchor="middle" font-size="12">salt in water</text><rect x="285" y="100" width="265" height="52" rx="8" fill="#fadbd8" stroke="#333"/><text x="417.5" y="122" text-anchor="middle" font-size="12" font-weight="bold">Liquid in liquid</text><text x="417.5" y="139" text-anchor="middle" font-size="12">alcohol in water</text><rect x="10" y="160" width="265" height="52" rx="8" fill="#e8daef" stroke="#333"/><text x="142.5" y="182" text-anchor="middle" font-size="12" font-weight="bold">Gas in liquid</text><text x="142.5" y="199" text-anchor="middle" font-size="12">carbon dioxide in water (soda)</text><rect x="285" y="160" width="265" height="52" rx="8" fill="#d4efdf" stroke="#333"/><text x="417.5" y="182" text-anchor="middle" font-size="12" font-weight="bold">Gas in gas</text><text x="417.5" y="199" text-anchor="middle" font-size="12">helium-oxygen mixture, air</text><text x="280" y="236" text-anchor="middle" font-size="13">Aqueous: water is the solvent. Non-aqueous: sulphur in carbon disulphide</text><text x="280" y="258" text-anchor="middle" font-size="12">Blue CuSO4.5H2O + heat gives colourless CuSO4 + 5 H2O</text></g></svg>