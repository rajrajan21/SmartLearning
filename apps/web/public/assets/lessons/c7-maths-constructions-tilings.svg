<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" width="100%" role="img"><rect width="700" height="290" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="20" y="24" font-weight="bold">Perpendicular bisector with ruler and compass</text><line x1="40" y1="150" x2="260" y2="150" stroke="#333" stroke-width="3"/><text x="28" y="172">X</text><text x="262" y="172">Y</text><path d="M 150 60 A 130 130 0 0 1 250 150" fill="none" stroke="#1f618d" stroke-dasharray="4 3"/><path d="M 150 240 A 130 130 0 0 0 250 150" fill="none" stroke="#1f618d" stroke-dasharray="4 3"/><line x1="150" y1="50" x2="150" y2="250" stroke="#c0392b" stroke-width="2"/><text x="156" y="48" fill="#c0392b">A</text><text x="156" y="262" fill="#c0392b">B</text><text x="156" y="144" font-size="14">O</text><text x="30" y="276" font-size="13">XA = YA = XB = YB, so AB is the perpendicular bisector of XY</text><polygon points="550,150 525,107 475,107 450,150 475,193 525,193" fill="#d6eaf8" stroke="#1f618d" stroke-width="2"/><line x1="550" y1="150" x2="450" y2="150" stroke="#1f618d"/><line x1="525" y1="107" x2="475" y2="193" stroke="#1f618d"/><line x1="475" y1="107" x2="525" y2="193" stroke="#1f618d"/><text x="410" y="40" font-weight="bold" font-size="15">Regular hexagon = 6 equilateral triangles</text><text x="420" y="222" font-size="14">6 × 60 degrees = 360 degrees at the centre</text><text x="420" y="246" font-size="14">Tilings: triangles, squares, hexagons tile the plane</text><text x="420" y="270" font-size="14">(no gaps, no overlaps)</text></g></svg>