<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" width="100%" role="img"><rect width="560" height="270" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="22" text-anchor="middle" font-weight="bold">Types of farming in India</text><rect x="10" y="42" width="175" height="80" rx="8" fill="#fadbd8" stroke="#333"/><text x="97.5" y="64" text-anchor="middle" font-size="12" font-weight="bold">Subsistence</text><text x="97.5" y="81" text-anchor="middle" font-size="12">family labour, low yield</text><rect x="192" y="42" width="175" height="80" rx="8" fill="#fdebd0" stroke="#333"/><text x="279.5" y="64" text-anchor="middle" font-size="12" font-weight="bold">Shifting</text><text x="279.5" y="81" text-anchor="middle" font-size="12">slash and burn: Jhum, Podu</text><rect x="375" y="42" width="175" height="80" rx="8" fill="#fcf3cf" stroke="#333"/><text x="462.5" y="64" text-anchor="middle" font-size="12" font-weight="bold">Intensive</text><text x="462.5" y="81" text-anchor="middle" font-size="12">heavy fertilizer, high yield</text><rect x="10" y="135" width="175" height="80" rx="8" fill="#d5f5e3" stroke="#333"/><text x="97.5" y="157" text-anchor="middle" font-size="12" font-weight="bold">Dry farming</text><text x="97.5" y="174" text-anchor="middle" font-size="12">arid areas, one crop</text><rect x="192" y="135" width="175" height="80" rx="8" fill="#d6eaf8" stroke="#333"/><text x="279.5" y="157" text-anchor="middle" font-size="12" font-weight="bold">Mixed farming</text><text x="279.5" y="174" text-anchor="middle" font-size="12">crops plus livestock</text><rect x="375" y="135" width="175" height="80" rx="8" fill="#ebdef0" stroke="#333"/><text x="462.5" y="157" text-anchor="middle" font-size="12" font-weight="bold">Terrace farming</text><text x="462.5" y="174" text-anchor="middle" font-size="12">hill slopes, less erosion</text><text x="280" y="245" text-anchor="middle" font-size="13">Seasons: Kharif Jun-Sep, Rabi Oct-Mar, Zaid Apr-Jun</text></g></svg>