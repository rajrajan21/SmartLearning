<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="100%" role="img"><rect width="720" height="270" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="360" y="26" text-anchor="middle" font-size="18" font-weight="bold">Making recycled paper</text><rect x="20" y="70" width="122" height="120" rx="12" fill="#fde7b0" stroke="#222" stroke-width="2"/><text x="81" y="115" text-anchor="middle" font-weight="bold">1. Tear</text><text x="81" y="145" text-anchor="middle" font-size="13">old newspaper</text><text x="150" y="135" text-anchor="middle" font-size="22">→</text><rect x="158" y="70" width="122" height="120" rx="12" fill="#d4ecf7" stroke="#222" stroke-width="2"/><text x="219" y="115" text-anchor="middle" font-weight="bold">2. Soak</text><text x="219" y="145" text-anchor="middle" font-size="13">in water with methi seeds</text><text x="288" y="135" text-anchor="middle" font-size="22">→</text><rect x="296" y="70" width="122" height="120" rx="12" fill="#e8d5f2" stroke="#222" stroke-width="2"/><text x="357" y="115" text-anchor="middle" font-weight="bold">3. Mash</text><text x="357" y="145" text-anchor="middle" font-size="13">into wet pulp</text><text x="426" y="135" text-anchor="middle" font-size="22">→</text><rect x="434" y="70" width="122" height="120" rx="12" fill="#d4efd0" stroke="#222" stroke-width="2"/><text x="495" y="115" text-anchor="middle" font-weight="bold">4. Roll</text><text x="495" y="145" text-anchor="middle" font-size="13">into thin sheets</text><text x="564" y="135" text-anchor="middle" font-size="22">→</text><rect x="572" y="70" width="122" height="120" rx="12" fill="#f6c8d0" stroke="#222" stroke-width="2"/><text x="633" y="115" text-anchor="middle" font-weight="bold">5. Dry</text><text x="633" y="145" text-anchor="middle" font-size="13">paper is ready!</text><text x="360" y="240" text-anchor="middle" font-size="15" fill="#555">Methi (fenugreek) seeds help the pulp stick together.</text></g></svg>