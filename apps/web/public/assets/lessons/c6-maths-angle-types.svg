<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 285" width="100%" role="img"><rect width="600" height="285" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="20" y="26" font-weight="bold">Types of angles by their degree measure</text><line x1="70" y1="150" x2="125" y2="150" stroke="#222" stroke-width="3"/><line x1="70" y1="150" x2="112.1" y2="114.6" stroke="#c0392b" stroke-width="3"/><path d="M 92 150 A 22 22 0 0 0 86.9 135.9" fill="none" stroke="#2980b9" stroke-width="2"/><text x="40" y="198" font-weight="bold">Acute</text><text x="40" y="218" font-size="13">less than 90°</text><line x1="185" y1="150" x2="240" y2="150" stroke="#222" stroke-width="3"/><line x1="185" y1="150" x2="185.0" y2="95.0" stroke="#c0392b" stroke-width="3"/><path d="M 207 150 A 22 22 0 0 0 185.0 128.0" fill="none" stroke="#2980b9" stroke-width="2"/><text x="155" y="198" font-weight="bold">Right</text><text x="155" y="218" font-size="13">exactly 90°</text><line x1="300" y1="150" x2="355" y2="150" stroke="#222" stroke-width="3"/><line x1="300" y1="150" x2="261.1" y2="111.1" stroke="#c0392b" stroke-width="3"/><path d="M 322 150 A 22 22 0 0 0 284.4 134.4" fill="none" stroke="#2980b9" stroke-width="2"/><text x="270" y="198" font-weight="bold">Obtuse</text><text x="270" y="218" font-size="13">90° to 180°</text><line x1="415" y1="150" x2="470" y2="150" stroke="#222" stroke-width="3"/><line x1="415" y1="150" x2="360.0" y2="150.0" stroke="#c0392b" stroke-width="3"/><path d="M 437 150 A 22 22 0 0 0 393.0 150.0" fill="none" stroke="#2980b9" stroke-width="2"/><text x="385" y="198" font-weight="bold">Straight</text><text x="385" y="218" font-size="13">exactly 180°</text><line x1="530" y1="150" x2="585" y2="150" stroke="#222" stroke-width="3"/><line x1="530" y1="150" x2="511.2" y2="201.7" stroke="#c0392b" stroke-width="3"/><path d="M 552 150 A 22 22 0 1 0 522.5 170.7" fill="none" stroke="#2980b9" stroke-width="2"/><text x="500" y="198" font-weight="bold">Reflex</text><text x="500" y="218" font-size="13">180° to 360°</text><text x="20" y="262" font-size="14">A full turn is 360°, a half turn (straight angle) is 180°, a quarter turn (right angle) is 90°.</text></g></svg>