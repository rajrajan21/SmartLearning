<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="100%" role="img"><rect width="520" height="320" fill="#ffffff"/><g font-family="sans-serif" font-size="15" fill="#222" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="130" cy="150" rx="100" ry="85" fill="#fdebd0" stroke="#333" stroke-width="2"/><circle cx="120" cy="150" r="26" fill="#d6eaf8" stroke="#2874a6" stroke-width="1.5"/><text x="112" y="155" font-size="11" fill="#2874a6" text-anchor="start">nucleus</text><text x="70" y="60" font-size="14" fill="#222" text-anchor="start">animal cell</text><text x="130" y="262" font-size="12" fill="#555" text-anchor="middle">cell membrane, cytoplasm, nucleus</text><text x="130" y="278" font-size="12" fill="#555" text-anchor="middle">(no cell wall, no chloroplasts)</text><rect x="300" y="70" width="200" height="160" fill="#e9f7ef" stroke="#1e8449" stroke-width="3"/><rect x="307" y="77" width="186" height="146" fill="none" stroke="#333" stroke-width="1.5"/><circle cx="360" cy="150" r="30" fill="#d6eaf8" stroke="#2874a6" stroke-width="1.5"/><text x="342" y="154" font-size="11" fill="#2874a6" text-anchor="start">nucleus</text><ellipse cx="450" cy="150" rx="28" ry="45" fill="#d5f5e3" stroke="#1e8449" stroke-width="1.5"/><text x="450" y="154" font-size="11" fill="#1e8449" text-anchor="middle">vacuole</text><circle cx="330" cy="90" r="8" fill="#82e0aa" stroke="#1e8449" stroke-width="1.5"/><circle cx="330" cy="205" r="8" fill="#82e0aa" stroke="#1e8449" stroke-width="1.5"/><text x="345" y="208" font-size="11" fill="#1e8449" text-anchor="start">chloroplast</text><text x="400" y="60" font-size="14" fill="#222" text-anchor="middle">plant cell</text><text x="400" y="262" font-size="12" fill="#555" text-anchor="middle">cell wall, membrane, nucleus, large vacuole,</text><text x="400" y="278" font-size="12" fill="#555" text-anchor="middle">chloroplasts</text></g></svg>