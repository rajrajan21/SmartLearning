<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" width="100%" role="img"><rect width="620" height="250" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="310" y="22" text-anchor="middle" font-weight="bold">Ethanol, ethanoic acid and soap</text><text x="20" y="55" font-size="14" font-weight="bold">Ethanol C2H5OH</text><text x="20" y="77" font-size="13">+ Na gives sodium ethoxide + H2</text><text x="20" y="97" font-size="13">+ conc H2SO4 (443 K) gives ethene</text><text x="20" y="117" font-size="13">burns to give CO2 + H2O</text><text x="260" y="55" font-size="14" font-weight="bold">Ethanoic acid CH3COOH</text><text x="260" y="77" font-size="13">+ metal gives salt + H2</text><text x="260" y="97" font-size="13">+ carbonate gives salt + CO2 + H2O</text><text x="260" y="117" font-size="13">+ NaOH gives salt + water</text><text x="20" y="165" font-size="14" font-weight="bold">Soap = fat + alkali (saponification)</text><text x="20" y="187" font-size="13">NaOH gives hard soap (washing)</text><text x="20" y="207" font-size="13">KOH gives soft soap (body)</text><text x="330" y="187" font-size="13">Detergent: works in hard water</text><text x="330" y="207" font-size="13">(salts of sulphonic acids)</text></g></svg>