<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="100%" role="img"><rect width="720" height="230" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><rect width="720" height="230" fill="#fbf6ea"/><rect x="20" y="50" width="160" height="130" rx="14" fill="#f4c7d0" stroke="#8a6d3b" stroke-width="2"/><text x="100" y="80" text-anchor="middle" font-size="17" font-weight="bold">1. Collect</text><text x="100" y="108" text-anchor="middle" font-size="12">flowers, leaves, bark,</text><text x="100" y="126" text-anchor="middle" font-size="12">roots: beetroot, hibiscus,</text><text x="100" y="144" text-anchor="middle" font-size="12">marigold</text><polygon points="183,115 195,115 189,108" fill="#8a6d3b" opacity="0"/><text x="187" y="120" font-size="22" text-anchor="middle">→</text><rect x="195" y="50" width="160" height="130" rx="14" fill="#f7d8a8" stroke="#8a6d3b" stroke-width="2"/><text x="275" y="80" text-anchor="middle" font-size="17" font-weight="bold">2. Boil</text><text x="275" y="108" text-anchor="middle" font-size="12">in 1 to 2 litres of water</text><text x="275" y="126" text-anchor="middle" font-size="12">for 30 to 60 minutes,</text><text x="275" y="144" text-anchor="middle" font-size="12">cover with a plate</text><polygon points="358,115 370,115 364,108" fill="#8a6d3b" opacity="0"/><text x="362" y="120" font-size="22" text-anchor="middle">→</text><rect x="370" y="50" width="160" height="130" rx="14" fill="#d9e8b5" stroke="#8a6d3b" stroke-width="2"/><text x="450" y="80" text-anchor="middle" font-size="17" font-weight="bold">3. Strain</text><text x="450" y="108" text-anchor="middle" font-size="12">remove the plant parts,</text><text x="450" y="126" text-anchor="middle" font-size="12">keep the coloured liquid</text><text x="450" y="144" text-anchor="middle" font-size="12">= the natural dye</text><polygon points="533,115 545,115 539,108" fill="#8a6d3b" opacity="0"/><text x="537" y="120" font-size="22" text-anchor="middle">→</text><rect x="545" y="50" width="160" height="130" rx="14" fill="#c9def2" stroke="#8a6d3b" stroke-width="2"/><text x="625" y="80" text-anchor="middle" font-size="17" font-weight="bold">4. Dye</text><text x="625" y="108" text-anchor="middle" font-size="12">soak a light cloth</text><text x="625" y="126" text-anchor="middle" font-size="12">overnight, squeeze,</text><text x="625" y="144" text-anchor="middle" font-size="12">dry next morning</text><text x="360" y="28" text-anchor="middle" font-size="18" font-weight="bold">Making a natural dye (ask an elder to help)</text></g></svg>