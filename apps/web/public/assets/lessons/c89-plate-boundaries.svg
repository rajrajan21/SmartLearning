<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 238" width="100%" role="img"><rect width="520" height="238" fill="#ffffff"/><g font-family="sans-serif" font-size="13" fill="#222" stroke-linecap="round" stroke-linejoin="round"><text x="260" y="22" font-size="15" fill="#2874a6" text-anchor="middle" font-weight="bold">What plates do at their boundaries</text><rect x="40" y="66" width="55" height="36" rx="0" fill="#e59866" stroke="#a04000" stroke-width="1.5"/><rect x="105" y="66" width="55" height="36" rx="0" fill="#e59866" stroke="#a04000" stroke-width="1.5"/><line x1="36" y1="84" x2="24.0" y2="84.0" stroke="#c0392b" stroke-width="2.5"/><polygon points="20,84 28.3,80.5 28.3,87.5" fill="#c0392b"/><line x1="164" y1="84" x2="176.0" y2="84.0" stroke="#c0392b" stroke-width="2.5"/><polygon points="180,84 171.7,87.5 171.7,80.5" fill="#c0392b"/><rect x="215" y="66" width="55" height="36" rx="0" fill="#e59866" stroke="#a04000" stroke-width="1.5"/><rect x="280" y="66" width="55" height="36" rx="0" fill="#e59866" stroke="#a04000" stroke-width="1.5"/><line x1="195" y1="84" x2="207.0" y2="84.0" stroke="#c0392b" stroke-width="2.5"/><polygon points="211,84 202.7,87.5 202.7,80.5" fill="#c0392b"/><line x1="355" y1="84" x2="343.0" y2="84.0" stroke="#c0392b" stroke-width="2.5"/><polygon points="339,84 347.3,80.5 347.3,87.5" fill="#c0392b"/><rect x="390" y="56" width="55" height="36" rx="0" fill="#e59866" stroke="#a04000" stroke-width="1.5"/><rect x="455" y="76" width="55" height="36" rx="0" fill="#e59866" stroke="#a04000" stroke-width="1.5"/><line x1="417" y1="50" x2="417.0" y2="40.0" stroke="#c0392b" stroke-width="2.5"/><polygon points="417,36 420.5,44.3 413.5,44.3" fill="#c0392b"/><line x1="482" y1="118" x2="482.0" y2="128.0" stroke="#c0392b" stroke-width="2.5"/><polygon points="482,132 478.5,123.7 485.5,123.7" fill="#c0392b"/><text x="100" y="160" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">Move apart</text><text x="275" y="160" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">Collide</text><text x="450" y="160" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">Slide past</text><text x="260" y="200" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">These movements cause earthquakes, volcanoes and mountain building.</text><text x="260" y="222" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">Plates are pieces of the lithosphere moving slowly over the softer layer below.</text></g></svg>