<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" width="100%" role="img"><rect width="760" height="180" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="380" y="24" text-anchor="middle" font-size="18" font-weight="bold">Symmetrical and not symmetrical malas</text><circle cx="60" cy="70" r="17" fill="#e63946" stroke="#333" stroke-width="2"/><circle cx="106" cy="70" r="17" fill="#e63946" stroke="#333" stroke-width="2"/><circle cx="152" cy="70" r="17" fill="#1d6fb8" stroke="#333" stroke-width="2"/><circle cx="198" cy="70" r="17" fill="#1d6fb8" stroke="#333" stroke-width="2"/><circle cx="244" cy="70" r="17" fill="#1d6fb8" stroke="#333" stroke-width="2"/><circle cx="290" cy="70" r="17" fill="#1d6fb8" stroke="#333" stroke-width="2"/><circle cx="336" cy="70" r="17" fill="#e63946" stroke="#333" stroke-width="2"/><circle cx="382" cy="70" r="17" fill="#e63946" stroke="#333" stroke-width="2"/><line x1="237" y1="40" x2="237" y2="100" stroke="#2a9d8f" stroke-width="3" stroke-dasharray="6 4"/><text x="420" y="75" font-size="15">same on both sides: symmetrical</text><circle cx="60" cy="140" r="17" fill="#e63946" stroke="#333" stroke-width="2"/><circle cx="106" cy="140" r="17" fill="#1d6fb8" stroke="#333" stroke-width="2"/><circle cx="152" cy="140" r="17" fill="#1d6fb8" stroke="#333" stroke-width="2"/><circle cx="198" cy="140" r="17" fill="#e63946" stroke="#333" stroke-width="2"/><circle cx="244" cy="140" r="17" fill="#e63946" stroke="#333" stroke-width="2"/><circle cx="290" cy="140" r="17" fill="#1d6fb8" stroke="#333" stroke-width="2"/><circle cx="336" cy="140" r="17" fill="#e63946" stroke="#333" stroke-width="2"/><circle cx="382" cy="140" r="17" fill="#e63946" stroke="#333" stroke-width="2"/><text x="420" y="145" font-size="15">two halves differ: not symmetrical</text></g></svg>