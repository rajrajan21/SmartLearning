<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 290" width="100%" role="img"><rect width="560" height="290" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#333"/></marker></defs><text x="280.0" y="24" text-anchor="middle" font-weight="bold">Hydrocarbons and functional groups</text><rect x="200" y="36" width="160" height="34" rx="8" fill="#fcf3cf" stroke="#333"/><text x="280.0" y="58" text-anchor="middle" font-size="12" font-weight="bold">Hydrocarbons (C and H only)</text><rect x="10" y="110" width="170" height="72" rx="8" fill="#d5f5e3" stroke="#333"/><text x="95.0" y="132" text-anchor="middle" font-size="12" font-weight="bold">Alkanes</text><text x="95.0" y="149" text-anchor="middle" font-size="12">CnH2n+2, C-C single</text><text x="95.0" y="166" text-anchor="middle" font-size="12">CH4, C2H6, C3H8</text><text x="95.0" y="183" text-anchor="middle" font-size="12">saturated</text><rect x="195" y="110" width="170" height="72" rx="8" fill="#fadbd8" stroke="#333"/><text x="280.0" y="132" text-anchor="middle" font-size="12" font-weight="bold">Alkenes</text><text x="280.0" y="149" text-anchor="middle" font-size="12">CnH2n, C=C double</text><text x="280.0" y="166" text-anchor="middle" font-size="12">C2H4, C3H6, C4H8</text><text x="280.0" y="183" text-anchor="middle" font-size="12">unsaturated</text><rect x="380" y="110" width="170" height="72" rx="8" fill="#d6eaf8" stroke="#333"/><text x="465.0" y="132" text-anchor="middle" font-size="12" font-weight="bold">Alkynes</text><text x="465.0" y="149" text-anchor="middle" font-size="12">CnH2n-2, C triple C</text><text x="465.0" y="166" text-anchor="middle" font-size="12">C2H2, C3H4, C4H6</text><text x="465.0" y="183" text-anchor="middle" font-size="12">unsaturated</text><line x1="250" y1="70" x2="95" y2="108" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><line x1="280" y1="70" x2="280" y2="108" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><line x1="310" y1="70" x2="465" y2="108" stroke="#333" stroke-width="2" marker-end="url(#ah)"/><text x="280" y="212" text-anchor="middle" font-size="13">Functional groups: -OH alcohol, -CHO aldehyde, C=O ketone</text><text x="280" y="234" text-anchor="middle" font-size="13">-COOH carboxylic acid, -COOR ester, -O- ether</text><text x="280" y="262" text-anchor="middle" font-size="12">Bromine water test: unsaturated compounds decolourise it, alkanes do not</text></g></svg>