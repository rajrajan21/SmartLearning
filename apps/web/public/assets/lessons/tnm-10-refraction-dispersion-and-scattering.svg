<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="100%" role="img"><rect width="600" height="260" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="300" y="22" text-anchor="middle" font-weight="bold">Refraction, dispersion and scattering</text><rect x="20" y="130" width="260" height="110" fill="#d6eaf8" stroke="#333"/><text x="30" y="228" font-size="13">Denser medium (glass)</text><text x="30" y="150" font-size="13" fill="#555">Rarer medium (air) above</text><line x1="150" y1="40" x2="150" y2="240" stroke="#999" stroke-dasharray="5,4"/><text x="156" y="48" font-size="12">normal</text><line x1="60" y1="45" x2="150" y2="130" stroke="#c0392b" stroke-width="3"/><line x1="150" y1="130" x2="190" y2="235" stroke="#1f618d" stroke-width="3"/><text x="92" y="105" font-size="13">i</text><text x="160" y="190" font-size="13">r</text><text x="150" y="256" font-size="12" text-anchor="middle">sin i / sin r = n2 / n1</text><polygon points="340,200 400,100 460,200" fill="#eaf2f8" stroke="#333"/><line x1="300" y1="150" x2="365" y2="150" stroke="#444" stroke-width="3"/><line x1="420" y1="165" x2="560" y2="200" stroke="#8e44ad" stroke-width="2"/><line x1="420" y1="165" x2="560" y2="180" stroke="#2980b9" stroke-width="2"/><line x1="420" y1="165" x2="560" y2="160" stroke="#27ae60" stroke-width="2"/><line x1="420" y1="165" x2="560" y2="140" stroke="#f1c40f" stroke-width="2"/><line x1="420" y1="165" x2="560" y2="120" stroke="#e74c3c" stroke-width="2"/><text x="565" y="203" font-size="12">Violet</text><text x="565" y="123" font-size="12">Red</text><text x="400" y="228" text-anchor="middle" font-size="13">Prism: white light splits</text></g></svg>