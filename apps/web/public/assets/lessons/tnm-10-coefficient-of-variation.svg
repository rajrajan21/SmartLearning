<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" width="100%" role="img"><rect width="560" height="240" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="22" text-anchor="middle" font-weight="bold">Coefficient of variation compares consistency</text><rect x="20" y="45" width="250" height="110" rx="10" fill="#d6eaf8" stroke="#333"/><text x="145" y="72" text-anchor="middle" font-size="14" font-weight="bold">C.V. = (SD / mean) x 100 %</text><text x="145" y="98" text-anchor="middle" font-size="12">no units, so any two data sets can be compared</text><text x="145" y="120" text-anchor="middle" font-size="12">SD of 1.5 kg versus SD of Rs 21.60:</text><text x="145" y="138" text-anchor="middle" font-size="12">compare their C.V.</text><rect x="290" y="45" width="250" height="110" rx="10" fill="#d5f5e3" stroke="#333"/><text x="415" y="72" text-anchor="middle" font-size="14" font-weight="bold">Smaller C.V. = more consistent</text><text x="415" y="98" text-anchor="middle" font-size="12">Heights: 5.48 %</text><text x="415" y="118" text-anchor="middle" font-size="12">Weights: 11.40 %</text><text x="415" y="138" text-anchor="middle" font-size="12">Heights are more consistent</text><text x="280" y="195" text-anchor="middle" font-size="13">Idea suggested by Karl Pearson</text></g></svg>