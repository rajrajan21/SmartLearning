<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 262" width="100%" role="img"><rect width="560" height="262" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="20" y="26" font-weight="bold">Matchstick Ls: matchsticks = 2 x n (written 2n)</text><line x1="30" y1="48" x2="30" y2="88" stroke="#b9770e" stroke-width="5"/><line x1="30" y1="88" x2="46" y2="88" stroke="#b9770e" stroke-width="5"/><text x="30" y="120" font-size="15">n = 1: 2n = 2</text><line x1="155" y1="48" x2="155" y2="88" stroke="#b9770e" stroke-width="5"/><line x1="155" y1="88" x2="171" y2="88" stroke="#b9770e" stroke-width="5"/><line x1="181" y1="48" x2="181" y2="88" stroke="#b9770e" stroke-width="5"/><line x1="181" y1="88" x2="197" y2="88" stroke="#b9770e" stroke-width="5"/><text x="155" y="120" font-size="15">n = 2: 2n = 4</text><line x1="280" y1="48" x2="280" y2="88" stroke="#b9770e" stroke-width="5"/><line x1="280" y1="88" x2="296" y2="88" stroke="#b9770e" stroke-width="5"/><line x1="306" y1="48" x2="306" y2="88" stroke="#b9770e" stroke-width="5"/><line x1="306" y1="88" x2="322" y2="88" stroke="#b9770e" stroke-width="5"/><line x1="332" y1="48" x2="332" y2="88" stroke="#b9770e" stroke-width="5"/><line x1="332" y1="88" x2="348" y2="88" stroke="#b9770e" stroke-width="5"/><text x="280" y="120" font-size="15">n = 3: 2n = 6</text><line x1="405" y1="48" x2="405" y2="88" stroke="#b9770e" stroke-width="5"/><line x1="405" y1="88" x2="421" y2="88" stroke="#b9770e" stroke-width="5"/><line x1="431" y1="48" x2="431" y2="88" stroke="#b9770e" stroke-width="5"/><line x1="431" y1="88" x2="447" y2="88" stroke="#b9770e" stroke-width="5"/><line x1="457" y1="48" x2="457" y2="88" stroke="#b9770e" stroke-width="5"/><line x1="457" y1="88" x2="473" y2="88" stroke="#b9770e" stroke-width="5"/><line x1="483" y1="48" x2="483" y2="88" stroke="#b9770e" stroke-width="5"/><line x1="483" y1="88" x2="499" y2="88" stroke="#b9770e" stroke-width="5"/><text x="405" y="120" font-size="15">n = 4: 2n = 8</text><text x="30" y="160" font-weight="bold">Letter-numbers stand for numbers that can change</text><text x="30" y="188" font-size="16">Aftab is a years old: Shabnam is a + 3     (a = 23 gives 26)</text><text x="30" y="214" font-size="16">Coconuts c at 35 rupees, jaggery j kg at 60: total 35c + 60j</text><text x="30" y="240" font-size="16">l + b + l + b = 2l + 2b  (same value, simpler form)    5c + 3c + 10c = 18c</text></g></svg>