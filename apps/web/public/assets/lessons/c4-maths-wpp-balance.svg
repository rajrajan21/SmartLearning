<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="100%" role="img"><rect width="720" height="250" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><rect width="720" height="250" fill="#f6fbff"/><rect x="355" y="60" width="10" height="150" fill="#6b4a2f"/><rect x="300" y="205" width="120" height="12" fill="#6b4a2f"/><rect x="90" y="60" width="540" height="8" fill="#444"/><path d="M90 68 L60 150 L160 150 Z" fill="none" stroke="#444" stroke-width="3"/><path d="M630 68 L600 150 L700 150 Z" fill="none" stroke="#444" stroke-width="3"/><rect x="45" y="150" width="130" height="10" fill="#8a8a8a"/><rect x="585" y="150" width="130" height="10" fill="#8a8a8a"/><rect x="75" y="105" width="70" height="45" fill="#f6b73c" stroke="#a36b00" stroke-width="2"/><text x="110" y="134" text-anchor="middle" font-weight="bold">500 g</text><rect x="590" y="110" width="55" height="40" fill="#8fc77a" stroke="#3a7d2b" stroke-width="2"/><text x="617" y="135" text-anchor="middle" font-weight="bold">250 g</text><rect x="650" y="110" width="55" height="40" fill="#8fc77a" stroke="#3a7d2b" stroke-width="2"/><text x="677" y="135" text-anchor="middle" font-weight="bold">250 g</text><text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold">The pans balance: 500 g = 250 g + 250 g</text><text x="360" y="240" text-anchor="middle" font-size="14">1 kg = 1000 g, so 500 g is half a kilogram and 250 g is a quarter of a kilogram</text></g></svg>