<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" width="100%" role="img"><rect width="560" height="230" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="22" text-anchor="middle" font-weight="bold">Roots and coefficients of ax^2 + bx + c = 0</text><rect x="30" y="45" width="230" height="70" rx="10" fill="#d6eaf8" stroke="#333"/><text x="145" y="75" text-anchor="middle" font-size="15">Sum: alpha + beta = -b / a</text><text x="145" y="98" text-anchor="middle" font-size="12">coefficient of x with sign changed</text><rect x="300" y="45" width="230" height="70" rx="10" fill="#d5f5e3" stroke="#333"/><text x="415" y="75" text-anchor="middle" font-size="15">Product: alpha beta = c / a</text><text x="415" y="98" text-anchor="middle" font-size="12">constant term over coefficient of x^2</text><rect x="30" y="135" width="500" height="70" rx="10" fill="#fcf3cf" stroke="#333"/><text x="280" y="165" text-anchor="middle" font-size="14">Equation with roots alpha, beta:  x^2 - (alpha + beta) x + alpha beta = 0</text><text x="280" y="188" text-anchor="middle" font-size="13">alpha^2 + beta^2 = (alpha + beta)^2 - 2 alpha beta</text></g></svg>