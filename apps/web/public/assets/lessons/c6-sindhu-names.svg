<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="100%" role="img"><rect width="760" height="230" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="380" y="26" text-anchor="middle" font-size="18" font-weight="bold">One river, many names for India</text>
<rect x="300" y="42" width="160" height="40" rx="8" fill="#cfe8ff" stroke="#246"/><text x="380" y="68" text-anchor="middle" font-size="16">Sindhu (Indus)</text>
<g stroke="#555" stroke-width="2" fill="none"><path d="M330 82 L120 130"/><path d="M360 82 L300 130"/><path d="M400 82 L470 130"/><path d="M430 82 L640 130"/></g>
<g font-size="14" text-anchor="middle"><rect x="40" y="130" width="160" height="56" rx="8" fill="#fff4cc" stroke="#962"/><text x="120" y="154">Persian</text><text x="120" y="174">Hind / Hidu / Hindu</text>
<rect x="220" y="130" width="160" height="56" rx="8" fill="#fff4cc" stroke="#962"/><text x="300" y="154">Greek</text><text x="300" y="174">Indoi / Indike</text>
<rect x="400" y="130" width="140" height="56" rx="8" fill="#fff4cc" stroke="#962"/><text x="470" y="154">Chinese</text><text x="470" y="174">Yintu / Yindu</text>
<rect x="560" y="130" width="160" height="56" rx="8" fill="#fff4cc" stroke="#962"/><text x="640" y="154">Later English</text><text x="640" y="174">India</text></g>
<text x="380" y="215" text-anchor="middle" font-size="13">Indian names such as Sapta Sindhava, Jambudvipa and Bharata come from Indian texts</text></g></svg>