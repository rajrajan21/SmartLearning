<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" width="100%" role="img"><rect width="560" height="280" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#333"/></marker></defs><text x="280.0" y="24" text-anchor="middle" font-weight="bold">Lens formula, magnification and power</text><rect x="20" y="50" width="250" height="60" rx="8" fill="#fcf3cf" stroke="#333"/><text x="145.0" y="72" text-anchor="middle" font-size="15" font-weight="bold">Lens formula</text><text x="145.0" y="92" text-anchor="middle" font-size="15">1/f = 1/v - 1/u</text><rect x="290" y="50" width="250" height="60" rx="8" fill="#d5f5e3" stroke="#333"/><text x="415.0" y="72" text-anchor="middle" font-size="12" font-weight="bold">Magnification m = h'/h = v/u</text><text x="415.0" y="89" text-anchor="middle" font-size="12">m > 1 enlarged, m < 1 diminished</text><rect x="20" y="135" width="250" height="60" rx="8" fill="#d6eaf8" stroke="#333"/><text x="145.0" y="157" text-anchor="middle" font-size="12" font-weight="bold">Power P = 1/f (f in metre)</text><text x="145.0" y="174" text-anchor="middle" font-size="12">unit dioptre D, 1 D = 1 per metre</text><rect x="290" y="135" width="250" height="60" rx="8" fill="#fadbd8" stroke="#333"/><text x="415.0" y="157" text-anchor="middle" font-size="12" font-weight="bold">Lens maker: 1/f = (mu-1)(1/R1 - 1/R2)</text><text x="415.0" y="174" text-anchor="middle" font-size="12">thin lenses only</text><text x="280" y="225" text-anchor="middle" font-size="13">Convex lens: f and P positive. Concave lens: f and P negative.</text><text x="280" y="250" text-anchor="middle" font-size="13">Object on left; distances along the incident light are positive.</text></g></svg>