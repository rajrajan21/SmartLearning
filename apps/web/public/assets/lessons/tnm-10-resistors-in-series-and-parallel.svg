<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 270" width="100%" role="img"><rect width="620" height="270" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="310" y="22" text-anchor="middle" font-weight="bold">Resistors in series and in parallel</text><text x="20" y="55" font-size="14" font-weight="bold">Series: same current</text><line x1="20" y1="90" x2="60" y2="90" stroke="#333"/><rect x="60" y="81" width="46" height="18" fill="#fdebd0" stroke="#333"/><text x="83" y="94" text-anchor="middle" font-size="12">R1</text><line x1="106" y1="90" x2="130" y2="90" stroke="#333"/><rect x="130" y="81" width="46" height="18" fill="#fdebd0" stroke="#333"/><text x="153" y="94" text-anchor="middle" font-size="12">R2</text><line x1="176" y1="90" x2="200" y2="90" stroke="#333"/><rect x="200" y="81" width="46" height="18" fill="#fdebd0" stroke="#333"/><text x="223" y="94" text-anchor="middle" font-size="12">R3</text><line x1="246" y1="90" x2="280" y2="90" stroke="#333"/><text x="20" y="130" font-size="14">Rs = R1 + R2 + R3</text><text x="20" y="152" font-size="13">Rs is more than the largest R</text><text x="20" y="174" font-size="13">If one fails, all stop</text><text x="330" y="55" font-size="14" font-weight="bold">Parallel: same voltage</text><line x1="340" y1="100" x2="380" y2="100" stroke="#333"/><line x1="380" y1="75" x2="380" y2="145" stroke="#333"/><line x1="380" y1="75" x2="410" y2="75" stroke="#333"/><rect x="410" y="66" width="46" height="18" fill="#fdebd0" stroke="#333"/><text x="433" y="79" text-anchor="middle" font-size="12">R1</text><line x1="456" y1="75" x2="486" y2="75" stroke="#333"/><line x1="380" y1="145" x2="410" y2="145" stroke="#333"/><rect x="410" y="136" width="46" height="18" fill="#fdebd0" stroke="#333"/><text x="433" y="149" text-anchor="middle" font-size="12">R2</text><line x1="456" y1="145" x2="486" y2="145" stroke="#333"/><line x1="486" y1="75" x2="486" y2="145" stroke="#333"/><line x1="486" y1="100" x2="520" y2="100" stroke="#333"/><text x="330" y="180" font-size="14">1/Rp = 1/R1 + 1/R2</text><text x="330" y="202" font-size="13">Rp is less than the smallest R</text><text x="330" y="224" font-size="13">If one fails, others work (house wiring)</text><text x="20" y="250" font-size="13">Resistivity: rho = R A / L (unit ohm metre); conductance G = 1 / R</text></g></svg>