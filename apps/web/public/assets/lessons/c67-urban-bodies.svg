<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs><rect width="900" height="330" fill="#ffffff"/><text x="450.0" y="30" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#0f172a">Urban local bodies by population</text><rect x="50" y="70" width="240" height="110" rx="10" fill="#fde68a" stroke="#334155" stroke-width="2"/><text x="170.0" y="100.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Municipal Corporation</text><text x="170.0" y="120.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#0f172a">cities over 10 lakh people</text><text x="170.0" y="140.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#0f172a">head: Mayor</text><text x="170.0" y="160.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#0f172a">e.g. Chennai, Indore</text><rect x="330" y="70" width="240" height="110" rx="10" fill="#fed7aa" stroke="#334155" stroke-width="2"/><text x="450.0" y="110.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Municipal Council</text><text x="450.0" y="130.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#0f172a">towns of 1 to 10 lakh</text><text x="450.0" y="150.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#0f172a">also called Nagar Palika</text><rect x="610" y="70" width="240" height="110" rx="10" fill="#bbf7d0" stroke="#334155" stroke-width="2"/><text x="730.0" y="110.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Nagar Panchayat</text><text x="730.0" y="130.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#0f172a">smaller places changing</text><text x="730.0" y="150.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#0f172a">from rural to urban</text><rect x="250" y="240" width="400" height="60" rx="10" fill="#bae6fd" stroke="#334155" stroke-width="2"/><text x="450.0" y="265.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Wards</text><text x="450.0" y="285.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#0f172a">each ward elects its councillor or corporator</text><line x1="170" y1="180" x2="330" y2="240" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/><line x1="450" y1="180" x2="450" y2="240" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/><line x1="730" y1="180" x2="570" y2="240" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/></svg>