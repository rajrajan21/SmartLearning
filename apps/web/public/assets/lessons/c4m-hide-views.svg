<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="100%" role="img"><rect width="720" height="260" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="360" y="26" text-anchor="middle" font-size="18" font-weight="bold">One brick, three views</text><rect x="40" y="70" width="180" height="90" fill="#e8a87c" stroke="#222" stroke-width="3"/><text x="130" y="190" text-anchor="middle">Top view (long and wide)</text><rect x="270" y="70" width="180" height="45" fill="#e8a87c" stroke="#222" stroke-width="3"/><text x="360" y="145" text-anchor="middle">Front view (long and short)</text><rect x="520" y="70" width="90" height="45" fill="#e8a87c" stroke="#222" stroke-width="3"/><text x="565" y="145" text-anchor="middle">Side view (short end)</text><text x="360" y="230" text-anchor="middle" font-size="15" fill="#555">The same brick looks different when we look from different places.</text></g></svg>