<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="100%" role="img"><rect width="560" height="250" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="24" text-anchor="middle" font-weight="bold">Waste management: the 4R approach</text><rect x="10" y="55" width="125" height="80" rx="8" fill="#fadbd8" stroke="#333"/><text x="72.5" y="77" text-anchor="middle" font-size="12" font-weight="bold">Reduce</text><text x="72.5" y="94" text-anchor="middle" font-size="12">use less</text><rect x="145" y="55" width="125" height="80" rx="8" fill="#fdebd0" stroke="#333"/><text x="207.5" y="77" text-anchor="middle" font-size="12" font-weight="bold">Reuse</text><text x="207.5" y="94" text-anchor="middle" font-size="12">use again</text><rect x="280" y="55" width="125" height="80" rx="8" fill="#fcf3cf" stroke="#333"/><text x="342.5" y="77" text-anchor="middle" font-size="12" font-weight="bold">Recover</text><text x="342.5" y="94" text-anchor="middle" font-size="12">extract materials</text><rect x="415" y="55" width="125" height="80" rx="8" fill="#d5f5e3" stroke="#333"/><text x="477.5" y="77" text-anchor="middle" font-size="12" font-weight="bold">Recycle</text><text x="477.5" y="94" text-anchor="middle" font-size="12">make new items</text><text x="280" y="170" text-anchor="middle" font-size="13">Solid waste: segregation, sanitary landfill, incineration, composting</text><text x="280" y="195" text-anchor="middle" font-size="13">Sewage: pre-screening, aeration, sedimentation, disinfection, reuse</text><text x="280" y="220" text-anchor="middle" font-size="13">E-waste has lead, cadmium, mercury; only 5 percent is recycled</text></g></svg>