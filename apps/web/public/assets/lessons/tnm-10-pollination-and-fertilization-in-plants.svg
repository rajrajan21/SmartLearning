<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="100%" role="img"><rect width="560" height="300" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="24" text-anchor="middle" font-weight="bold">Double fertilization in a flowering plant</text><rect x="20" y="50" width="150" height="46" rx="8" fill="#fcf3cf" stroke="#333"/><text x="95" y="78" text-anchor="middle" font-size="14">Pollen grain on stigma</text><rect x="210" y="50" width="150" height="46" rx="8" fill="#fcf3cf" stroke="#333"/><text x="285" y="78" text-anchor="middle" font-size="14">Pollen tube to ovule</text><rect x="400" y="50" width="140" height="46" rx="8" fill="#fcf3cf" stroke="#333"/><text x="470" y="78" text-anchor="middle" font-size="14">2 male gametes</text><line x1="170" y1="73" x2="210" y2="73" stroke="#333" stroke-width="2"/><line x1="360" y1="73" x2="400" y2="73" stroke="#333" stroke-width="2"/><rect x="60" y="150" width="200" height="60" rx="8" fill="#d5f5e3" stroke="#333"/><text x="160" y="175" text-anchor="middle" font-size="14">Male gamete + egg (n + n)</text><text x="160" y="195" text-anchor="middle" font-size="13">SYNGAMY -> zygote (2n) -> embryo</text><rect x="300" y="150" width="200" height="60" rx="8" fill="#fadbd8" stroke="#333"/><text x="400" y="170" text-anchor="middle" font-size="13">Male gamete + 2 polar nuclei</text><text x="400" y="190" text-anchor="middle" font-size="13">TRIPLE FUSION -> endosperm (3n)</text><line x1="470" y1="96" x2="420" y2="150" stroke="#333" stroke-width="2"/><line x1="440" y1="96" x2="180" y2="150" stroke="#333" stroke-width="2"/><text x="280" y="250" text-anchor="middle" font-size="14">After fertilization: ovule becomes seed, ovary becomes fruit,</text><text x="280" y="272" text-anchor="middle" font-size="14">integuments become seed coat</text></g></svg>