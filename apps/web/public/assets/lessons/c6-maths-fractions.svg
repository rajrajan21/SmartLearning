<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="100%" role="img"><rect width="640" height="260" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="20" y="24" font-weight="bold">Fractions on a strip and on the number line</text><rect x="40" y="50" width="100" height="40" fill="#f9e79f" stroke="#7d6608" stroke-width="2"/><rect x="140" y="50" width="100" height="40" fill="#f9e79f" stroke="#7d6608" stroke-width="2"/><rect x="240" y="50" width="100" height="40" fill="#f9e79f" stroke="#7d6608" stroke-width="2"/><rect x="340" y="50" width="100" height="40" fill="#fdfefe" stroke="#7d6608" stroke-width="2"/><text x="120" y="76" font-size="14">3 x 1/4 = 3/4 of the strip</text><line x1="40" y1="170" x2="440" y2="170" stroke="#333" stroke-width="2"/><line x1="40" y1="162" x2="40" y2="178"/><text x="34" y="196" font-size="13">0/4</text><line x1="140" y1="162" x2="140" y2="178"/><text x="134" y="196" font-size="13">1/4</text><line x1="240" y1="162" x2="240" y2="178"/><text x="234" y="196" font-size="13">2/4</text><line x1="340" y1="162" x2="340" y2="178"/><text x="334" y="196" font-size="13">3/4</text><line x1="440" y1="162" x2="440" y2="178"/><text x="434" y="196" font-size="13">4/4</text><text x="40" y="150" font-size="14">0</text><text x="436" y="150" font-size="14">1</text><rect x="480" y="50" width="140" height="40" fill="#fdfefe" stroke="#1b4f72" stroke-width="2"/><rect x="480" y="50" width="70" height="40" fill="#aed6f1" stroke="#1b4f72" stroke-width="2"/><text x="490" y="76" font-size="13">1/2 = 2/4</text><text x="40" y="236" font-size="14">1/4 + 1/3 = 3/12 + 4/12 = 7/12 (same fractional unit first)</text></g></svg>