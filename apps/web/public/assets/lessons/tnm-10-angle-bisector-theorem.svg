<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="100%" role="img"><rect width="560" height="250" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="22" text-anchor="middle" font-weight="bold">Angle bisector theorem: BD / DC = AB / AC</text><polygon points="80,200 480,200 200,50" fill="#d6eaf8" stroke="#333" stroke-width="2"/><line x1="200" y1="50" x2="320" y2="200" stroke="#c0392b" stroke-width="2"/><circle cx="320" cy="200" r="4" fill="#c0392b"/><text x="70" y="218" font-size="14">B</text><text x="486" y="218" font-size="14">C</text><text x="195" y="44" font-size="14">A</text><text x="316" y="220" font-size="14">D</text><text x="200" y="215" font-size="12" text-anchor="middle">x</text><text x="400" y="218" font-size="12" text-anchor="middle">y</text><text x="500" y="90" font-size="12" text-anchor="end">AD bisects angle A</text><text x="500" y="112" font-size="12" text-anchor="end">so BD : DC = AB : AC</text></g></svg>