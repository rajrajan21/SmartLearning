<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="100%" role="img"><rect width="560" height="250" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="22" text-anchor="middle" font-weight="bold">Discriminant D = b^2 - 4ac decides the roots</text><line x1="20" y1="150" x2="180" y2="150" stroke="#555"/><path d="M40 60 Q100 260 160 60" fill="none" stroke="#1f618d" stroke-width="2"/><circle cx="64" cy="150" r="4" fill="#c0392b"/><circle cx="136" cy="150" r="4" fill="#c0392b"/><text x="100" y="205" text-anchor="middle" font-size="13">D &gt; 0: two real, unequal roots</text><line x1="200" y1="150" x2="360" y2="150" stroke="#555"/><path d="M220 60 Q280 240 340 60" fill="none" stroke="#1f618d" stroke-width="2"/><circle cx="280" cy="150" r="4" fill="#c0392b"/><text x="280" y="205" text-anchor="middle" font-size="13">D = 0: real and equal roots</text><line x1="380" y1="150" x2="540" y2="150" stroke="#555"/><path d="M400 100 Q460 200 520 100" fill="none" stroke="#1f618d" stroke-width="2"/><text x="460" y="205" text-anchor="middle" font-size="13">D &lt; 0: no real roots</text></g></svg>