<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 270" width="100%" role="img"><rect width="520" height="270" fill="#ffffff"/><g font-family="sans-serif" font-size="13" fill="#222" stroke-linecap="round" stroke-linejoin="round"><text x="260" y="24" font-size="15" fill="#2874a6" text-anchor="middle" font-weight="bold">The colonial era in India</text><line x1="150" y1="44" x2="150" y2="256" stroke="#999" stroke-width="3"/><text x="138" y="68" font-size="14" fill="#c0392b" text-anchor="end" font-weight="bold">1498</text><circle cx="150" cy="64" r="6" fill="#2874a6" stroke="#2874a6" stroke-width="1"/><text x="165" y="68" font-size="13" fill="#222" text-anchor="start" font-weight="normal">Vasco da Gama finds the sea route to India</text><text x="138" y="98" font-size="14" fill="#c0392b" text-anchor="end" font-weight="bold">1600</text><circle cx="150" cy="94" r="6" fill="#2874a6" stroke="#2874a6" stroke-width="1"/><text x="165" y="98" font-size="13" fill="#222" text-anchor="start" font-weight="normal">English East India Company begins</text><text x="138" y="128" font-size="14" fill="#c0392b" text-anchor="end" font-weight="bold">1741</text><circle cx="150" cy="124" r="6" fill="#2874a6" stroke="#2874a6" stroke-width="1"/><text x="165" y="128" font-size="13" fill="#222" text-anchor="start" font-weight="normal">Travancore defeats the Dutch at Colachel</text><text x="138" y="158" font-size="14" fill="#c0392b" text-anchor="end" font-weight="bold">1757</text><circle cx="150" cy="154" r="6" fill="#2874a6" stroke="#2874a6" stroke-width="1"/><text x="165" y="158" font-size="13" fill="#222" text-anchor="start" font-weight="normal">Battle of Plassey won by the Company</text><text x="138" y="188" font-size="14" fill="#c0392b" text-anchor="end" font-weight="bold">1764</text><circle cx="150" cy="184" r="6" fill="#2874a6" stroke="#2874a6" stroke-width="1"/><text x="165" y="188" font-size="13" fill="#222" text-anchor="start" font-weight="normal">Battle of Buxar won by the Company</text><text x="138" y="218" font-size="14" fill="#c0392b" text-anchor="end" font-weight="bold">1857</text><circle cx="150" cy="214" r="6" fill="#2874a6" stroke="#2874a6" stroke-width="1"/><text x="165" y="218" font-size="13" fill="#222" text-anchor="start" font-weight="normal">The revolt of 1857</text><text x="138" y="248" font-size="14" fill="#c0392b" text-anchor="end" font-weight="bold">1858</text><circle cx="150" cy="244" r="6" fill="#2874a6" stroke="#2874a6" stroke-width="1"/><text x="165" y="248" font-size="13" fill="#222" text-anchor="start" font-weight="normal">The Crown takes over: the British Raj begins</text></g></svg>