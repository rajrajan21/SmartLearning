<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" width="100%" role="img"><rect width="560" height="260" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="22" text-anchor="middle" font-weight="bold">Non-Cooperation to the Simon boycott</text><rect x="15" y="36" width="530" height="31" rx="6" fill="#fadbd8" stroke="#333"/><text x="23" y="57" font-size="12" font-weight="bold">Aug 1920</text><text x="130" y="57" font-size="12">Non-Cooperation begins, Nagpur session Dec 1920</text><rect x="15" y="72" width="530" height="31" rx="6" fill="#fcf3cf" stroke="#333"/><text x="23" y="93" font-size="12" font-weight="bold">5 Feb 1922</text><text x="130" y="93" font-size="12">Chauri Chaura: 22 policemen die, Gandhi withdraws</text><rect x="15" y="108" width="530" height="31" rx="6" fill="#d5f5e3" stroke="#333"/><text x="23" y="129" font-size="12" font-weight="bold">1 Jan 1923</text><text x="130" y="129" font-size="12">Swaraj Party founded by C.R. Das, Motilal Nehru</text><rect x="15" y="144" width="530" height="31" rx="6" fill="#d6eaf8" stroke="#333"/><text x="23" y="165" font-size="12" font-weight="bold">Nov 1927</text><text x="130" y="165" font-size="12">Simon Commission: all-white, boycotted</text><rect x="15" y="180" width="530" height="31" rx="6" fill="#ebdef0" stroke="#333"/><text x="23" y="201" font-size="12" font-weight="bold">1928</text><text x="130" y="201" font-size="12">Nehru Report: Dominion status, joint electorates</text><rect x="15" y="216" width="530" height="31" rx="6" fill="#fdebd0" stroke="#333"/><text x="23" y="237" font-size="12" font-weight="bold">1928</text><text x="130" y="237" font-size="12">Jinnah Fourteen Points rejected</text></g></svg>