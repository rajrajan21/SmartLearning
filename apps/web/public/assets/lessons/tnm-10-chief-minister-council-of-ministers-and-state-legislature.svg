<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="100%" role="img"><rect width="560" height="300" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="22" text-anchor="middle" font-weight="bold">State Government at a glance</text><rect x="10" y="40" width="170" height="110" rx="8" fill="#d6eaf8" stroke="#333"/><text x="95.0" y="62" text-anchor="middle" font-size="12" font-weight="bold">Executive</text><text x="95.0" y="79" text-anchor="middle" font-size="12">Governor (nominal)</text><text x="95.0" y="96" text-anchor="middle" font-size="12">Chief Minister (real)</text><text x="95.0" y="113" text-anchor="middle" font-size="12">Council of Ministers</text><rect x="195" y="40" width="170" height="110" rx="8" fill="#d5f5e3" stroke="#333"/><text x="280.0" y="62" text-anchor="middle" font-size="12" font-weight="bold">Legislature</text><text x="280.0" y="79" text-anchor="middle" font-size="12">Legislative Assembly</text><text x="280.0" y="96" text-anchor="middle" font-size="12">Legislative Council</text><text x="280.0" y="113" text-anchor="middle" font-size="12">(some states)</text><rect x="380" y="40" width="170" height="110" rx="8" fill="#fadbd8" stroke="#333"/><text x="465.0" y="62" text-anchor="middle" font-size="12" font-weight="bold">Judiciary</text><text x="465.0" y="79" text-anchor="middle" font-size="12">High Court</text><text x="465.0" y="96" text-anchor="middle" font-size="12">District Courts</text><text x="465.0" y="113" text-anchor="middle" font-size="12">other courts</text><rect x="10" y="165" width="265" height="100" rx="8" fill="#fcf3cf" stroke="#333"/><text x="142.5" y="187" text-anchor="middle" font-size="11" font-weight="bold">Legislative Assembly</text><text x="142.5" y="203" text-anchor="middle" font-size="11">60 to 500 members, 5-year term</text><text x="142.5" y="219" text-anchor="middle" font-size="11">Tamil Nadu: 235 (234 + 1 nominated)</text><rect x="285" y="165" width="265" height="100" rx="8" fill="#ebdef0" stroke="#333"/><text x="417.5" y="187" text-anchor="middle" font-size="11" font-weight="bold">Council of Ministers</text><text x="417.5" y="203" text-anchor="middle" font-size="11">at most 15 percent of Assembly</text><text x="417.5" y="219" text-anchor="middle" font-size="11">collectively responsible to it</text><text x="280" y="288" text-anchor="middle" font-size="13">Part VI of the Constitution, Articles 152 to 237</text></g></svg>