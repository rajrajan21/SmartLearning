<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="100%" role="img"><rect width="540" height="280" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="20" y="28" font-weight="bold">The same number in two naming systems: 9876501234</text><text x="20" y="62" font-weight="bold" fill="#c0392b">Indian system (3-2-2-2 from the right)</text><rect x="35" y="72" width="80" height="34" rx="5" fill="#fdebd0" stroke="#c0392b"/><text x="60" y="95" font-size="18">9</text><text x="42" y="124" font-size="13">arab</text><rect x="105" y="72" width="80" height="34" rx="5" fill="#fdebd0" stroke="#c0392b"/><text x="130" y="95" font-size="18">87</text><text x="112" y="124" font-size="13">crore</text><rect x="190" y="72" width="80" height="34" rx="5" fill="#fdebd0" stroke="#c0392b"/><text x="215" y="95" font-size="18">65</text><text x="197" y="124" font-size="13">lakh</text><rect x="275" y="72" width="80" height="34" rx="5" fill="#fdebd0" stroke="#c0392b"/><text x="300" y="95" font-size="18">01</text><text x="282" y="124" font-size="13">thousand</text><rect x="370" y="72" width="80" height="34" rx="5" fill="#fdebd0" stroke="#c0392b"/><text x="395" y="95" font-size="18">234</text><text x="377" y="124" font-size="13">ones</text><text x="20" y="165" font-weight="bold" fill="#1f618d">International system (3-3-3 from the right)</text><rect x="35" y="175" width="90" height="34" rx="5" fill="#d6eaf8" stroke="#1f618d"/><text x="60" y="198" font-size="18">9</text><text x="42" y="227" font-size="13">billion</text><rect x="125" y="175" width="90" height="34" rx="5" fill="#d6eaf8" stroke="#1f618d"/><text x="150" y="198" font-size="18">876</text><text x="132" y="227" font-size="13">million</text><rect x="245" y="175" width="90" height="34" rx="5" fill="#d6eaf8" stroke="#1f618d"/><text x="270" y="198" font-size="18">501</text><text x="252" y="227" font-size="13">thousand</text><rect x="360" y="175" width="90" height="34" rx="5" fill="#d6eaf8" stroke="#1f618d"/><text x="385" y="198" font-size="18">234</text><text x="367" y="227" font-size="13">ones</text><text x="20" y="262" font-size="14">1 lakh = 1,00,000 | 1 crore = 1,00,00,000 = 10 million | 1 arab = 100 crore = 1 billion</text></g></svg>