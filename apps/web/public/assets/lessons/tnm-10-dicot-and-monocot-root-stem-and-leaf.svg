<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="100%" role="img"><rect width="560" height="300" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="280" y="24" text-anchor="middle" font-weight="bold">Dicot (dorsiventral) leaf: section</text><rect x="60" y="50" width="440" height="22" fill="#a9dfbf" stroke="#333"/><text x="520" y="66" font-size="13">Upper epidermis (cuticle)</text><rect x="60" y="72" width="440" height="60" fill="#58d68d" stroke="#333"/><text x="280" y="108" text-anchor="middle" font-size="14">Palisade parenchyma (many chloroplasts)</text><rect x="60" y="132" width="440" height="80" fill="#abebc6" stroke="#333"/><text x="170" y="180" text-anchor="middle" font-size="14">Spongy parenchyma (air spaces)</text><circle cx="380" cy="165" r="26" fill="#fdebd0" stroke="#333"/><text x="380" y="162" text-anchor="middle" font-size="12">xylem</text><text x="380" y="176" text-anchor="middle" font-size="12">phloem</text><rect x="60" y="212" width="440" height="22" fill="#a9dfbf" stroke="#333"/><rect x="250" y="212" width="40" height="22" fill="#fff" stroke="#333"/><text x="520" y="228" font-size="13">Lower epidermis</text><text x="270" y="262" text-anchor="middle" font-size="13">Stoma (more in the lower epidermis)</text><text x="380" y="215" font-size="12" fill="#a04000">vascular bundle</text></g></svg>