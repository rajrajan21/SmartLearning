<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="100%" role="img"><rect width="600" height="250" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="20" y="24" font-size="15" font-weight="bold">5/2 parathas = 2 and 1/2 parathas</text><rect x="20" y="50" width="85" height="60" fill="#f9e79f" stroke="#333"/><text x="40" y="86" font-size="14">1/2</text><rect x="105" y="50" width="85" height="60" fill="#f9e79f" stroke="#333"/><text x="125" y="86" font-size="14">1/2</text><rect x="200" y="50" width="85" height="60" fill="#f9e79f" stroke="#333"/><text x="220" y="86" font-size="14">1/2</text><rect x="285" y="50" width="85" height="60" fill="#f9e79f" stroke="#333"/><text x="305" y="86" font-size="14">1/2</text><rect x="380" y="50" width="85" height="60" fill="#f9e79f" stroke="#333"/><text x="400" y="86" font-size="14">1/2</text><rect x="465" y="50" width="85" height="60" fill="#fff" stroke="#333"/><text x="485" y="86" font-size="14">1/2</text><text x="20" y="150" font-size="14">5 halves = 1 + 1 + 1/2 : two whole parathas and one half</text><text x="20" y="185" font-size="14">Same numerator: 4/5 > 4/6 (fifths are bigger pieces than sixths)</text><rect x="20" y="200" width="200" height="26" fill="#fff" stroke="#333"/><rect x="20" y="200" width="160" height="26" fill="#82e0aa" stroke="#333"/><text x="230" y="219" font-size="14">4/5</text><rect x="320" y="200" width="200" height="26" fill="#fff" stroke="#333"/><rect x="320" y="200" width="133" height="26" fill="#82e0aa" stroke="#333"/><text x="530" y="219" font-size="14">4/6</text></g></svg>