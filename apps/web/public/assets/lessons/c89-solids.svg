<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="100%" role="img"><rect width="520" height="320" fill="#ffffff"/><g font-family="sans-serif" font-size="15" fill="#222" stroke-linecap="round" stroke-linejoin="round"><polygon points="40,130 180,130 180,230 40,230" fill="#fdf2e9" stroke="#333" stroke-width="2"/><polygon points="40,130 80,100 220,100 180,130" fill="#fae5d3" stroke="#333" stroke-width="2"/><polygon points="180,130 220,100 220,200 180,230" fill="#f6ddcc" stroke="#333" stroke-width="2"/><text x="100" y="255" font-size="15" fill="#222" text-anchor="start">l</text><text x="196" y="265" font-size="15" fill="#222" text-anchor="start">b</text><text x="228" y="165" font-size="15" fill="#222" text-anchor="start">h</text><text x="30" y="290" font-size="14" fill="#2874a6" text-anchor="start">Cuboid: V = l × b × h</text><text x="30" y="312" font-size="14" fill="#2874a6" text-anchor="start">TSA = 2(lb + bh + hl)</text><ellipse cx="400" cy="90" rx="60" ry="18" fill="#d6eaf8" stroke="#333" stroke-width="2"/><path d="M340 90 L340 210 A60 18 0 0 0 460 210 L460 90" fill="#eaf4fb" stroke="#333" stroke-width="2"/><line x1="400" y1="90" x2="460" y2="90" stroke="#c0392b" stroke-width="2"/><text x="420" y="84" font-size="15" fill="#c0392b" text-anchor="start">r</text><line x1="470" y1="90" x2="470" y2="210" stroke="#1e8449" stroke-width="2"/><text x="478" y="155" font-size="15" fill="#1e8449" text-anchor="start">h</text><text x="310" y="265" font-size="14" fill="#2874a6" text-anchor="start">Cylinder: V = πr²h</text><text x="310" y="287" font-size="14" fill="#2874a6" text-anchor="start">CSA = 2πrh</text><text x="310" y="309" font-size="14" fill="#2874a6" text-anchor="start">TSA = 2πr(r + h)</text></g></svg>