<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 235" width="100%" role="img"><rect width="700" height="235" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><circle cx="200" cy="120" r="90" fill="#fdf3d8" stroke="#333" stroke-width="3"/><line x1="110" y1="120" x2="290" y2="120" stroke="#c0392b" stroke-width="4"/><line x1="200" y1="120" x2="264" y2="56" stroke="#2e86ab" stroke-width="4"/><circle cx="200" cy="120" r="5" fill="#222"/><text x="188" y="145" font-size="15">Centre</text><text x="238" y="100" font-size="15" fill="#2e86ab">radius</text><text x="120" y="112" font-size="15" fill="#c0392b">diameter</text><text x="340" y="80" font-size="15">The diameter passes through the centre.</text><text x="340" y="108" font-size="15">Diameter = 2 x radius.</text><text x="340" y="136" font-size="15">Radius = half of the diameter.</text><text x="340" y="164" font-size="15">All radii of a circle are equal.</text></g></svg>