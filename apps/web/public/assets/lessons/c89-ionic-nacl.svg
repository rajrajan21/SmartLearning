<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 310" width="100%" role="img"><rect width="520" height="310" fill="#ffffff"/><g font-family="sans-serif" font-size="14" fill="#222" stroke-linecap="round" stroke-linejoin="round"><text x="260" y="22" font-size="15" fill="#2874a6" text-anchor="middle" font-weight="bold">Ionic bond in sodium chloride: electron transfer</text><circle cx="70" cy="100" r="32" fill="#eaf4fb" stroke="#333" stroke-width="2"/><text x="70" y="104" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">Na</text><text x="70" y="150" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">2, 8, 1</text><circle cx="200" cy="100" r="22" fill="#fdebd0" stroke="#c0392b" stroke-width="2"/><text x="200" y="105" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold">Na+</text><text x="200" y="150" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">2, 8</text><circle cx="330" cy="100" r="32" fill="#eaf4fb" stroke="#333" stroke-width="2"/><text x="330" y="104" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">Cl</text><text x="330" y="150" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">2, 8, 7</text><circle cx="460" cy="100" r="38" fill="#d6eaf8" stroke="#2874a6" stroke-width="2"/><text x="460" y="105" font-size="14" fill="#2874a6" text-anchor="middle" font-weight="bold">Cl–</text><text x="460" y="156" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">2, 8, 8</text><line x1="105" y1="100" x2="172" y2="100" stroke="#555" stroke-width="1.5"/><polygon points="172,100 163,95 163,105" fill="#555"/><text x="138" y="92" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="normal">loses 1 e–</text><line x1="365" y1="100" x2="418" y2="100" stroke="#555" stroke-width="1.5"/><polygon points="418,100 409,95 409,105" fill="#555"/><text x="392" y="92" font-size="12" fill="#2874a6" text-anchor="middle" font-weight="normal">gains 1 e–</text><line x1="110" y1="58" x2="300" y2="58" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5"/><polygon points="300,58 292,54 292,62" fill="#c0392b"/><text x="205" y="52" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="normal">the electron moves to chlorine</text><circle cx="215" cy="235" r="22" fill="#fdebd0" stroke="#c0392b" stroke-width="2"/><text x="215" y="240" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold">Na+</text><circle cx="275" cy="235" r="38" fill="#d6eaf8" stroke="#2874a6" stroke-width="2"/><text x="275" y="240" font-size="14" fill="#2874a6" text-anchor="middle" font-weight="bold">Cl–</text><text x="260" y="292" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">Opposite charges attract: the electrostatic attraction is the ionic bond (NaCl)</text></g></svg>