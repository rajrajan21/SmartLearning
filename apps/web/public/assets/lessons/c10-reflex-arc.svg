<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="100%" role="img"><rect width="560" height="300" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222" stroke-linecap="round"><rect x="40" y="120" width="100" height="40" fill="#fadbd8" stroke="#333"/><text x="55" y="145" font-size="13" fill="#222">Receptor (skin)</text><rect x="240" y="40" width="110" height="40" fill="#d6eaf8" stroke="#333"/><text x="250" y="65" font-size="14" fill="#222">Spinal cord</text><rect x="420" y="120" width="100" height="40" fill="#d5f5e3" stroke="#333"/><text x="435" y="145" font-size="12" fill="#222">Effector (muscle)</text><line x1="140" y1="140" x2="240" y2="65" stroke="#2471a3" stroke-width="3"/><line x1="350" y1="65" x2="420" y2="140" stroke="#27ae60" stroke-width="3"/><text x="150" y="85" font-size="13" fill="#222">sensory neuron</text><text x="380" y="85" font-size="13" fill="#222">motor neuron</text><text x="150" y="250" font-size="14" fill="#222">Reflex arc: receptor → sensory neuron → spinal cord → motor neuron → effector</text></g></svg>