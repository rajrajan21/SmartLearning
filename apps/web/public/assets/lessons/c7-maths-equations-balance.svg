<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" width="100%" role="img"><rect width="700" height="260" fill="#ffffff"/><g font-family="sans-serif" font-size="16" fill="#222"><text x="20" y="24" font-weight="bold">An equation is a balanced scale</text><line x1="60" y1="130" x2="340" y2="130" stroke="#333" stroke-width="4"/><polygon points="200,130 180,190 220,190" fill="#999"/><rect x="70" y="96" width="100" height="34" fill="#d6eaf8" stroke="#1f618d"/><text x="84" y="119" font-size="16">5x - 4</text><rect x="230" y="96" width="100" height="34" fill="#d5f5e3" stroke="#1e8449"/><text x="268" y="119" font-size="16">7</text><text x="60" y="226" font-size="14">Do the same to both pans and it stays balanced.</text><text x="400" y="52" font-weight="bold" font-size="15">Solve 5x - 4 = 7</text><text x="400" y="82" font-size="14">5x - 4 = 7</text><text x="400" y="110" font-size="14">add 4 to both sides: 5x = 11</text><text x="400" y="138" font-size="14">divide both sides by 5: x = 11/5 = 2.2</text><text x="400" y="166" font-size="14">check: 5 × 2.2 - 4 = 11 - 4 = 7 ✓</text><text x="400" y="214" font-weight="bold" font-size="15">Matchsticks: 2n + 1 = 99</text><text x="400" y="240" font-size="14">2n = 98, so n = 49</text></g></svg>